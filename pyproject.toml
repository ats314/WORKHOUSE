[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workhouse"
version = "0.1.0"
description = "Machine-checkable ledger and symbolic verification suite for the SU(N) cubic flux-band spectral program"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "sympy>=1.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
workhouse = "workhouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
