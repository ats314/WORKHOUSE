name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete — don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Toolchains are set up only when the repo actually contains that stack,
      # so this workflow stays correct as WORKHOUSE grows into whatever it becomes.
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != ''
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Lint and test
        run: bash scripts/check.sh

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh .claude/hooks/*.sh

  # The T0 tier means "Lean 4 compiles it, no sorry" — which is only true if
  # something actually compiles it. The session brief counts theorems by
  # regex; this job is what makes a green run mean the proofs check.
  lean:
    name: Lean (T0)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The restore has died mid-step and taken the job with it (~164s stuck
      # in restore, later steps never ran — PR #32 run 33134685713; same
      # fast-fail signature on PR #31 2026-08-26 and two earlier PR #32
      # runs). A lost cache only costs a cold elan install plus
      # `lake exe cache get`, both well inside the job budget, so a cache
      # outage must degrade, not fail: bound the step and continue.
      - name: Cache elan and mathlib
        uses: actions/cache@v5
        continue-on-error: true
        timeout-minutes: 8
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      # The two network steps below get the same treatment for their own
      # transient failures: retry, but still fail closed — the proof check
      # itself is never skipped.
      - name: Install elan
        run: |
          for i in 1 2 3; do
            if [ -x "$HOME/.elan/bin/elan" ]; then break; fi
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none && break
            echo "elan install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep $((i * 10))
          done
          [ -x "$HOME/.elan/bin/elan" ]
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch mathlib cache and build
        working-directory: lean
        run: |
          got_cache=""
          for i in 1 2 3; do
            if lake exe cache get; then got_cache=1; break; fi
            echo "lake exe cache get attempt $i failed; retrying in $((i * 10))s" >&2
            sleep $((i * 10))
          done
          [ -n "$got_cache" ]
          lake build
          echo "Lean core: proof-checked, no sorries"
