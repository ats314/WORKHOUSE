name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete — don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select checks for changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Classify changed inputs
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$CI_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci_scope.py --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  check:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a valid scope decision
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_FULL: ${{ needs.scope.outputs.full }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "CI scope selection failed; checks cannot be treated as passed."
            exit 1
          fi
          case "$SCOPE_FULL" in
            true|false) ;;
            *) echo "CI scope selection returned an invalid result."; exit 1 ;;
          esac
      - uses: actions/checkout@v7

      # The documentation/help path only needs Python. Full checks retain
      # the existing stack detection and verification entry points.
      - name: Set up Node
        if: needs.scope.outputs.full == 'true' && hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != ''
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        if: needs.scope.outputs.full == 'true' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Bootstrap
        if: needs.scope.outputs.full == 'true'
        run: bash scripts/bootstrap.sh

      - name: Lint and test
        if: needs.scope.outputs.full == 'true'
        run: bash scripts/check.sh

      - name: Install documentation and help check dependencies
        if: needs.scope.outputs.full == 'false'
        run: python -m pip install -e ".[dev]"

      - name: Check documentation and help
        if: needs.scope.outputs.full == 'false'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python scripts/check_docs.py
          python -m pytest tests/test_briefing.py tests/test_docs.py tests/test_ci_scope.py -q
          python -m workhouse.cli brief --help

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh .claude/hooks/*.sh

  # Full verification compiles Lean with no sorry. A documentation/help run
  # skips this job and does not claim fresh proof-checking evidence.
  lean:
    name: Lean (T0)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The restore repeatedly died MID-STEP and took the job with it —
      # continue-on-error could not catch it (the abort is runner-level,
      # not a step failure): runs 33133472692, 33134685713, 33134902449,
      # 33135625325 all died inside this step, while the cache-free jobs
      # stayed green and githubstatus reported no incident. The cache key
      # had been identical since before 2026-08-24 (toolchain unchanged)
      # and worked until then, so the standing diagnosis is a corrupted
      # entry under the old key: the v2- prefix abandons it. A miss only
      # costs a cold elan install plus `lake exe cache get`, both well
      # inside the job budget, so restore trouble must degrade, not fail.
      - name: Cache elan and mathlib
        uses: actions/cache@v6
        continue-on-error: true
        timeout-minutes: 8
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-v2-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      # Both network steps live in scripts/bootstrap-lean.sh so that a
      # contributor's `make lean-setup` and this job install the same thing;
      # the script keeps the retry-but-fail-closed handling they had here.
      - name: Install the T0 toolchain
        run: bash scripts/bootstrap-lean.sh
      # `make lean` rather than a bare `lake build`, so CI exercises the entry
      # point contributors actually use — including its --wfail gate, without
      # which a `sorry` only warns and the build still exits 0.
      - name: Proof-check
        run: make lean

  # The 2026-08-28 agent experience notes hit two Windows-only failures: a
  # cp1252 decode crash in `workhouse why` and backslash paths making the
  # generated graph differ bytewise from the checked-in one. This job runs
  # with UTF-8 mode NOT forced (no PYTHONUTF8) so locale-dependent reads and
  # OS-native path serialization are caught, not papered over.
  windows-smoke:
    name: Windows smoke (encoding and path determinism)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[dev]"
      - name: why C2 decodes without UTF-8 mode
        run: python -m workhouse.cli why C2
      - name: regenerated catalogue is byte-identical to the checked-in one
        run: |
          python -m workhouse.cli index -w
          git diff --exit-code index/
      - name: CLI regression tests
        run: python -m pytest tests/test_cli.py -q
