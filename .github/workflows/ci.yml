name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete — don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Toolchains are set up only when the repo actually contains that stack,
      # so this workflow stays correct as WORKHOUSE grows into whatever it becomes.
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != ''
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Lint and test
        run: bash scripts/check.sh

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh .claude/hooks/*.sh

  # The T0 tier means "Lean 4 compiles it, no sorry" — which is only true if
  # something actually compiles it. The session brief counts theorems by
  # regex; this job is what makes a green run mean the proofs check.
  lean:
    name: Lean (T0)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The restore repeatedly died MID-STEP and took the job with it —
      # continue-on-error could not catch it (the abort is runner-level,
      # not a step failure): runs 33133472692, 33134685713, 33134902449,
      # 33135625325 all died inside this step, while the cache-free jobs
      # stayed green and githubstatus reported no incident. The cache key
      # had been identical since before 2026-08-24 (toolchain unchanged)
      # and worked until then, so the standing diagnosis is a corrupted
      # entry under the old key: the v2- prefix abandons it. A miss only
      # costs a cold elan install plus `lake exe cache get`, both well
      # inside the job budget, so restore trouble must degrade, not fail.
      - name: Cache elan and mathlib
        uses: actions/cache@v5
        continue-on-error: true
        timeout-minutes: 8
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-v2-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      # The two network steps below get the same treatment for their own
      # transient failures: retry, but still fail closed — the proof check
      # itself is never skipped.
      - name: Install elan
        run: |
          for i in 1 2 3; do
            if [ -x "$HOME/.elan/bin/elan" ]; then break; fi
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none && break
            echo "elan install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep $((i * 10))
          done
          [ -x "$HOME/.elan/bin/elan" ]
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch mathlib cache and build
        working-directory: lean
        run: |
          got_cache=""
          for i in 1 2 3; do
            if lake exe cache get; then got_cache=1; break; fi
            echo "lake exe cache get attempt $i failed; retrying in $((i * 10))s" >&2
            sleep $((i * 10))
          done
          [ -n "$got_cache" ]
          lake build
          echo "Lean core: proof-checked, no sorries"

  # The 2026-08-28 agent experience notes hit two Windows-only failures: a
  # cp1252 decode crash in `workhouse why` and backslash paths making the
  # generated graph differ bytewise from the checked-in one. This job runs
  # with UTF-8 mode NOT forced (no PYTHONUTF8) so locale-dependent reads and
  # OS-native path serialization are caught, not papered over.
  windows-smoke:
    name: Windows smoke (encoding and path determinism)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[dev]"
      - name: why C2 decodes without UTF-8 mode
        run: python -m workhouse.cli why C2
      - name: regenerated catalogue is byte-identical to the checked-in one
        run: |
          python -m workhouse.cli index -w
          git diff --exit-code index/
      - name: CLI regression tests
        run: python -m pytest tests/test_cli.py -q
