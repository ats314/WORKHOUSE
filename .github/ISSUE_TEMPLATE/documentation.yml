name: Documentation or provenance correction
description: Report stale guidance, broken navigation or an unclear source/proof connection
body:
  - type: input
    id: location
    attributes:
      label: Page, path or claim ID
      description: Include the GitHub URL or checkout commit when possible.
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: What is stale, missing or difficult to follow?
      description: Distinguish a problem in current guidance from a statement preserved in a dated source.
    validations: { required: true }
  - type: textarea
    id: correction
    attributes:
      label: Supporting source or proposed correction
      description: Link the current derivation, proof, ledger record or command output. If unknown, describe the information needed to resolve it.
