      global assembly, G17 uniformity and G18 interpolator suites. The
      publication edition of 2026-08-29 that carries those lemma numbers was
      NOT ingested: its \chk labels name seven checks that no longer exist,
      one of them because this repository later renamed
      '...at L = 3 and 4' to '...at L = 3, 4, 5' after the tex had been
      pinned byte-for-byte. Ingesting it fails the \chk resolution check;
      the checks themselves pass and are unaffected. Recorded as unresolved
      rather than pointed at the rev5 edition already in paper/, whose lemma
      numbering is different -- a plausible wrong mapping is exactly what
      this field exists to prevent. Resolving it means rebuilding the
      edition against current check names and pinning that.
