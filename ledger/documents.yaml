  - alias: YM_BALABAN_MULTISCALE
    path: docs/derivations/yangmills-continuum-balaban-multiscale-proof.md
    standing: quarantined
    title: Proposed multiscale Balaban continuum construction with combined proof audits
    note: |
      An incoming submission claiming a complete continuum construction on R^4 and a mass gap for SU(N). Registered so it is not cited as a discharged input; cite only as a submitted claim. It has absorbed the BC2 audit: Lemma 3.2 now averages the ADJOINT FLUCTUATION relative to a transforming background and records BC2's counterexample with the residual 1/16, citing the check `_connection_average`. Two repairs to the remaining defects were then assessed. R2, flipping the small-field curvature threshold from g^(-kappa) a^(-2) to g^(+kappa) a^(-2), IS a repair. The suppression exponent is untouched, because the action budget on the ball is theta^2 rho^4/(16 g^2) and equals g^(2 kappa) under either convention; the threshold still contains typical configurations, whose curvature is of order g a^(-2), with margin g^(1-kappa); and (3.10) then gives delta <= C_B g^(+kappa)/L^2, monotone decreasing, so one condition on g_0 discharges (5.13) at every scale rather than failing in the ultraviolet. It also repairs Proposition 3.4's coercivity, which failed for the same reason. Registered as `_threshold_sign`. R1, replacing the constraint by the background-relative adjoint average Q_(A_(k+1))(B - A_(k+1)), has correct barycenter algebra and repairs more than it was asked to: with A_(k+1) frozen the constraint map is affine in B, so (3.9) and (3.11) become genuine Euler-Lagrange and second-variation identities, and the g/g' mismatch between Definition 3.1 and Proposition 3.4 disappears. It nevertheless does NOT restore gauge invariance of the penalty, because (3.7) integrates the SCALAR interpolation (3.3), and scalar interpolation of adjoint values living in different fibers is not equivariant: two cells carrying the same value T_3 with weights 1/2 and Ad(g_2) the rotation by pi about axis 1 send the penalty density from 1 to 0, a relative residual of 1. Registered as `_adjoint_interpolation`. The surviving variant is transported interpolation into a common frame, or a pure barycenter-sum penalty, with the gauge condition promoted to a Lorenz gauge on B itself and Q_(B_k) retained in section 5 - propagating the difference operator into (5.3) and (5.5) is a category error, since z is already adjoint and (5.11) already uses Q_(B_k). Assessing the repairs exposed four further defects that are not caused by them. Proposition 3.4 part 1 is false as proved: Q^*Q is an order-zero averaging operator contributing nothing to the principal symbol, the symbol of D_nu F_(nu mu) is degenerate on longitudinal modes, and on high-frequency pure-gauge directions the mass term decays where (3.12) demands a constant; (3.11) also writes the covariant Dirichlet form rather than the Yang-Mills Hessian. The coarse-action subtraction after (4.7) omits the 1/(4 g^2) prefactor of its own action, and once restored both sides carry g^(-(2-2 kappa)), so epsilon_0 is a competition of constants and is not established under either sign; registered as `_coarse_subtraction`. The reflection-positivity step (8.8)-(8.9) needs an explicit blocking map A_k to A_(k+1) to push forward, which R1 removes. And the mollifier (2.6) is not gauge invariant, so the coarse configuration space is not either. Standing stays quarantined, now for a positive reason rather than by default: one audit pass over sections 3 to 5 found six defects, of which one is repaired, one has a named surviving variant, and four are open. That audit covers sections 3 to 5. The separate WILSON_G19_REVIEW reads the subsequent RG, limit and mass passages: even granting (7.6), its O(1/k) expectation increments do not imply the Cauchy conclusion in Theorem 7.1, which invokes summability of 1/k^2. The entropy-weight recursion (6.10) is incompatible with the positive mass margin in (8.14). The review derives a sufficient summable actual map/source drift repair and retains the accepted local identities. Imported Continuum_Combined.lean proves scalar limits and inequalities without an actual continuum measure or Hamiltonian; it is outside the active Workhouse Lean build. This alias records the submitted source and both audits, not a discharged continuum input.
