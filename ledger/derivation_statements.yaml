    statement: At the antipodal sphere M, the 9D Hessian has 7 normal eigenvalues >= 4(sqrt(2)-1) > 0, gauge invariance implies d sigma_g|_(TM) = 0, and the potential floor v_*(pi) = 16 - 8 sqrt(2) > 0 provides an O(g^-2) budget.
