      inverses R0 and Rg.
    - Set u=R0 t and r=(Ag-A0)u; the current factorization <r,v>=g<j,Yv> holds for every v.
    - kappa>0 and <v,Ag v> >= kappa ||Yv||^2 for every v; Y need not be injective.
    - The nonnegative source weight b and nonnegative current constant CJ obey ||j||^2 <= CJ b.
