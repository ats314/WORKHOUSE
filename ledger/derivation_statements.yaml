  statements:
  - id: DERIV:SOURCE_CURRENT_BRIDGES:SCB0A
    statement: For real Hilbert spaces E and L, a bounded linear map Y from E to L, a vector j in L, real
      g, and positive kappa, any energy function satisfying a(v) >= kappa times the squared norm of Yv
      obeys 2g times the inner product of j and Yv minus a(v) <= g squared times the squared norm of j
      divided by kappa. The map Y may have a kernel and no inverse operator is required.
    locator: '## SCB0A. Degenerate energy variational certificate (lines 21-34)'
    anchor: '## SCB0A. Degenerate energy variational certificate'
    source_labels:
    - SCB0A
    status: proven
    evidence: analytic
    hypotheses:
    - E and L are real Hilbert spaces and Y:E->L is bounded linear.
    - j belongs to L, g is real, kappa is strictly positive, and a(v) >= kappa ||Yv||^2 for every tested
      v.
    - The residual is the specified functional rho(v)=g<j,Yv>; its vanishing on ker(Y) follows from this
      factorization.
    - For an unbounded form-domain application, all pairings and the lower energy inequality must be justified
      on the common tested domain.
    depends_on: []
    lean: []
    remaining: The abstract bounded-map variational inequality is fully encoded by factored_variational_energy_without_inverse.
      Its application to actual unbounded Wilson form-domain derivative maps and an actual model residual
      requires the separately supplied current factorization, domains, and lower energy. This statement
      does not require or construct an inverse and does not close W6.
    lean_support:
    - name: factored_variational_energy_without_inverse
      scope: This is the inverse-free statement. Y need not be injective. The function a is not required
        to be a quadratic, closed, continuous, or physically realized form; such realizations and supremum/Riesz
        constructions are separate application steps.
  - id: DERIV:SOURCE_CURRENT_BRIDGES:SCB0B
    statement: For bounded self-adjoint reference and interacting operators with their actual bounded
      inverses, the factored residual current controls its selected inverse energy without consuming a
      uniform inverse-norm bound. If the current norm squared is at most CJ b, the interacting form dominates
      kappa ||Yv||^2, the diagonal defect is at most a|g|b, and |g| <= g0, then the absolute selected
      inverse difference is at most (a+g0 CJ/kappa)|g|b.
    locator: '## SCB0B. Bounded-inverse W6 composition (lines 35-59)'
    anchor: '## SCB0B. Bounded-inverse W6 composition'
    source_labels:
    - SCB0B
    status: proven
    evidence: analytic
    hypotheses:
