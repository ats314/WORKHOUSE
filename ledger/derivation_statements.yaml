  - id: DERIV:MOVING_TIME_SPECTRAL_GAP:OPTIMAL_BUDGET
    statement: For raw bound K_n(t)<=A a_n^-p exp(-m t)+B a_n^r and |alpha_n|>=c_alpha a_n^s, the optimized
      moving-time gap is M_*=m(r-2s)/(p+r) at t_n=((p+r)/m)log(1/a_n), provided r>2s. A horizon c_max
      uses c_opt=min(c_max,(p+r)/m) and M_opt=min(m-(p+2s)/c_opt,(r-2s)/c_opt). Positive guarantees require
      c_max>(p+2s)/m. One-atom measures prove sharpness, including the shortened-horizon case.
    locator: '## 4. Optimal power-law budget and finite observation horizon (MT4) (lines 127-179)'
    anchor: '## 4. Optimal power-law budget and finite observation horizon (MT4)'
    source_labels:
    - MT4
