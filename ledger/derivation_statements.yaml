  - id: DERIV:SOURCE_CURRENT_BRIDGES:SCB5
    statement: For bounded real observables on a probability space, centered exponentials satisfy ||(exp(alpha
      f)-E exp(alpha f))/alpha-(f-Ef)||_2 <= |alpha| B^2 exp(|alpha|B) when |f|<=B. Therefore a bounded
      operator killing arbitrarily small nonzero exponential sources kills their centered observable limits.
      If those limits have dense span in the intended vacuum-orthogonal space and each source has an actual
      positive spectral correlation bounded by a source-dependent finite prefactor times exp(-m t) at
      arbitrarily late physical times with one common m>0, the low-energy spectral projection below m
      vanishes on that whole space. No uniform footprint radius or common source prefactor is needed for
      this implication.
    locator: '## SCB5. Tiny exponential sources imply totality by differentiation (lines 258-298)'
    anchor: '## SCB5. Tiny exponential sources imply totality by differentiation'
    source_labels:
    - SCB5
    status: proven
    evidence: analytic
    hypotheses:
    - mu is a probability measure and each real observable f is measurable and bounded by its own finite
      B.
    - For every f there is a sequence of nonzero admissible real alpha tending to zero; the sequence and
      admissible window may depend on f.
    - The centered observable family has dense linear span in the explicitly intended vacuum-orthogonal
      Hilbert space.
    - The Hamiltonian and source spectral measures have the actual positive spectral representation in
      the same physical clock.
    - One rate m>0 is common to all sources, while each fixed source has a finite prefactor and a decay
      inequality along times unbounded above. Source-dependent onset times are allowed.
    - Gauge or charge-sector use additionally requires the actual invariant-core density and commuting
      measure-preserving symmetry projections; plaquette traces alone are not assumed total.
    depends_on: []
    lean: []
    remaining: The uniform Taylor remainder and tangent-density composition are analytic. Existing Lean
      statements construct actual centered L2 exponential sources and prove positive-spectral decay exclusion
      and total-family reconstruction under their displayed all-time decay hypotheses. The source-dependent
      late-time variant and the tangent-to-totality composition are not claimed wholly formalized here.
      The finite dark-state control demonstrates that omitting totality invalidates the conclusion. No
      actual continuum spectral representation, common limiting physical rate, or nonzero source limit
      is established by this abstract bridge.
    lean_support:
    - name: centeredExpL2_orthogonal_constants
      scope: The existing centered exponential L2 vector is orthogonal to constants under its probability-space
        and integrability hypotheses; not the tangent limit or source totality.
    - name: laplace_decay_excludes_low_energy
      scope: The existing positive spectral-measure exclusion theorem with its own all-time decay hypothesis;
        the source-dependent arbitrarily-late-time extension in SCB5 is analytic.
    - name: total_family_spectral_projection_gap
      scope: The existing total-family spectral projection conclusion with its stated decay and density
        inputs; no actual Wilson continuum source identification is supplied.
  - id: DERIV:SOURCE_CURRENT_BRIDGES:SCB6
    statement: For a finite footprint with N>0, let X be its summed observable and K(s)=log E exp(sX).
      If the actual tilted susceptibility satisfies K''(s)<=sigma N throughout the interval joining zero
      to 2alpha, the partition-normalized centered exponential Yalpha=exp(alpha X)/E exp(alpha X)-1 has
      squared norm at most exp(sigma N alpha^2)-1. Consequently alpha=t/sqrt(N) gives a footprint-uniform
      bound exp(sigma t^2)-1. A lower tilted susceptibility kappa N gives the corresponding noncollapse
      lower bound exp(kappa t^2)-1.
    locator: '## SCB6. Uniform normalized mesoscopic source amplitudes (lines 299-316)'
    anchor: '## SCB6. Uniform normalized mesoscopic source amplitudes'
    source_labels:
    - SCB6
    status: proven
    evidence: analytic
    hypotheses:
    - The footprint cardinality N is strictly positive and the exponential moments at the required parameters
      exist and are finite.
    - K(0)=0 and conditional/exponential-moment differentiation is justified on the interval joining zero
      to 2alpha.
    - The upper susceptibility bound K''(s)<=sigma N holds throughout that entire tilted interval with
      nonnegative sigma; unweighted variance at zero alone is insufficient.
    - For the optional noncollapse conclusion, K''(s)>=kappa N also holds throughout the interval with
      positive kappa and the chosen t is nonzero.
    - The source is the displayed partition-normalized mesoscopic source, not the raw fixed-alpha exponential
      in the existing radius obstruction.
    depends_on: []
    lean: []
    remaining: The normalized variance and double-integral cumulant identities and their bound are analytic
      consequences of the stated differentiability and susceptibility assumptions. Python verifies the
      normalization algebra and exact polynomial double-integral controls, not general differentiability
      or an actual Wilson tilted-susceptibility estimate. This source-family replacement does not discharge
      the raw fixed-alpha source-radius problem, an interacting source frame, or continuum nontriviality.
