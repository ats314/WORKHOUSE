      gapless in the theorem name does not remove them. The actual finite-g coupled Wilson factorization,
      uniform source current bound, diagonal estimate, and any extension to unbounded closed forms remain
      application obligations.
    lean_support:
    - name: factored_inverse_energy_without_uniform_gap
      scope: The lower-energy map Y can have a kernel. Ag and Rg remain bounded operators with an explicit
        right-inverse identity. Self-adjointness, a left inverse, and completeness are not hypotheses
        of this particular theorem. It supplies no unbounded inverse or Wilson current construction.
