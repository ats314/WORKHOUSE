  - id: DERIV:SOURCE_CURRENT_BRIDGES:SCB4
    statement: For the actual normalized conditional ground density and a retained-only coarse cometric
      A(U), a finite-cost current representing the intrinsic score as s_a=-div_rho(J_a) gives the exact
      cross-form current identity and the bound |h[f,v]|^2 <= Jcost[f] ell_F[v]. If the parameter-density
