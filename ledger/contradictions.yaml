  - id: C1
    title: Fourth-order rest scalar — dissolved, an anchoring distinction
    status: resolved
    section: "§5.5"
    resolution: >
      NOT a contradiction. q_band^(4) and m_Gamma^(4) are not two competing
      estimates of the same scalar coordinate: the first is a band-kernel
      anchor, the second a vacuum-subtracted physical Gamma-point coefficient.
      They are differently anchored coordinates related by a translation-local
      scalar shift, and such a shift cannot change the centered operator, its
      eigenvectors, the SOS factorization, the mobility coefficients, or the
      bandwidth. The apparent conflict was a terminology collision.
    terminology:
      correct: ["q_band^(4)", "m_Gamma^(4)"]
      forbidden: "two m_4 values"
      why: >
        Naming both "m_4" regenerates the false contradiction every time the
        register is re-read. Use the anchored names.
    quantities:
      - label: q_band^(4) — band-kernel anchor
        value: "-20721577909065127111/7250590288602460800"
        decimal: -2.857915988114559
        kind: exact-rational
        source: "[T1PM]/[GCSG]"
      - label: m_Gamma^(4) — vacuum-subtracted physical Gamma-point coefficient
        value: -0.7751458630189173
        kind: float
        source: "[RUN15]/[GLUE3]"
      - label: quarantined shortcut
        value: "-160506019419340168451/14501180577204921600"
        decimal: -11.068479463778765
        kind: exact-rational
        status: rejected-by-both
    delta_gamma: 2.0827701250956417
    delta_gamma_as_printed: 2.0827701250956414
    machine_finding: >
      The register prints Delta_Gamma as 2.0827701250956414. Evaluated in high
      precision the difference is 2.082770125095641678..., which correctly
      rounds to ...417. The printed value is one ulp low because q_band^(4) is
      rounded to a double before the subtraction. Cosmetic, but the printed
      digit is not the correctly rounded one.
    external_validation: >
      m_Gamma^(4) reproduces Hamer's axial fourth-order coefficient through the
      bridge m_n = 2**(n-1) * a_n: 8 * a_4 = -0.7751458630184, agreeing to
      5.2e-13. The oracle was generated with the historical target disabled and
      recovered m_1, m_2, m_3 first, so this is substantive external validation,
      not internal bookkeeping.
    by_construction_caveat: >
      Distinguish two statements. (1) The oracle value itself is an independent
      blind reconstruction — substantive. (2) The final assembled mass-kernel
      rest value is FORCED to equal the oracle, because the source computes
      local_shift = M4_ORACLE - ax_rest and adds it to the diagonal. That
      equality is true by construction and validates neither the off-axis C-row
      nor the complete 189-entry ledger. See C22.

  - id: C2
    title: Fourth-order off-axis coefficient C_shp — the one genuinely open item
    status: open
    section: "§5.5"
    sides:
      - label: historical
        value: "-211835444920651/4405310420659200"
        decimal: -0.04808638318135875
        kind: exact-rational
      - label: v10a.26
        value: -0.020213328886166577
        kind: float
    delta: 0.027873054295192174
    notes: >
      A diagonal shift cannot reconcile this, and the reason is structural.
      The full crosswalk is
        c_4_new(k) = c_4_old(k) + Delta_Gamma + Delta_C * Phi_C(k),
        Phi_C(k) = 4*e_2(k)/Q(k).
      Since e_2 = O(|k|^4) and Q = O(|k|^2), Phi_C = O(|k|^2) and Phi_C(0) = 0.
      So Hamer's Gamma-point scalar pins Delta_Gamma and places NO constraint on
      Delta_C. Phi_C also vanishes on every axial cut, which is why axial data
      agree exactly while M and R split by 8*Delta_C and 16*Delta_C. Scalar
      re-anchoring alone leaves the centered structure unchanged; only the
      Delta_C*Phi_C term can move the dispersion, so the crosswalk preserves
      bandwidth only if Delta_C vanishes or is absorbed by an exact operator
      identity. This is the finite-order bottleneck of the whole program.
    balanced_branch_RETRACTED:
      value: "-13035490122347/550663802582400"
      decimal: -0.023672320681358752
      kind: exact-rational
      status: RETRACTED 2026-08-30, the same day it was recorded
      retraction: >
        Recorded as "the eps-free branch, established exactly". It is not a
        branch of C2 at all. The 25/64 is the gap between BETA_PEN_3 and
        payloads.b_evaluator() at N = 3 -- and that evaluator at N = 3 returns
        exactly channel_ledger.beta_formula(3) = P17(9)/(3 R20(9)), which
        GLUEBALL_DETAILED_FORMULA_2026-08-20_v3.1.md forbids at line ~1511:
        "The compact beta_N formula is not to be substituted at N=3; use the
        separate exact SU(3) value." The continuation route to N = 3 is
        separately closed, D34 carrying (z-9)^3 with Q32(9) nonzero.
        The arithmetic was never wrong and the relation is real -- it is what
        DELTA_BETA_3 records, and the pre-existing check "the N=3 continuation
        shift is exactly 25/64, with two exact corollaries" already stated it
        correctly, including that whether the shift is derived or defined as a
        difference is OPEN. What is withdrawn is the promotion: no direct
        balanced contraction at N = 3 is held in this repository, so
        C_historical + 25/1024 is not an established value of C_shp and must
        not be read as one. Kept rather than deleted, per the rule that a
        refuted claim's record is more useful than its absence.
      what_the_exceptional_ranks_do_show: >
        Not a licence for the substitution, but real evidence about the
        mechanism, all of it already checked here. SU(5): the shipped stage-1
        scan holds 895,524 candidate support/output pairs with ZERO
        determinant-or-epsilon sectors. SU(6): the sole determinant orbit
        shifts the scalar by exactly 6/343 at q, X, M and R while A, B and the
        bandwidth are unchanged -- re-derived from the shipped certificate,
        720 permutation terms, 11/11 gates. SU(4): the v0.8 changelog records
        Delta A_4 = Delta B_4 = 0. So at every exceptional rank where the
        determinant sector has been computed independently, it does not reach
        B. N = 3 would be the one rank where it does. That is a pattern worth
        explaining, not a proof that 25/64 is derived.
    orbit_reduction: >
      Established 2026-08-30 (same suite). Clearing the 1/q makes the shape
      ansatz a linear system over Laurent polynomials in z_j = exp(i k_j), so
      the coefficients are SOLVED over the whole zone rather than fitted at
      four points (the transcript's procedure, condition number 45.8). The 189
      records then carry only six weight magnitudes, one per cubic orbit, and
      in terms of those amplitudes the shape data is closed form:
        A = 5/48,  B = 0,  D = 0,  C_shp = -5/96 - u - (rho + pi)/2,
      with nu = -(5/48 + 4u) forced by A and sigma entering c_0 alone. So C2
      is a disagreement about three signed numbers. The cold dump satisfies the
      same six-orbit structure and the same normalized table; relative to the
      historical kernel its skeleton unit is scaled by 4.1327437 and its rho
      and pi are OPPOSITE IN SIGN. Six of the eighteen same-plane
      nearest-neighbour records are the normal orbit, which A pins in both
      kernels and which therefore cannot disagree freely — refining the
      "nn same-plane block" of runs/g3_kernel_record_dump_2026-08-28/.
    sign_flip_is_not_the_whole_story: >
      Tested and refuted 2026-08-30, so the next reader does not chase it. The
      two orbits that differ in sign are exactly the two whose only shape
      effect is C (A = B = D = 0 for both), which looks like a transpose or
      conjugation convention differing between the pipelines. It is not: their
      MAGNITUDES also differ, and by three different factors — u by 4.1327437,
      rho by 10.68866, pi by 1.487657. Enumerating all four sign choices of
      (rho, pi) at fixed magnitudes reproduces each kernel's own C exactly and
      nothing else: the historical value needs (rho +, pi -) with historical
      magnitudes, the v10a.26 value needs (rho -, pi +) with cold magnitudes,
      and no sign choice on one kernel's magnitudes lands near the other's
      value. So C2 is a disagreement about three numbers, not one convention.
    sign_flip_is_not_a_convention: >
      Tested 2026-09-01, the covariance sign test recorded on G3, three checks
      in the kernel-orbits suite. On plaquette-centred displacements with the
      orientation character (PSI_SIGN read at the identity) every one of the
      six orbits is separately Hermitian and invariant under all 48 elements
      of O_h, in BOTH kernels with the SAME character; symmetry is linear, so
      all four sign patterns of (rho, pi) are admissible and Hermiticity plus
      cubic covariance fix no orbit's sign. And no convention reaches the flip:
      of the 48 plane-fibre regaugings only +-1 preserves the 144 records the
      kernels agree on; pi is a same-plane orbit no regauging touches; every
      diagonal regauging other than +-1 flips two of the three cross-plane
      pairs and throws rho, with the cross-plane skeleton, out of the cubic
      shape span. So the two kernels are two different Hermitian
      cubic-covariant operators in one basis. C2 is about which fourth-order
      operator the theory produces, not about how to write one down, and only
      an independent computation of the cross and in-plane amplitudes decides it.
    hodge_form_2026_09_01: >
      Both kernels are, exactly (historical) and to 1e-13 (cold),
        H4 = -nu~ (L_up - 2) + u S_sq^2 - pi~ S_sq + sigma~ I - 2 C_shp R
      with S_sq = L_down - 4I the signed shared-link adjacency, L_up the cube
      Laplacian, R the cross-plane half of S_sq, nu~ = -5/48 in both, pi~ =
      pi + 2u, sigma~ = sigma - 12u. Every term but the last is a polynomial
      in the two Hodge Laplacians and acts on the cube-boundary carrier by a
      scalar, so C_shp is the coefficient of the ONE operator outside that
      algebra, and the carrier is an exact eigenvector of H4 iff C_shp = 0.
      The disagreement is four numbers, (u, rho, pi~, sigma~); u and sigma~
      reach the carrier band only through its constant, so C2 is exactly the
      two shared-link amplitudes: C_shp = -5/96 - (rho + pi~)/2. The 4.13x
      scale on u is real (nu~ agrees, so no normalisation relates the
      kernels) and band-invisible on the carrier. Checks: "the 144 agreed records are u S_sq^2, the shared-link adjacency squared", "H4 = -nu~(L_up - 2) + u S_sq^2 - pi~ S_sq + sigma~ - 2 C_shp R exactly: C_shp is the coefficient of the one non-Hodge operator",
      "FINDING: the cold kernel has the same Hodge form, with nu~ = -5/48 and its own (u, rho, pi~, sigma~)"; ADR 0019.
    chain_amplitude_2026_09_02: >
      The one number in the agreed two-hop sector the two kernels disagree
      on, u, computed independently (RUN g3_chain_amplitude_2026-09-02):
      X_QUANTUM exactly, on two chain geometries. The historical exact
      kernel is right there and the v10a.26 dump is wrong by 4.1327437.
