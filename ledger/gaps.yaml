      primes p = 3..31, and reports that lambda_p is the Hecke eigenvalue of
      a level-2 eta/Eisenstein newform at p, verified independently at all
      ten. The note's own boxed result is that the same neighbor sum acts on
      four infrared parameters it calls tau, C, S_0, A by
      tau' = (p+1) tau, C' = lambda_p C, S_0' = (p+1) S_0,
      A' = (p+1) A + (4/5)((p+1) - lambda_p) C. Candidate: the note's C and
      quartic harmonic H_4 are the SAME object as this corpus's fourth-order
      shape coefficient C_shp and its quartic obstruction basis
      (UNIFIED §5.1), under a normalization not yet derived here — in which
      case the p+1 / lambda_p Hecke eigenline decomposition would be a new,
      independent handle on the open C2 dispute (does either recorded
      C_shp value, or neither, sit on the harmonic eigenline?).
