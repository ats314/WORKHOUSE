    external_sharpening: |
      Schierholz 1988 (Nucl. Phys. B Proc. Suppl. 4, 11-20) measured the same few-percent overlap independently and showed it is not a constant: for a local dimension-4 operator the projection falls like a^5, so it degrades toward the continuum. The remedy there was lower-dimension, necessarily nonlocal operators. This gap's own statement treats the overlap as a fixed small number; the published scaling says the smeared basis is structural, not a convenience. See literature/index.yaml, SCHIERHOLZ_1988.
      SHARPENED 2026-08-30, and the exponent recorded above is the wrong one for THIS carrier. A supplied theory-mode session (the carrier-persistence notes, T3, not replayed here) derives the overlap law Z_0(a) ~ |f_d|^2 a^(2d-3) / (2M) for a local lattice source whose lowest-dimension continuum operator has dimension d. Its arithmetic checks and its d = 4 case REPRODUCES Schierholz's measured a^5 (2*4-3 = 5), which is what makes it worth recording. But the C-odd carrier's leading continuum operator is d^abc F^a F^b F^c at dimension six, so the exponent that actually applies here is a^(2*6-3) = a^9, not a^5 — the extrapolation quoted there is Z_0 ~ 1.2e-6 at a sqrt(sigma) = 0.10 and 2.4e-9 at 0.05. Still a power, so formally survivable, and brutal. The same law makes the case for smearing exactly: at fixed physical radius R, Z_0 = |f_R|^2 R^(2d-3) / (2M) is a-independent. The law itself is asserted rather than checked here; what is checked is the dimension arithmetic and the agreement with the published a^5.
