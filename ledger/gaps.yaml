    path_reduction_2026_09_04: >
      The path-reduction lemma is in the engine (loopcalc.reduced_words,
      LINK_WEIGHT): a private path of k links is one Haar link with k times
      the single-link H0, and the reduced clusters -- two shared links and a
      few weighted private ones -- give every fourth-order cumulant channel by
      channel (suite "private-link paths as single links; universality
      history by history", ADR 0030). Universality of u is a bijection of
      integrands between the straight and the L chain, term by term; the
      tier collapse's last unexplained input is therefore one Haar identity
      on one face, stated in the route above.
    symbolic_rank_2026_09_04: >
      The degree bound of ADR 0027 is proved by removing it (ADR 0029): the
      third engine runs over the field Q(N) (workhouse.symbolic_rank), and
      every cumulant of the beta_N assembly is computed as one rational
      function of N -- the reconstructions of ADR 0025 and ADR 0027
      identically, specialising to every per-rank record at N = 3..70. The
      coplanar dressings are the exact negatives of the perpendicular ones,
      so beta_N = -16u + 32 d_single - 16 d_corner + 848/(N(N^2-1)^3), and
      the identity with P17(N^2)/(N R20(N^2)) is a polynomial identity
      proved in Lean (betaN_from_three_cumulants). The channel decomposition
      of the corner and fan is in the route above; the tier collapse B = D
      = 0 is a theorem at every rank N >= 5, given the six-orbit structure of
      the kernel, because u is universal channel by channel as an identity.
    beta_n_assembled_2026_09_04: >
      The all-rank shape coefficient beta_N is the sum of eleven cluster
      cumulants per rank -- two pair clusters, the coplanar and
      perpendicular dressings, the corner, the two-hop weight and the
      adjacent-face cube completion -- assembled by the third engine at
      N = 4..70 and equal to the corpus's P17(N^2)/(N R20(N^2)) exactly
      at every rank (ADR 0027, runs/beta_n_from_assembly_2026-09-04). So
      the object the tier collapse is a property of is now in hand at
      every rank, cluster by cluster, and the mechanism question is a
      question about those clusters' channels (the next step above). Two
      of the eleven never enter: the coplanar and perpendicular pair
      clusters are one abstract graph up to conjugating a face, hence exact
      negatives at every rank, so beta_N is dressings, corner, two-hop
      weight and cube alone, and the pair cluster's double pole at N = 3
      (the (3,0) determinant family) is invisible to it.
