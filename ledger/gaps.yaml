          orthonormal-symbol coefficient [u^2] h_u = sigma_2 I + (5/612) BB^+
          -- note 5/612 is t_3, the shared-link hopping -- and a remainder
          uniform in momentum on the patch; hence no dark carrier there.

      So the first exclusion in the manuscript's scope paragraph is now about
      the CONTINUUM, not the thermodynamic limit.
    still_open: >
      Three boundaries, each stated by the inserts themselves rather than
      inferred here. No rank-one separation is claimed AT Gamma, where the
      cubic T_1 triplet meets. The threshold u_U is existential, inherited
      from the Yarotsky contraction majorants, and necessarily deteriorates as
      q_* falls to zero. And the semigroup identity is a restriction
      statement: for every a_t > 0 the exact Hamiltonian semigroup acts on the
      subspace as multiplication by exp(-a_t E_car(k,u)), which does NOT
      identify exp(-a_t H_infinity(u)) with the finite-temporal-spacing
      isotropic Wilson-action transfer matrix. The anisotropic-time/operator
      equivalence is a separate open problem and is the same object G19 needs.
      The inserts also do not identify an isotropic Wilson transfer-matrix
      particle or a continuum Yang-Mills particle.
    load_bearing: true
    external_sharpening: >
      Schierholz 1988 (Nucl. Phys. B Proc. Suppl. 4, 11-20) measured the same
      few-percent overlap independently and showed it is not a constant: for a
      local dimension-4 operator the projection falls like a^5, so it degrades
      toward the continuum. The remedy there was lower-dimension, necessarily
      nonlocal operators. This gap's own statement treats the overlap as a fixed
      small number; the published scaling says the smeared basis is structural,
      not a convenience. See literature/index.yaml, SCHIERHOLZ_1988.

      SHARPENED 2026-08-30, and the exponent recorded above is the wrong one
      for THIS carrier. A supplied theory-mode session (the carrier-persistence
      notes, T3, not replayed here) derives the overlap law
      Z_0(a) ~ |f_d|^2 a^(2d-3) / (2M) for a local lattice source whose
      lowest-dimension continuum operator has dimension d. Its arithmetic
      checks and its d = 4 case REPRODUCES Schierholz's measured a^5
      (2*4-3 = 5), which is what makes it worth recording. But the C-odd
      carrier's leading continuum operator is d^abc F^a F^b F^c at dimension
      six, so the exponent that actually applies here is a^(2*6-3) = a^9, not
      a^5 — the extrapolation quoted there is Z_0 ~ 1.2e-6 at a sqrt(sigma) =
      0.10 and 2.4e-9 at 0.05. Still a power, so formally survivable, and
      brutal. The same law makes the case for smearing exactly: at fixed
      physical radius R, Z_0 = |f_R|^2 R^(2d-3) / (2M) is a-independent. The
      law itself is asserted rather than checked here; what is checked is the
      dimension arithmetic and the agreement with the published a^5.

  - id: G19
    tier: 3
    state: open
    title: Continuum limit
    detail: "Nothing in the corpus reaches the scaling window; Borel-Pade is consistent, not controlled."
    sharpened_2026_08_30: >
      The maintainer's G19 continuum-bridge insert was merged into
      paper/master_paper_2026-08-30.tex (section "The continuum bridge, and
      where it is blocked", input from
      paper/research_notes/G19_CONTINUUM_BRIDGE_INSERT.tex). It does not close
      G19 and says so. What it changes is the STATUS of the obstruction.

      UNCONDITIONAL. In the Hamiltonian coordinate u = g_H^-4 an
      asymptotically free trajectory has u(a) -> infinity, while the proved
      Riesz island requires u < u_*. The hypotheses of the fixed-cutoff
      theorem and of a continuum trajectory are eventually DISJOINT, so no
      tail of a continuum trajectory lies in the proved domain, and evaluating
      the existential constants c_1, c_2 would not change that. This is a
      theorem about two domains, not a caution about extrapolating between
      them.

      UNCONDITIONAL. No nonzero finite strong-coupling Taylor truncation
      yields a finite continuum mass: g_H^2 P(u(a))/a diverges for every
      nonzero polynomial P.

      UNCONDITIONAL. Atom passage - a uniformly source-visible bottom atom
      survives vague convergence as a nonzero atom of the limit, with no
      isolation annulus, spin assignment or Haag-Ruelle hypothesis needed.

      UNCONDITIONAL. Reflection positivity is preserved by the raw
      deterministic Balaban-form average with reflection-adapted block and
      path data - centred L^d blocks with odd L, reflection-paired trees and
