    wilson_activity_extraction_2026_09_05: >
      The exact activity family is now constructed. For every induced finite
      link subsystem, dress its actual normalized Wilson block by its own
      parent spectral flow, using a common filter, mesh, block power and
      initial unitary. Partition Mobius inversion of these operators gives
      the bridge's exact disjoint-support expansion. Every activity is
      self-adjoint and annihilates the local vacuum on both sides; real
      component factorization makes it zero on disconnected induced
      plaquette supports. No restriction identity between subsystem unitaries
      or multivariate analytic continuation of spectral flow is assumed.
      The next step is quantitative, proving the sum of (5/4)^|X| norm F_X
      is at most 1/400, preferably with a positive cardinality margin that
      also buys an additional spatial weight. The source-transformation
      norm remains separate. Proof is WILSON_ACTIVITY_EXTRACTION; the
      already sealed parent proof and run are unchanged.
    wilson_parent_and_spectral_flow_2026_09_05: >
      Half magnetic flow restores the actual symmetric Wilson creators with
      nonzero scalar normalization and norm at most 1/8 at support weight
