headline: |
  The charge-odd fourth-order dispersion and actual fixed-spacing infinite-volume Wilson band/source construction are established in their stated regimes. The current derivation priorities target actual conditional-score and source-energy estimates, interacting spatial comparison, and summable normalized scale/source transport. Their order is editorial research guidance; graph dependencies retain their distinct mathematical meanings.
headline_historical_2026_08_30: |
  The charge-odd plaquette sector carries a homologically protected flat band whose strong-coupling dispersion is derived exactly through fourth order at every rank; the infinite-volume and spectral statements are G17 and G18.
unifying_candidates:
  - id: U1
    statement: |
      The protection, the flat band, the Betti count, and the spectrum are all consequences of the chain complex, not of the dynamics. The signed incidence factorization S(k) + 4I = B(k) B(k)^dagger fixes the spectrum {-4, -4 + q_a, -4 + q_a} and the carrier psi(k) = (d3_bar, -d2_bar, d1_bar) with |psi|^2 = q_a before any Hamiltonian is chosen.
    supported_by:
      - UNIFIED §3.2
      - UNIFIED §3.3
      - UNIFIED §3.4
    falsifier: |
      A lattice geometry whose signed incidence admits the same factorization but whose retained sector carries no flat band, or one with a flat band and no such factorization. Either breaks the implication.
    status: supported
  - id: U2
    statement: |
      Every fourth-order shape coefficient is a symmetric function of the Bloch scalars: eps_4 = c_0 + A q_a + B e_2 + C (4 e_2/q_a) + D (e_3/q_a), so the obstruction space is spanned by elementary symmetric polynomials in the a_i and nothing else appears.
    supported_by:
      - UNIFIED §5.1
      - UNIFIED §5.3
      - ADR 0005
    falsifier: |
      A fourth-order coefficient of the retained operator that cannot be written in {q_a, e_2, e_3}. The five-shape enumeration of §5.1 would then be incomplete rather than merely unexplained.
    status: supported
    candidate_falsifier_2026_09_08: |
      HISTORICAL INTERPRETATION, scoped by RESULT:TIER_COLLAPSE_ACTUAL_H4_SUPPORT. The fourth-order ansatz follows the actual support {I,U,S,S^2,R}, not R-linearity alone. A new sixth-order shape would test a proposed higher-order extension, not refute the fourth-order statement of U2.
      Not yet a refutation, and scoped narrowly. U2 is used as the claim that the FIVE-element span {q, q^2, e_2, q e_2, e_3} (the ansatz cleared of its 1/q) holds the shape coefficient. The operator algebra that produced the fourth-order kernel contains a word whose carrier symbol is not in that span: sigma(R U R) = 4 e_2^2 exactly, with zero Feshbach defect, and an exact rank test places 4 e_2^2 / q outside the five monomials (suite "the Feshbach channel of the plaquette Hodge algebra", the FINDING check). This does NOT falsify U2 as literally stated -- 4 e_2^2 / q is still a function of the Bloch scalars -- and it says nothing about fourth order, where the kernel is R-linear and the ansatz is exact. It is a prediction about the first order that inserts the cross-plane operator twice with a Laplacian between, and which words order six populates is open (G9, G10).
  - id: U3
    statement: |
      The two vanishings in this corpus are one mechanism. The cubic shape tier collapses (B_shp = D_shp = 0) even though the carrier projection makes a-degree 3 reachable, and all 28 proper-return pentagonal histories vanish individually after exact Q projection. Both are "reachable by degree count, zero after projection off the retained sector", in two unrelated geometries. Candidate: the vanishing is a property of the Feshbach Q projection rather than of either geometry.
    supported_by:
      - UNIFIED §5.1
      - UNIFIED §9.3
      - G14
      - ADR 0005
    falsifier: |
      A geometry where the Q-projected proper-return contributions vanish while the shape tier does NOT collapse, or the reverse. If the two are one mechanism they must stand or fall together; exhibiting one without the other refutes the identification and leaves two coincidences.
    status: conjectured
    note: |
      Stated as an analogy that has not yet been reduced to a derivation. What would promote it is a single statement about Q P Q on the charge-odd sector that specializes to both. G14 is the cubic half.
    cubic_half_derived_2026_09_08: |
      Reviewed 2026-09-10 against the corrected U7 record and docs/research/september_feshbach_integration.md. The cubic Hodge splitting is established for q>0, with denominator-cleared identities valid globally. Every word in the two Hodge generators acts scalarly on the carrier line; scalar action can depend on momentum and does not by itself imply absence of dispersion. RESULT:TIER_COLLAPSE_ACTUAL_H4_SUPPORT gives the fourth-order B=D=0 consequence from the actual support {I,U,S,S^2,R}. The broader R-degree-one argument is falsified by sigma(UR)=-2 q e_2 and is retained as RESULT:TIER_COLLAPSE_IS_R_DEGREE.
      U3 remains conjectured. Exact tetrahedron and pentagonal-prism incidence checks establish the carrier-kernel and Hodge-eigenvector hypotheses, with eigenvalues 4 and 7; the prism also refutes the unnecessary scalar-total-Laplacian assumption. These checks do not identify the pentagonal or tetrahedral Q-projected proper-return histories as Hodge words. U7 preserves the scalar lemma and states that broader explanatory proposal with its separate falsifier. The original paragraph is retained below as historical source interpretation.
    cubic_half_derived_2026_09_08_review_reason_2026_09_10: Separate the proved actual-kernel support and scalar Hodge-word lemma from the falsified R-degree-only inference and the open cross-geometry identification.
    historical_cubic_half_derived_2026_09_08_before_2026_09_10: |
      The statement U3 asked for now exists and is registered as U7: the Feshbach complement of the carrier is a Hodge summand, so the Hodge algebra generates no off-sector coupling and every excursion costs one non-Hodge insertion. Under it the cubic half of U3 is derived rather than observed -- B = D = 0 is R-degree one, T1 over the whole zone (suite "the Feshbach channel of the plaquette Hodge algebra", RESULT:TIER_COLLAPSE_IS_R_DEGREE). U3 itself stays CONJECTURED, and deliberately: the pentagonal half has not been re-derived as a Hodge-word statement, so what exists is one derivation and one unreduced analogy, which is exactly the shape of thing ADR 0005 was written about. U7 carries the general statement and the falsifier that would decide both.
  - id: U4
    statement: |
      The C-even leakage and the C-even hopping are one object, at every order. The domino engine computes them independently and they agree exactly at both computed orders: leak_(2,+) = t_(2,+) = -11/306 and leak_(3,+) = t_(3,+) = -6335/249696. The corpus names two distinct mechanisms of equal value ("the diagonal's +3/4 is vacuum-energy bookkeeping, the hop's +3/4 is the |0> route"); the candidate is that they are not two mechanisms but one vacuum-mediated route entering both, in which case the identity holds at every order and the whole C-even band collapses to tower_r + (12 + lambda) t_(r,+), which is what the engine's own regression gates 101/200 + 24 T3e and 101/200 + 8 T3e are. At second order the C-odd leakage joins them, since leak_(2,-) is the same ell_N = A_N + B_N + 1/C_F; at third order it separates, so whatever the mechanism is, it is not sector-blind.
    supported_by:
      - ENGINE_FLUX_su3_domino_d3.py
      - PAPER §third order
      - G25
    falsifier: |
      An order r at which the C-even per-neighbour leakage and the C-even hopping are computed independently and differ. Fourth order is the first untested one and is reachable from the same weight cards G3 needs. Equally fatal in the other direction: a derivation showing the two quantities are equal for a reason that does not involve the vacuum route would refute the identification while leaving the equality standing.
    status: refuted
    note: |
      Recorded as a candidate and nothing more. Two equal values are two equal values; ADR 0005 is what happens when a clean mechanism is read off a coincidence in this corpus, and the charge-even suite deliberately checks the identity without asserting a cause for it.
    refuted_2026_09_03: |
      By the second clause of its own falsifier: the equality is DERIVED, at both computed orders, for a reason that is not the vacuum route (ADR 0023, suite "the swap-odd domino state"). With the engine's definitions, leak_k - t_k = E_k(psi_A) - vac_k^domino - gap_k^single for the swap-odd state psi_A = e_1 - e_2. Class functions multiply commutatively, so W psi_A = e_1^2 - e_2^2 has no two-plaquette image and no vacuum image, and H_0 conserves each plaquette's isotypic content, so through third order E_k(psi_A) is the single-plaquette rotor energy with the vacuum removed from its intermediates. The vacuum's share of the excited rotor energy is exactly -vac_k at k = 2 (3/4 = 1/C_F) and k = 3 (9/32): the "|0> route" and the "vacuum-energy bookkeeping" the corpus calls distinct mechanisms of equal value are one matrix element, <0|W|e> = |e|^2 over 2 C_F, with opposite signs. Hence E_k(psi_A) = E_k^exc + vac_k, which is leak_k = t_k. Nothing vacuum-mediated enters psi_A at all -- the vacuum cancels out of it -- so the identification "one vacuum-mediated route entering both" is wrong even though the equality stands and both rationals keep their registered values. The same bookkeeping in the C-odd sector, where the swap-odd state keeps the like-family cross terms and has no vacuum route, gives leak_(2,-) - t_(2,-) = 2 A_N + 1/C_F = -3/68 at N = 3, the registered value, and not 2 B_N + 1/C_F = -1/36.
    what_stays_open: |
      The all-orders half. The lemma keeps two-plaquette intermediates out of E(psi_A) only while a walk cannot excite the inert plaquette and de-excite it again, which needs four insertions; and the domino vacuum first acquires a connected diagram at the same order. So at fourth order leak_(4,+) - t_(4,+) = [connected (excited, fluctuating-neighbour) diagram of psi_A] - [connected domino vacuum diagram], a difference of two quantities with no symmetry relating them. That difference is the sharpened falsifier: zero would mean a cancellation this derivation does not predict, nonzero ends the identity at the first order the mechanism cannot reach. SHARPENED 2026-09-03 (swap-odd suite, fifth check): the disconnected part is not zero either -- the vacuum share of the excited rotor energy stops cancelling the vacuum energy at fourth order, by -63/800 -- so with the corpus's linked pair vacuum omega4 = -327/83776 (v10a.7 gates, T3 here) the equality survives at fourth order only if the connected swap-odd excited diagram is exactly -173109/2094400. NOT a byproduct of G3: G3's weight cards are the cubic fourth-order kernel on three-plaquette lattice clusters, while this is the two-plaquette domino at order four, which the pinned engine cannot reach as is (its word basis is truncated at letter degree four and a fourth-order domino walk reaches five). Costed as a route on G25.
  - id: U5
    statement: |
      The determinant (epsilon / triality) sector enters the fourth-order band shape through the ON-SITE ORBIT ALONE, at every rank where it has been computed independently, and N = 3 is the sole exception. In the orbit basis of the 189-record kernel the on-site orbit's carrier projection is exactly sigma*e_1, so eps = T/q = sigma is constant over the zone and carries no A, B, C or D — which means a correction recorded as "momentum-independent" or "a pure scalar shift" IS an on-site-orbit shift and nothing else. Read that way the record is uniform: SU(6)'s sole determinant orbit shifts q, X, M and R by exactly 6/343 with A, B and the bandwidth unchanged (an on-site shift); SU(5) ships 895,524 candidate pairs with zero determinant sectors (no shift at all); SU(4) records Delta A_4 = Delta B_4 = 0. Only at N = 3 is Delta beta_3 nonzero, i.e. only there does the sector leave the on-site orbit.
      The quantitative consequence, AMENDED 2026-09-01. In the Hodge form of the kernel (suite "fourth-order kernel orbits"), the normal orbit is nu = nu~ - 4u with nu~ = -5/48 the primitive cube completion and -4u the diagonal shadow of the two-hop sector u S_sq^2. Eps-blindness of the link-balanced primitive channel fixes nu~, which is the same statement as Delta A_3 = 0 (A = -nu~ exactly); it says nothing about u. And C = -5/96 - (rho + pi~)/2 with pi~ = pi + 2u, so Delta beta_3 = +25/64 gives Delta C = +25/1024 and

          Delta(rho + pi~) = -25/512, with nu~ = -5/48 unchanged; u, u2, sigma~ free.

      Historical rho + pi~ = -17607806155349/2202655210329600 (2*X_QUANTUM above the earlier rho + pi), so a direct balanced contraction at N = 3 must return rho + pi~ = -15644916262153/275331901291200.
    amended_2026_09_01: |
      The 2026-08-30 form concluded "Delta u = Delta u2 = Delta nu = 0 and the whole effect is Delta(rho + pi) = -25/512, and nothing else". Its step "the primitive cube-completion channel IS the normal orbit, so Delta nu = 0, hence Delta u = 0" is withdrawn: the normal orbit is the primitive channel PLUS the -4u shadow of u S_sq^2 (check "the 144 agreed records are u S_sq^2, the shared-link adjacency squared"), so eps-blindness constrains nu~ = nu + 4u only. The two recorded kernels are the witness: both have nu~ = -5/48 exactly and their u differ by a factor 4.1327437. The number -25/512 survives; the quantity it constrains is rho + pi~. Kept as an amendment rather than rewritten, per the rule that a withdrawn step is evidence for the next reader.
    supported_by:
      - 'CHK: the on-site orbit IS the momentum-independent channel'
      - 'CHK: CORRECTED PREDICTION: the eps-sector at N=3 is Delta(rho + pi~) = -25/512; u is NOT constrained'
      - 'CHK: H4 = -nu~(L_up - 2) + u S_sq^2 - pi~ S_sq + sigma~ - 2 C_shp R exactly: C_shp is the coefficient
        of the one non-Hodge operator'
      - 'CHK: the SU(6) determinant correction is exactly 6/343 and momentum-independent'
      - 'CHK: the SU(5) stage-1 scan is shipped: 895,524 pairs, zero determinant sectors'
      - 'CHK: A = 5/48 forces the normal amplitude: nu = -(5/48 + 4u)'
      - 'OFF_AXIS_LEDGER (maintainer, WORK_SINCE_2026-08) §4: the primitive channel is link-balanced,
        hence eps-blind'
      - 'STATE.md cont. 9: unified N-ality theorem, exact exceptional offsets'
    falsifier: |
      A direct balanced contraction at N = 3 whose nu~ = nu + 4u is not -5/48, or whose rho + pi~ shift from the historical value is not exactly -25/512 (amended 2026-09-01: u, u2 and sigma~ are NOT constrained, so a shift in them refutes nothing). Equally: any exceptional rank at which the determinant correction is shown to be momentum-DEPENDENT (it would then not be an on-site shift), or an SU(3) determinant analysis that reaches A rather than C, which would contradict the eps-blindness of the link-balanced primitive channel that the whole chain rests on.
    status: refuted
    refuted_2026_09_02: |
      The computation nobody had run has been run (runs/g3_shared_link_pair_2026-09-02). The direct balanced contraction -- the same cluster assembly with every unbalanced Haar family dropped, which also sets PVP = 0 -- leaves every three-plaquette dressing unchanged and moves each shared-link pair cluster's C-odd element by exactly -55/13872, on the coplanar and the perpendicular pair alike. So the epsilon sector of rho + pi~ is -55/6936, and the falsifier above has fired: the shift is not -25/512. The continuation shift Delta beta_3 = 25/64 is therefore not the epsilon sector's contribution to the fourth-order shape, and C10's question -- whether that shift is derived or merely defined as a difference -- is what remains. The exceptional-rank pattern (SU(4), SU(5), SU(6)) is untouched by this; what fell is the N = 3 quantitative step. Check "FINDING: U5 is falsified -- the epsilon sector of rho + pi~ is -55/6936, not -25/512"; ADR 0021.
    note: |
      Written 2026-08-30 as a prediction about a computation nobody in this repository had run; refuted 2026-09-02, see above. It preferred neither side of C2 and did NOT rest on the P17/R20 substitution at N = 3, which is forbidden and whose use here was retracted on 2026-08-30 -- only on Delta beta_3, which the register records independently as DELTA_BETA_3.
    revisited_2026_09_04: |
      The number U5 named is real; its mechanism is not. In the kernel's own basis the cluster-assembled rotation amplitude is rho_historical - 25/512 exactly, so Delta(rho + pi~) between the historical kernel and the assembly IS -25/512 (ADR 0024). But the whole difference sits in the adjacent-face cube completion, a cluster with no determinant sector (every link carries U x U-dagger), where the historical Stage-3I ledger holds 8 of the 24 insertion orderings; the epsilon sector proper was measured on 2026-09-02 at -55/6936. So the refutation stands on the stated mechanism, and the corpus's "determinant sectors shift C at N = 3 by -25/1024" (C10, corpus trap 3) is an enumeration shortfall wearing the determinant sector's name.
  - id: U6
    statement: |
      A number-theoretic construction landed 2026-08-31 (the "Hecke cover correspondence" note — see corpus-import/programs/ hecke_cover_correspondence/) maps lines in P^2(F_p) with Q = 0 to sublattices of Z^3, reads off a quantity lambda_p at each of ten odd primes p = 3..31, and reports that lambda_p is the Hecke eigenvalue of a level-2 eta/Eisenstein newform at p, verified independently at all ten. The note's own boxed result is that the same neighbor sum acts on four infrared parameters it calls tau, C, S_0, A by tau' = (p+1) tau, C' = lambda_p C, S_0' = (p+1) S_0, A' = (p+1) A + (4/5)((p+1) - lambda_p) C. Candidate: the note's C and quartic harmonic H_4 are the SAME object as this corpus's fourth-order shape coefficient C_shp and its quartic obstruction basis (UNIFIED §5.1), under a normalization not yet derived here — in which case the p+1 / lambda_p Hecke eigenline decomposition would be a new, independent handle on the open C2 dispute (does either recorded C_shp value, or neither, sit on the harmonic eigenline?).
    supported_by:
      - corpus-import/programs/hecke_cover_correspondence/NOTE_FLUX_hecke_cover_correspondence_2026-08-31.md
      - 'CHK: the geometric A_p column is p^4 times the printed lambda_p'
    falsifier: |
      Derive the normalization map between the note's (tau, C, S_0, A, H_4) and this corpus's own fourth-order coordinates (q_a, e_2, e_3, C_shp, the shapes A/B/C/D of UNIFIED §5.1) and show that no such map carries C to C_shp — e.g. because the note's construction has no analogue of the off-axis dependence Phi_C(k) = 4 e_2(k)/Q(k) that C_shp multiplies, or because the dimensional/degree count of H_4 does not match the quartic obstruction space's. Either kills the identification outright, the same way q_band^(4) and m_Gamma^(4) turned out to be differently anchored rather than rival estimates (ADR 0002). Equally fatal in the other direction: exhibiting the map and finding that NEITHER recorded C_shp value sits on the eigenline it predicts would leave the construction standing but refute its relevance to C2.
    status: conjectured
    note: |
      Landed record-backed only: the note's own generator, verifier, and both certificates are on the maintainer's machine and have not reached this repository, so nothing here has independently re-run the construction. The one thing checked here is that the printed table is internally consistent (A_p = p^4 lambda_p exactly for all ten primes, src/workhouse/invariants/hecke.py) — a transcription guard, not evidence for the construction, the eigenvalue claim, or the candidate identification above. Do not treat the shared letter C, or the shared word "harmonic", as evidence of identity on its own — that is exactly the trap CLAUDE.md names for q_band^(4) / m_Gamma^(4).
  - id: U7
    statement: If the retained line spans ker L_down and its carrier psi is an L_up eigenvector, every
      word in the two Hodge generators acts scalarly on that line and has zero off-carrier coupling. This
      does not forbid momentum-dependent scalar dispersion. The further proposal that this mechanism explains
      every projection vanishing in the corpus remains a cross-geometry conjecture. On the cubic lattice
      the actual H4 support {I,U,S,S^2,R} proves B=D=0; R-degree one alone does not, as sigma(UR)=-2 q
      e_2 shows. Proper-return identification in the pentagonal and tetrahedral problems remains separate.
    supported_by:
      - CITE:HODGE_FESHBACH_CHANNEL
      - CITE:HODGE_FESHBACH
      - RESULT:HODGE_FESHBACH_SPLITTING
      - RESULT:TIER_COLLAPSE_ACTUAL_H4_SUPPORT
      - G14
      - U3
    falsifier: 'The carrier-scalar lemma is tested against its actual kernel/eigenvector hypotheses. To
      refute the broader explanatory proposal, exhibit a particular proposed projection vanishing that
      is not generated by those Hodge words, or a purported proper-return history whose required Hodge-word
      identification fails. A scalar total Laplacian is not required: the pentagonal prism already excludes
      that unnecessary premise. The exact UR counterexample has already refuted the R-degree-only cubic
      subclaim.'
    status: conjectured
    note: Reconciled 2026-09-09 against the corrected exact suite. Cubic cleared identities hold globally;
      its normalized carrier projector requires q>0. The tetrahedron and pentagonal prism checks establish
      the kernel/eigenvector hypotheses and scalar Hodge-word conclusion, not their proper-return or Q-projected
      histories. The original supported label and complete text are retained under historical_record_before_2026_09_09;
      the broad unification is conjectured while its proved scalar lemma and narrower actual-kernel conclusion
      remain established.
    hypothesis_corrected_2026_09_08: |
      The first draft of this candidate asked for L_down + L_up to be a scalar -- link regularity -- because that is what the cubic plaquette lattice does, and the pentagonal prism refuted it the same day: its caps carry five links and its sides four, so the sum is diag(6, 6, 5, 5, 5, 5, 5). Had the over-strong version stood, U7 would have excluded the very geometry U3 is about. The hypothesis actually needed is weaker and is checked in all three geometries (suite check "the Hodge-word statement needs only L_down psi = 0 and L_up psi = lambda psi"): ker L_down is one dimensional and spanned by the carrier, and L_up psi = lambda psi -- 4 psi on the tetrahedron, 7 psi on the pentagonal prism, q psi on the cubic lattice. That alone makes every word in the two Laplacians scalar on the carrier, which is the whole Hodge-word half. Recorded here rather than quietly fixed: the over-strong version is the kind of hypothesis that would have been obeyed for a year.
    scope_note: No change to C_shp or C2. The corrected actual-kernel result preserves the fourth-order
      tier cancellation; no order-six dynamics, full cross-geometry mechanism or continuum theorem is
      claimed. See docs/research/september_feshbach_integration.md.
    historical_record_before_2026_09_09:
      id: U7
      statement: |
        The Feshbach complement of a homologically protected retained sector is a Hodge summand, and that single fact is the mechanism behind every projection vanishing in this corpus. Precisely: let the retained sector be the line spanned by psi, where psi spans ker L_down and is an eigenvector of L_up. (Those two conditions are the whole hypothesis; L_down L_up = 0 is automatic from d^2 = 0.) Then both Laplacians act on the retained line by scalars, so the Hodge algebra generates no off-sector coupling at all; every history whose operator is a word in that algebra is scalar on the retained sector and shape-inert; and all shape dispersion is carried by non-Hodge insertions. U3's "two vanishings" are then two specializations — the cubic tier collapse is R-degree one, and the pentagonal proper-return vanishing would be that proper returns are Hodge words.
      supported_by:
        - CITE:HODGE_FESHBACH_CHANNEL
        - RESULT:HODGE_FESHBACH_SPLITTING
        - RESULT:TIER_COLLAPSE_IS_R_DEGREE
        - G14
        - U3
      falsifier: |
        A geometry whose retained sector is a down-Laplacian kernel line, whose two Laplacians sum to a scalar, and in which a proper-return history — a word in the Hodge algebra alone — nevertheless contributes non-scalar shape dispersion to the retained sector. That exhibits a Hodge word with nonzero Feshbach defect and kills the statement outright. Equally fatal in the other direction: a Q-projected vanishing in a geometry where Q is NOT a Hodge summand (the two Laplacians do not sum to a scalar, or the retained sector is not a down-kernel), which would leave the identity standing while refuting it as the mechanism, exactly as ADR 0023 did to U4. The pentagonal cap and the tetrahedron are the two nearest tests and neither has been computed: the tetrahedral Q-projected proper returns are the cheapest, and are the untried route recorded on G14.
      status: supported
      note: |
        Derived, not observed, in exactly one geometry: the cubic charge-odd sector, T1 over the whole zone (suite "the Feshbach channel of the plaquette Hodge algebra"). The other two geometries are consistent but uncomputed — the tetrahedral point is the primitive-level statement that proper returns are exactly scalar on the face space, which is what U7 predicts but is not the Q-projected test, and the pentagonal 28-history vanishing has not been re-derived as a Hodge-word statement here. Until one of those is computed this is one derivation and two analogies, which is precisely the position ADR 0005 warns about. What would promote it is the falsifier's first clause failing in a second geometry.
      hypothesis_corrected_2026_09_08: |
        The first draft of this candidate asked for L_down + L_up to be a scalar -- link regularity -- because that is what the cubic plaquette lattice does, and the pentagonal prism refuted it the same day: its caps carry five links and its sides four, so the sum is diag(6, 6, 5, 5, 5, 5, 5). Had the over-strong version stood, U7 would have excluded the very geometry U3 is about. The hypothesis actually needed is weaker and is checked in all three geometries (suite check "the Hodge-word statement needs only L_down psi = 0 and L_up psi = lambda psi"): ker L_down is one dimensional and spanned by the carrier, and L_up psi = lambda psi -- 4 psi on the tetrahedron, 7 psi on the pentagonal prism, q psi on the cubic lattice. That alone makes every word in the two Laplacians scalar on the carrier, which is the whole Hodge-word half. Recorded here rather than quietly fixed: the over-strong version is the kind of hypothesis that would have been obeyed for a year.
      scope_note: |
        The statement is about which operators can carry shape dispersion, not about their amplitudes. It says nothing about C_shp's value and does not touch C2; it says only that C_shp is the amplitude of the sole generator of the cubic Feshbach channel, which is a structural remark about the dispute, not a verdict in it.
