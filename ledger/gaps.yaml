    prior_title_2026_09_01: Mechanism of the tier collapse B_shp = D_shp = 0
    prior_status_2026_09_01: open — reduced 2026-09-01 to one dynamical input, the universality of the two-hop weight u
    prior_detail_2026_09_01: |
      Restated: why does the degree-3 part of d^dagger H_4 d vanish, when the two-hop enumeration produces it? MASTER_THEORY 5.1 records that the 144 ordered two-hop sequences give the numerator span at rank five, which INCLUDES q e_2 and e_3. So the terms are generated and the dynamics sets their coefficients to zero — a dynamical vanishing, not a kinematic one.
    exact_reformulation:
      claim: the vanishing pair IS the degree-3 part of the numerator
      detail: |
        Clearing the denominator, q eps_4 = c_0 q + A q^2 + 4C e_2 + B (q e_2) + D e_3. Degrees in the a_i are 1, 2, 2, 3, 3. Since a_i ~ L^-2, degree 3 is the L^-4 tier. This is an identity, independent of any mechanism, and it survives the retraction below.
      also_established: |
        The carrier is the d-direction with d^dagger d = q, so eps_4 = (d^dagger H_4 d)/q — which is where the 1/q in the ansatz comes from. And B B^dagger = q I - d conj(d)^T has eigenvalues (0, q, q), reproducing the recorded second-order C-odd spectrum.
    retracted_mechanism:
      claim: 'a degree bound: 2r vertices -> numerator degree <= r, forbidding B and D at fourth order'
      why_it_fails: |
        The numerator is d^dagger H_4 d, not H_4. The carrier projection adds one further d and one further conj(d), so four vertices bound H_4 entries at a-degree 2 but the numerator at 3 — exactly the degree of {B_shp, D_shp}. The count permits the pair it was meant to forbid. Witness: d^dagger diag(a_i^2) d = sum a_i^3 = q^3 - 3 q e_2 + 3 e_3, nonzero in e_3.
      counter_evidence_already_available: |
        MASTER_THEORY 5.1's rank-five span includes the degree-3 elements. That was in the document being modelled and was under-weighted.
      withdrawn_prediction: the L^-4 tier appears first at sixth order
      recorded_in: docs/decisions/0005-retracting-the-degree-bound.md
    note: |
      A second-order analogue does not help: d^dagger H_2 d = 0 exactly, but the cause is known (homological protection, B^dagger psi = 0), so it is not an independent instance of a top-degree-unpopulated pattern.
    checked_2026_08_28: |
      The vanishing is now machine-checked at record level over the whole zone (suite "off-axis channel ledger", from the maintainer's off-axis ledger, WORK_SINCE_2026-08): every block's q e_2 and e_3 amplitude is an integer multiple of one raw record weight x = 360421351/40327601932800, and the collapse is two exact integer cancellations — B = 0 is (+1,+1,-2)x over {IN-PLANE(0,0,2), MIXED(0,1,1), ROTATION}, D = 0 is (-3,+6,-3)x over {IN-PLANE(0,0,2), IN-PLANE(0,1,1), MIXED(0,1,1)}. So the kernel DOES populate the degree-3 tier and the dynamics cancels it with small-integer weights; "forced by the symmetry and displacement gates" is at best imprecise. What a mechanism must now explain is exactly those two weight vectors — including why the B-cancellation couples the translation sector to the 120-record rotation sector, whose shells are individually outside the shape span and cancel only as a sum.
    sharpened_2026_08_30: |
      The displacement-block form above is not the smallest one. Grouping the 189 records by weight magnitude instead of by displacement gives six orbits, and in that basis (suite "fourth-order kernel orbits"):

        D = 0 is ONE identity. Only two orbits carry e_3 — the 132-record
        skeleton at -6u and the 12-record same-plane (0,1,1) in-plane orbit
        at +3*u2 — and u2 = 2u exactly. So D = -6u + 3*u2 vanishes for ANY
        value of u; it is not a numerical cancellation between sectors. The
        whole content of the e_3 collapse is that one orbit carries exactly
        twice the generic weight.

        B = 0 has no cancellation in it at all at orbit level. Each orbit's
        carrier projection is closed form in the elementary symmetric
        functions of s_j — sigma*e1, nu*(2e1 - e1^2 + 2e2),
        pi*(4e1 - 2e2), u2*(4e1 - 4e2 + 3e3), rho*(-2e2) and
        u*(12e1 - 4e1^2 + 12e2 - 6e3), each an exact identity on that
        orbit's own records — and NOT ONE of the six contains the e1*e2
        monomial. B is the coefficient of e1*e2, so it is unpopulated
        rather than cancelled. Five of the six forms follow from the
        orbit's displacement set in two lines; the rotation one because
        S_PQ = -eps_P eps_Q rho dbar_{n(Q)} conj(dbar_{n(P)}) exactly, so
        the carrier kills the phases and leaves -rho sum_{m!=n} s_m s_n.
        This supersedes the (+1,+1,-2) reading twice over. Inside the
        skeleton the four B-carrying displacement blocks do cancel, shell
        by shell, at unit weight: same-plane (0,0,2) at +1 against off-plane (0,0,2) at -1, and
        same-plane (0,1,1) at +1 against off-plane (0,1,1) at -1. The
        (+1,+1,-2) above is that pair with the two off-plane blocks summed,
        and the "couples the translation sector to the 120-record rotation
        sector" reading is superseded: the coupling is between two
        displacement blocks of the SAME shell carrying the SAME amplitude,
        and at orbit level there is nothing to couple.

      Both hold in the cold v10a.26 dump too, with its own u. So the tier collapse is a property of the orbit structure and survives the C2 disagreement entirely.
    next: |
      Largely answered, 2026-08-30. B needs no mechanism: no orbit populates e1*e2. D reduced to the single equality u2 = 2u, and that equality is now explained. Write X = 2 cos k_i, Y = 2 cos k_j, Z = 2 cos k_n for a plane with own axes {i,j} and normal n. Everything the plane sends to itself beyond nearest neighbour is sixteen records — (0,0,2) at u giving (X^2 - 2) + (Y^2 - 2), mixed (0,1,1) at u giving (X+Y)Z, and in-plane (0,1,1) at u2 giving (u2/u) XY — and their sum is u[(X+Y)(X+Y+Z) - 4] IF AND ONLY IF the cross term is 2XY. So u2 = 2u is the condition for the same-plane long-range symbol to be a product rather than an inhomogeneous quadratic, and with the product form D = 0 holds separately in the same-plane sector and in the 96-record cross-plane skeleton. Neither vanishing is a cancellation between sectors.
      What is left is one level up: WHY the fourth-order dynamics produces a product there. The factorisation is now a checked identity of the recorded kernel, not a conjecture, so a mechanism has a single concrete target — derive (X+Y)(X+Y+Z) for the same-plane sector. U3's QPQ candidate remains the natural home.
    hodge_form_2026_09_01: |
      The product is a square. Suite "fourth-order kernel orbits", exact on the historical kernel and to 1e-13 on the cold one: with S_sq = L_down - 4I the signed shared-link adjacency (THM_FLUX Prop. 2) and L_up the cube Laplacian,
        H4 = -nu~ (L_up - 2) + u S_sq^2 - pi~ S_sq + sigma~ I - 2 C_shp R,
      nu~ = -5/48, pi~ = pi + 2u, sigma~ = sigma - 12u, R the cross-plane half of S_sq. The 144 agreed records are u S_sq^2 exactly, and (X+Y)(X+Y+Z)-4 is its same-plane diagonal once the shadow (-4 normal, -2 in-plane, +12 on site) is put back. On the carrier L_down psi = 0 and L_up psi = e1 psi, so every term but the last is a scalar there and B = D = 0 with nothing to cancel; R projects to -2 e2, which is 4C. The mechanism is therefore the Hodge structure of the kernel, given ONE dynamical input: the two-hop sector enters as the square of the second-order operator with a single weight u -- the fourth-order form of Prop. 2's "the same local fusion coefficient multiplies every surviving shared-edge pair". Recorded by checks "the 144 agreed records are u S_sq^2, the shared-link adjacency squared" and "H4 = -nu~(L_up - 2) + u S_sq^2 - pi~ S_sq + sigma~ - 2 C_shp R exactly: C_shp is the coefficient of the one non-Hodge operator"; ADR 0019.
    next_2026_09_01: |
      One question is left and it is the universality of u: why every two-hop chain (coplanar-coplanar, coplanar-perpendicular, perpendicular-perpendicular) carries the same fourth-order weight. The three-plaquette chain cluster is the smallest place to compute it; see the G3 route "chain amplitude u on the three-plaquette cluster".
    universality_2026_09_02: |
      Computed, not explained: the coplanar chain and the bent chain return X_QUANTUM and -X_QUANTUM exactly from an independent fourth-order assembly (RUN g3_chain_amplitude_2026-09-02; check "FINDING: the chain amplitude is u = X_QUANTUM exactly, on the coplanar and the bent chain; the cold kernel's 4.13 u is wrong"). So the weight is one number across geometries, with the sign S_PQ S_QR. A derivation of WHY -- the fourth-order form of THM_FLUX Prop. 2's single fusion coefficient -- is what remains; the computation now exists to test any candidate in seconds.
    cube_completion_2026_09_02: |
      The Hodge form writes the cube channel as -nu~ (L_up - 2) with one weight for every pair of faces of a cube. Computed from primitives (runs/g3_shared_link_pair_2026-09-02), the cube-completion channel -- the four-insertion histories that are the cube's other four faces -- is -5/48 for OPPOSITE faces, reproducing nu~ exactly, and 53/768 for ADJACENT faces. So a single weight on L_up is not the mechanism; on the historical records it is a reparametrisation that absorbs the difference into the rotation orbit. A mechanism for the tier collapse has to account for 53/768 against 80/768, which is the first concrete number a candidate has to reproduce. ADR 0021.
    replication_2026_09_02: |
      A second implementation (runs/g3_chain_amplitude_replication_2026-09-02; check "REPLICATION: a second implementation, with the engine's PVP assembly and a Krylov resolvent, gives u = X_QUANTUM on three chain types") returns the same rational on three chain types including the coplanar-perpendicular one, where the two hops carry opposite signs and the cumulant carries their product. So the universality holds across all three junction types, sign included, from two independently written assemblies. ADR 0020.
    adjacent_cube_completion_2026_09_04: |
      The cube-completion channel has a closed form for adjacent faces at every rank (ADR 0024, check "the adjacent-face cube completion is -106/(N(N^2-1)^3) ..."): the primitive simple-loop law's -88 (the off-axis run's S_4 = -11) plus ten multi-loop orderings at -18, total -106/(N(N^2-1)^3) against the opposite faces' -160, ratio 53/80 at every N. The argument is a two-line selection rule: every cube link lies in exactly two faces, so once both are present the link's adjoint component can never reach the target and only the singlet -- the n = 1 Haar moment -- survives. The Hodge form's single weight on L_up is confirmed to be a reparametrisation; a mechanism for the tier collapse has to produce -160 and -106 together.
