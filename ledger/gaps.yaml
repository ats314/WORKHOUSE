  - id: G3
    tier: 1
    title: Fourth-order adjudication — run the marked-cluster engine target-blind
    detail: >
      The 11-item frozen protocol of GLUEBALL §18.1. This is the load-bearing
      finite computation of the entire program. Scope narrowed once C1 was
      dissolved as an anchoring distinction: what G3 must now settle is the
      off-axis coefficient C_shp, since the Gamma-point scalar is externally
      validated against Hamer and Phi_C(0) = 0 makes Gamma-point data
      structurally incapable of constraining Delta_C.
    resolves: [C2, C3, C22]
    unblocks: [G9]
    protocol:
      - erratum-fixed canonical u normalization
      - exact order-four occurrence schedule
      - 203*3 = 609 exact rational marked-cluster evaluations plus a rooted Mobius ledger
      - linked subtraction applied to the vacuum-subtracted object
      - checkpoint hashes; comparison targets loaded only after sealing
      - no historical target anywhere in the scalar or shape data flow
      - cold 3895-topology Stage-3H run producing an unshifted 189-record kernel
      - direct X/M extraction with lambda_R = 2*lambda_M - lambda_X as blind holdout
      - independent scalar ledger testing q_band^(4) - E_0^(4) =? m_Gamma^(4)
      - W_22 order-schedule toggle across all 33 rooted classes
      - both m_Gamma^(4) and C^(4) from the same run
    inventory_trap: >
      The 3895 Stage-3H topologies and the 3850 stable-rank trace topologies are
      DIFFERENT inventories and must never be interchanged.
    harness:
      artifact: settlement/mce_adjudication_harness.py
      status: built and verified upstream through preflight; `run` stage outstanding
      verified_upstream:
        - contamination scan (engine source clean of the listed constants)
        - engine self-test 47/47
        - geometry preflight, 609 evaluations, coverage SHA match, zero physics
        - sealed-memfd authenticated launch, checkpoint write, interrupt and resume
      remaining: "the `run` stage on production hardware (Linux; the A100 box)"
      engine_absent: >
        Hodge_SU3_Exact_MarkedCluster_m4_Colab.py is not in this repository, so
        no stage can be executed here. The repository's checks are static
        analysis of the harness source only.
      audit_findings:
        - >
          The target-blindness scan misses two scalar-determining targets. Since
          m_Gamma = q_band + Delta_Gamma exactly, and Hamer's 8*a_4 is the scalar
          to 13 digits, an engine carrying either is seeded with the answer. The
          scan covers the 16-digit oracle form 7751458630189173, which does NOT
          contain 7751458630184 (they diverge at index 12). Closing it means
          adding 0827701250956414, 7751458630184 and its ...417 rounding,
          160506019419340168451, 7250590288602460800, 4405310420659200.
        - >
          The scan reads only the engine file. An engine that imports a helper
          module, loads a data file, or restores from the sqlite checkpoint
          carries that content past it.
        - >
          The verdict can never be COMPLETE: protocol item 10 (W22 toggle) is
          hardcoded OPEN and the completeness predicate rejects any OPEN value.
          Honest as a default, but the protocol has no path to closure until the
          engine exposes the toggle.
        - >
          The harness carries the printed Delta_Gamma (...414) rather than the
          correctly rounded ...417. Harmless after unblinding.

