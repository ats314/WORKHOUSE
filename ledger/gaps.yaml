      lies in exactly two faces, so once both are present the link's adjoint
      component can never reach the target and only the singlet -- the n = 1
      Haar moment -- survives. The Hodge form's single weight on L_up is
      confirmed to be a reparametrisation; a mechanism for the tier collapse
      has to produce -160 and -106 together.
