      REFUTED. The stochastic variant. Equivariance plus one-sided mapping do
      NOT suffice for a Markov blocking kernel; explicit two-point
      counterexample with integral of (Theta F) F dnu equal to -1. The
      sufficient replacement is a reflection factorisation
      K((Theta' F) G) = (Theta TF)(TG).

      CONDITIONAL. The necessary continuum scaling law for an electric-unit
      branch, E(u) ~ (M / (c_H Lambda_H)) b_0^-p u^((1+p)/2)
      exp(-sqrt(u) / (2 b_0)), with SU(3) essential exponential
      exp(-(8 pi^2 / 11) sqrt u) and (1+p)/2 = 86/121.
    next: >
      Named by the insert rather than by this register: a Hamiltonian-Wilson
      matching package - physical energy prefactor, anisotropy and
