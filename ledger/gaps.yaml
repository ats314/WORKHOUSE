  - id: G14
    tier: 3
    title: Mechanism of the tier collapse B_shp = D_shp = 0
    status: open — better posed, one mechanism tried and retracted
    detail: >
      Restated: why does the degree-3 part of d^dagger H_4 d vanish, when the
      two-hop enumeration produces it? MASTER_THEORY 5.1 records that the 144
      ordered two-hop sequences give the numerator span at rank five, which
      INCLUDES q e_2 and e_3. So the terms are generated and the dynamics sets
      their coefficients to zero — a dynamical vanishing, not a kinematic one.
    exact_reformulation:
      claim: "the vanishing pair IS the degree-3 part of the numerator"
      detail: >
        Clearing the denominator, q eps_4 = c_0 q + A q^2 + 4C e_2 + B (q e_2)
        + D e_3. Degrees in the a_i are 1, 2, 2, 3, 3. Since a_i ~ L^-2, degree
        3 is the L^-4 tier. This is an identity, independent of any mechanism,
        and it survives the retraction below.
      also_established: >
        The carrier is the d-direction with d^dagger d = q, so
        eps_4 = (d^dagger H_4 d)/q — which is where the 1/q in the ansatz comes
        from. And B B^dagger = q I - d conj(d)^T has eigenvalues (0, q, q),
        reproducing the recorded second-order C-odd spectrum.
    retracted_mechanism:
      claim: "a degree bound: 2r vertices -> numerator degree <= r, forbidding B and D at fourth order"
      why_it_fails: >
        The numerator is d^dagger H_4 d, not H_4. The carrier projection adds one
        further d and one further conj(d), so four vertices bound H_4 entries at
        a-degree 2 but the numerator at 3 — exactly the degree of {B_shp, D_shp}.
        The count permits the pair it was meant to forbid. Witness:
        d^dagger diag(a_i^2) d = sum a_i^3 = q^3 - 3 q e_2 + 3 e_3, nonzero in e_3.
      counter_evidence_already_available: >
        MASTER_THEORY 5.1's rank-five span includes the degree-3 elements. That
        was in the document being modelled and was under-weighted.
      withdrawn_prediction: "the L^-4 tier appears first at sixth order"
      recorded_in: docs/decisions/0005-retracting-the-degree-bound.md
    note: >
      A second-order analogue does not help: d^dagger H_2 d = 0 exactly, but the
      cause is known (homological protection, B^dagger psi = 0), so it is not an
      independent instance of a top-degree-unpopulated pattern.

