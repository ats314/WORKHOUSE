    title: The charge-even sector is registered and unchecked
    detail: |
      What remains. The suite reaches orders 2 and 3, which is where the corpus's C-even ledger stops. Fourth order is untouched on this side: the pre-registered O(u^4) criterion in the corpus is a statement about C-odd flatness, and no C-even fourth-order coefficient is registered here at all, so the sector's fourth order is not T3 -- it is absent. Closing that needs the O(u^4) weight cards the same way G3 does, and it is downstream of them rather than independent work. The second open item is a mechanism, not a number: leak_(r,+) = t_(r,+) holds at r = 2 and r = 3 and nothing here explains it. It is registered as U4 with a falsifier rather than as a result, because reading a mechanism off two coincident values is exactly what ADR 0005 records going wrong.
