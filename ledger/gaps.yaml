# One sentence, from MASTER_THEORY §2.3(b):
headline: >
  The corpus proves protection and computes coefficients; it assumes, and
  nowhere proves, that the protected object is the glueball.

# Candidate unifying principles. Question 8 of the frontier, and the only one
# that is a research judgement rather than a computation -- so each entry
# carries a falsifier. A candidate with no falsifier is an analogy, and
# analogies do not belong here (AGENTS.md, "Look for the structure underneath").
# status: conjectured | supported | promoted | refuted
unifying_candidates:
  - id: U1
    statement: >
      The protection, the flat band, the Betti count, and the spectrum are all
      consequences of the chain complex, not of the dynamics. The signed
      incidence factorization S(k) + 4I = B(k) B(k)^dagger fixes the spectrum
      {-4, -4 + q_a, -4 + q_a} and the carrier psi(k) = (d3_bar, -d2_bar, d1_bar)
      with |psi|^2 = q_a before any Hamiltonian is chosen.
    supported_by: [UNIFIED §3.2, UNIFIED §3.3, UNIFIED §3.4]
    falsifier: >
      A lattice geometry whose signed incidence admits the same factorization
      but whose retained sector carries no flat band, or one with a flat band
      and no such factorization. Either breaks the implication.
    status: supported

  - id: U2
    statement: >
      Every fourth-order shape coefficient is a symmetric function of the Bloch
      scalars: eps_4 = c_0 + A q_a + B e_2 + C (4 e_2/q_a) + D (e_3/q_a), so the
      obstruction space is spanned by elementary symmetric polynomials in the
      a_i and nothing else appears.
    supported_by: [UNIFIED §5.1, UNIFIED §5.3, "ADR 0005"]
    falsifier: >
      A fourth-order coefficient of the retained operator that cannot be written
      in {q_a, e_2, e_3}. The five-shape enumeration of §5.1 would then be
      incomplete rather than merely unexplained.
    status: supported

  - id: U3
    statement: >
      The two vanishings in this corpus are one mechanism. The cubic shape tier
      collapses (B_shp = D_shp = 0) even though the carrier projection makes
      a-degree 3 reachable, and all 28 proper-return pentagonal histories vanish
      individually after exact Q projection. Both are "reachable by degree
      count, zero after projection off the retained sector", in two unrelated
      geometries. Candidate: the vanishing is a property of the Feshbach Q
      projection rather than of either geometry.
    supported_by: [UNIFIED §5.1, UNIFIED §9.3, G14, "ADR 0005"]
    falsifier: >
      A geometry where the Q-projected proper-return contributions vanish while
      the shape tier does NOT collapse, or the reverse. If the two are one
      mechanism they must stand or fall together; exhibiting one without the
      other refutes the identification and leaves two coincidences.
    status: conjectured
    note: >
      Stated as an analogy that has not yet been reduced to a derivation. What
      would promote it is a single statement about Q P Q on the charge-odd
      sector that specializes to both. G14 is the cubic half.

  - id: U4
    statement: >
      The C-even leakage and the C-even hopping are one object, at every order.
      The domino engine computes them independently and they agree exactly at
      both computed orders: leak_(2,+) = t_(2,+) = -11/306 and
      leak_(3,+) = t_(3,+) = -6335/249696. The corpus names two distinct
      mechanisms of equal value ("the diagonal's +3/4 is vacuum-energy
      bookkeeping, the hop's +3/4 is the |0> route"); the candidate is that
      they are not two mechanisms but one vacuum-mediated route entering both,
      in which case the identity holds at every order and the whole C-even
      band collapses to tower_r + (12 + lambda) t_(r,+), which is what the
      engine's own regression gates 101/200 + 24 T3e and 101/200 + 8 T3e are.
      At second order the C-odd leakage joins them, since leak_(2,-) is the
      same ell_N = A_N + B_N + 1/C_F; at third order it separates, so whatever
      the mechanism is, it is not sector-blind.
    supported_by: [ENGINE_FLUX_su3_domino_d3.py, "PAPER §third order", G25]
    falsifier: >
      An order r at which the C-even per-neighbour leakage and the C-even
      hopping are computed independently and differ. Fourth order is the first
      untested one and is reachable from the same weight cards G3 needs.
      Equally fatal in the other direction: a derivation showing the two
      quantities are equal for a reason that does not involve the vacuum route
      would refute the identification while leaving the equality standing.
    status: conjectured
    note: >
      Recorded as a candidate and nothing more. Two equal values are two equal
      values; ADR 0005 is what happens when a clean mechanism is read off a
      coincidence in this corpus, and the charge-even suite deliberately checks
      the identity without asserting a cause for it.
  - id: U5
    statement: >
      The determinant (epsilon / triality) sector enters the fourth-order band
      shape through the ON-SITE ORBIT ALONE, at every rank where it has been
      computed independently, and N = 3 is the sole exception. In the orbit
      basis of the 189-record kernel the on-site orbit's carrier projection is
      exactly sigma*e_1, so eps = T/q = sigma is constant over the zone and
      carries no A, B, C or D — which means a correction recorded as
      "momentum-independent" or "a pure scalar shift" IS an on-site-orbit
      shift and nothing else. Read that way the record is uniform: SU(6)'s sole
      determinant orbit shifts q, X, M and R by exactly 6/343 with A, B and the
      bandwidth unchanged (an on-site shift); SU(5) ships 895,524 candidate
      pairs with zero determinant sectors (no shift at all); SU(4) records
      Delta A_4 = Delta B_4 = 0. Only at N = 3 is Delta beta_3 nonzero, i.e.
      only there does the sector leave the on-site orbit.

      The quantitative consequence, AMENDED 2026-09-01. In the Hodge form of
      the kernel (suite "fourth-order kernel orbits"), the normal orbit is
      nu = nu~ - 4u with nu~ = -5/48 the primitive cube completion and -4u the
      diagonal shadow of the two-hop sector u S_sq^2. Eps-blindness of the
      link-balanced primitive channel fixes nu~, which is the same statement
      as Delta A_3 = 0 (A = -nu~ exactly); it says nothing about u. And
      C = -5/96 - (rho + pi~)/2 with pi~ = pi + 2u, so Delta beta_3 = +25/64
      gives Delta C = +25/1024 and

          Delta(rho + pi~) = -25/512, with nu~ = -5/48 unchanged; u, u2, sigma~ free.

      Historical rho + pi~ = -17607806155349/2202655210329600 (2*X_QUANTUM above the
      earlier rho + pi), so a direct balanced contraction at N = 3 must
      return rho + pi~ = -15644916262153/275331901291200.
    amended_2026_09_01: >
      The 2026-08-30 form concluded "Delta u = Delta u2 = Delta nu = 0 and the
      whole effect is Delta(rho + pi) = -25/512, and nothing else". Its step
      "the primitive cube-completion channel IS the normal orbit, so Delta nu
      = 0, hence Delta u = 0" is withdrawn: the normal orbit is the primitive
      channel PLUS the -4u shadow of u S_sq^2 (check "the 144 agreed records
      are u S_sq^2, the shared-link adjacency squared"), so eps-blindness
