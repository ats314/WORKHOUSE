  - id: G17
    tier: 3
    state: open
    title: "PC-2 free-energy stability and the source-radius reduction"
    status: >
      Sharpened 2026-08-30, corrected same day, not discharged. The `G17
      uniformity` suite (seven T1 checks, algebraic cores at T0) computes
      the constant any stability argument must keep, EXACTLY: within the
      trivial-flux sector the gauge-invariant electric spectrum below
      2C_F + gamma is exactly {0, 2C_F} at every L >= 3, with gamma = C_F
      for N = 3 and N >= 5 and gamma = 5/4 = 2(C_L2 - C_F) at SU(4) alone
      (switch numerator 2(N-5)(N+1), a Lean theorem) -- attained by
      fundamental dominoes, and by Lambda^2-plaquettes at N = 4. The proof
      adds one parity lemma to the shell census: every 5-cycle wraps, its
      flux is winding times N-ality, so the five-link shelf is empty of
      fundamental flux -- which doubles the first-draft counting floor of
      C_F/2. CORRECTION, kept on the record: that first draft also read a
      straight loop's flux as L mod N and claimed the shell lemma's L = 4
      exclusion was load-bearing exactly at SU(4); flux is winding times
      N-ality, so fundamental wrapping loops die at every rank and the
      L = 4 clause is belt-and-braces (its point is the energy accident
      4*C_F/2 = 2C_F). The absent campaign note F1 RECORDS sharp gap 4/3
      at SU(3); that row is now checked here rather than cited, and the
      checkable half of the never-delivered F2 note (the stability
      hypothesis package: diagonal commuting H_E, product vacuum, local
      gap C_F/2 per link, range-1 perturbation of norm 2N, four faces per
      link, first-order shell rigidity via |p Delta p'| >= 6, ratio
      2N/gamma = 9/2, 32/5, 25/6 at N = 3, 4, 5, -> 4) is supplied as
      checks, so the delivered CMP2/CMP3 band theorem's Yarotsky-dependent
      steps can finally be assessed against stated hypotheses. What G17
      still owes: promoting gamma to u > 0 against an EXTENSIVE
      perturbation, which operator-norm bounds cannot deliver; candidate
      machinery (unverified leads, like the Osterwalder-Seiler one below):
      Yarotsky 2006 for the vacuum sector, Bravyi-Hastings-Michalakis
      gap stability and Froehlich-Pizzo block diagonalisation for the
      excited band. Acquisition coordinates, primary-sourced 2026-08-30:
      Osterwalder-Seiler is INSPIRE recid 120117 ("Gauge Field Theories on
      the Lattice", Annals Phys. 110 (1978) 440; 792 citations as of
      2026-08-30); Yarotsky 2006 is not INSPIRE-indexed (Commun. Math.
      Phys., math-ph), so its entry awaits the pinned PDF route. The
      recorded F2 row's own claim -- interaction norm 27|u| with a
      periodic finite-quotient lemma -- remains a citation to an absent
      document.
    detail: >
      The two named hypotheses gating EVERY infinite-volume statement:
      the inhomogeneous Wilson free-energy bound with useful log K_alpha,
      and the source-radius reduction.
      Lead recorded 2026-08-30, unverified here: the Euclidean counterpart
      of the needed uniform-in-volume strong-coupling control is classical
      constructive work (the Osterwalder--Seiler cluster expansion for
      lattice gauge theory, 1978), which proves convergence and a mass gap
      at strong coupling uniformly in volume for the EUCLIDEAN theory. The
      open question G17 actually poses is the Hamiltonian transcription of
      that bound for this projected sector. Indexing the paper awaits a
      primary-source read (literature/index.yaml requires INSPIRE-sourced
      fields, never memory); nothing is promoted by this pointer.
    load_bearing: true

