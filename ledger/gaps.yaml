      The recorded 189-term fourth-order kernel has the narrower support {I,U,S,S^2,R}, with cleared-symbol span {q,q^2,e_2}; this proves B_shp=D_shp=0 without cancellation and excludes UR/RU. The all-rank channel and history-bijection arguments recorded separately remain intact. The seven-defect classification is restricted to the 39 words of lengths one through three; sigma(RR)=q e_2+3e_3 yields D=3B only when R^2 alone supplies that tier, and sigma(RUR)=4 e_2^2 lies outside the five-monomial cleared ansatz. No sixth-order dynamical coefficient follows. The live mechanism task is to derive the actual fourth-order support from the histories, including the absence of UR/RU and multiply inserted R, then determine which higher-order words appear. The original paragraph is retained below as historical source interpretation.
    feshbach_channel_2026_09_08_review_reason_2026_09_10: The exact UR counterexample falsifies R-degree-only exclusion; normalized carrier projectors require q>0.
    historical_feshbach_channel_2026_09_08_before_2026_09_10: |
      The mechanism question is answered for the cubic geometry, and the answer is one level above the orbit structure. The Feshbach complement of the carrier is a HODGE SUMMAND: L_down + L_up = q I per plane component and L_down L_up = 0, so Q is exactly the projector onto ker L_up, both Laplacians act on the carrier line by scalars, and the Hodge algebra generates no off-carrier coupling at all. Every excursion off the retained sector costs one insertion of the single non-Hodge operator R, whose excitation phi = Q R psi satisfies L_up phi = 0 identically. Every word in (S, U, R) with at most one R then has carrier symbol (-4)^#S (-2)^#R q^(#U + 1 - #R) e_2^#R, reaching only the c_0, A and 4C tiers; a word has nonzero Feshbach defect exactly when it contains two R insertions unseparated by U (so R U R factorizes and R S R does not). The recorded kernel is linear in R, so B = D = 0 is R-degree one -- not a cancellation, not a property of the six orbits, and true at every rank for any R-linear kernel. Suite "the Feshbach channel of the plaquette Hodge algebra", RESULT:HODGE_FESHBACH_SPLITTING and RESULT:TIER_COLLAPSE_IS_R_DEGREE, note CITE:HODGE_FESHBACH_CHANNEL, ADR 0045. Two further exact identities of the same algebra: sigma(RR) = q e_2 + 3 e_3, so a degree-3 tier carried by R^2 alone has D = 3 B; and sigma(RUR) = 4 e_2^2, whose shape symbol lies OUTSIDE the four-shape ansatz's span -- a registered FINDING and a falsifier candidate for U2 at sixth order. Which words order six populates is open (G9, G10); ADR 0005 is why that is stated as a prediction and not a result. The remaining G14-adjacent work is no longer "why does the degree-3 tier vanish" but "why is the fourth-order dynamics R-linear", i.e. why no history inserts the cross-plane operator twice.
    beta_n_assembled_2026_09_04: |
      The all-rank shape coefficient beta_N is the sum of eleven cluster cumulants per rank -- two pair clusters, the coplanar and perpendicular dressings, the corner, the two-hop weight and the adjacent-face cube completion -- assembled by the third engine at N = 4..70 and equal to the corpus's P17(N^2)/(N R20(N^2)) exactly at every rank (ADR 0027, runs/beta_n_from_assembly_2026-09-04). So the object the tier collapse is a property of is now in hand at every rank, cluster by cluster, and the mechanism question is a question about those clusters' channels (the next step above). Two of the eleven never enter: the coplanar and perpendicular pair clusters are one abstract graph up to conjugating a face, hence exact negatives at every rank, so beta_N is dressings, corner, two-hop weight and cube alone, and the pair cluster's double pole at N = 3 (the (3,0) determinant family) is invisible to it.
