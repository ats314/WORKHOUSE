    title: Source-family stability and a valid source-radius formulation
    status: |
      The raw alpha-dependent partition bound is established by DERIV:TRACK_A_SUPPORTED:G17_P with K_alpha=exp(|alpha|/2). The unrestricted centered exponential-source radius is not a consequence of clustering: DERIV:TRACK_A_SUPPORTED:G17_I gives divergence even for independent bounded centered sources. A valid source-family formulation and its actual interacting estimate remain open. The fixed-spacing infinite-volume Wilson band and literal-source frame are already established in G18; G17 is not a necessary gate for every infinite-volume construction.
    detail: |
      Identify the exact source operator, normalization and norm consumed by the selected spectral comparison. Derive a local, connected or normalized replacement only with a proof that it preserves that comparison and nonzero physical source weight. Linear susceptibility bounds do not bound the centered exponential source. Scalar KP inequalities and raw moment estimates remain useful ingredients but do not construct actual tilted Hamiltonian activities or imply a spectral gap.
    prior_title_2026_09_10: PC-2 free-energy stability and the source-radius reduction
    prior_status_2026_09_10: |
      ATTEMPT RECORDED, NOT DISCHARGED, 2026-09-10. paper/research_notes/G17_HAMILTONIAN_OSTERWALDER_SEILER_TRANSCRIPTION_20260910.md transcribes the Osterwalder--Seiler (1978) Euclidean polymer cluster expansion to the projected transfer/Hamiltonian sector and self-declares "G17 Status: Discharged in the projected transfer sector". It is kept as dated evidence and G17 stays open. Five defects, each verified against the note's own equations rather than inferred. (1) Its eq. (13) DEFINES log K_alpha := (D beta e^c/4)/(1 - D beta e^c/4), a function of beta, D and c ONLY -- it contains no alpha. PC-2 asks for a useful alpha-dependent constant, and <Omega, exp(alpha V_Gamma) Omega> grows with alpha, so an alpha-free bound cannot hold for all alpha; the boxed eq. (14) is false as written. (2) Its eq. (7) asserts spec(H_KS) subset {0} union [Delta_phys, infty) with Delta_phys >= (4/3) epsilon "By the Perron-Frobenius theorem". Perron-Frobenius gives a unique non-degenerate positive ground state, not an isolated volume-uniform gap. Section 4 then CONSUMES that gap -- eq. (18) sets M_gap >= Delta_phys > 0 -- to derive the source-radius reduction, so section 4 assumes the volume-uniform gap G17 exists to establish. (3) Its eq. (22) is exponential in |Gamma| (K_alpha^{|Gamma|} exp(alpha^2 sigma_conn |Gamma| / 2)); the boxed eq. (23) then holds only "for localized cluster sources with bounded diameter |Gamma| <= Gamma_0", so R_0 = R_0(Gamma_0). The reduction G17 asks for is uniform in |Gamma|; this one is capped by a footprint bound. (4) D = 38 and c = 1.0 are asserted, not derived. (5) The stated window conflates two thresholds. beta <= 0.038 is where the geometric series merely converges (x < 1 needs beta < 4/(38 e) = 0.038724); the Kotecky-Preiss tree criterion the note invokes by name needs x/(1-x) <= c = 1, i.e. x <= 1/2, i.e. beta <= 2/(38 e) = 0.019362. At the note's own beta = 0.038, x = 0.981300 and its log K_alpha = 52.4752 -- the same constant runs/gpu_yangmills_mil