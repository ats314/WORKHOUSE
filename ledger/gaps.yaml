      assumption: it follows from the order-2 Weingarten values. Two steps.
      The six nonshared links collapse, because each plaquette contributes a
      product of three independent Haar links and a product of independent
      Haar matrices is Haar -- so the two-plaquette amplitude is
      Tr(A U) Tr(B U^(+-1)) with A and B independent Haar, and integrating them
      leaves a pure degree-(2,2) moment of the shared link. Two such moments
      settle both families: M_direct = N^2 and M_cross = N, so the like family
      splits as (N+1)/(2N) and (N-1)/(2N), and the mixed family's singlet
      component of U_ij conj(U_lk) is delta_il delta_jk/N of squared norm 1,
      giving 1/N^2. All four are exactly d_R/N^2. Registered as
      `the shared-link weights are Weingarten, not an isotropy assumption`
      (T1), which imports nothing from the corpus -- the Weingarten pair is the
      inverse of the S_2 Gram matrix and the index sums are explicit.
      A_N, B_N and t_N therefore rest on representation theory alone.
