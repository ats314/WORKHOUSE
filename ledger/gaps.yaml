      ADJACENT faces. So a single weight on L_up is not the mechanism; on the
      historical records it is a reparametrisation that absorbs the
      difference into the rotation orbit. A mechanism for the tier collapse
      has to account for 53/768 against 80/768, which is the first concrete
      number a candidate has to reproduce. ADR 0021.
    replication_2026_09_02: >
