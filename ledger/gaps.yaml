  - id: G20
    tier: 3
    state: open
    title: SAFE-region curvature certificate
    detail: >
      The notes program's quantitative core: a certified lower bound on
      the projected physical Hessian H_phys over a SAFE ball around the
      identity (claimed constants kappa* = 0.25, delta = 0.006, headline
      min eigenvalue 0.248), feeding curvature -> LSI -> gap. As
      reviewed, the headline is UNREPRODUCED: the sole source table is
      contradicted by the archive's own scans and independent
      recomputation (single-link Haar profile is flat at 1/4), the
      operator's code has never been executed, and no lattice size is
      stated anywhere. What discharging requires: run the imported
      H_phys definition (notes/imported/RESEARCH_2026-08/) on a declared
      cluster and produce a reproducible number with stated convention
      -- or record the refutation. The only well-defined constant so
      far, V_Haar Hessian = I/4 at the identity, is machine-checked in
      the notes-program suite. The alpha = 0.976 RG-degradation story is
      refuted as stated (its own one-step bound is subtractive; see the
      FINDING check) and the honest mechanism is G23's.

  - id: G21
    tier: 3
    state: partial
    status: >-
      Appendix H audited in full 2026-08-22, proposition by proposition:
      the proof is sound end to end, and the no-factor-2 perturbation
      bound (Lemma H.3.3) is correctly derived and numerically confirmed
      with near-tight margin (<= 0.97). Remaining open: the standing T2
      sweep at several (m, alpha), the H.3.3 mechanism check, the
      arsinh-form float guard, and the deferred upstream Prop A.9.5.
    title: Davies/Combes-Thomas O(m) decay for the massive Maxwell 1-form kernel
    detail: >
      The strongest result in the notes archive, and the first to survive
      a full-proof audit: |G(b,b')| <= (2/m^2) exp(-eta dist) for
      G = (m^2 + alpha d1* d1)^-1 on lattice 1-forms of a finite
      periodic lattice, with eta = arcosh(1 + m^2/(2 alpha C)) =
      2 arsinh(m/(2 sqrt(alpha C))) -- an O(m) exponent where naive
      resolvent bounds give O(m^2). RE-ANCHORED after the audit: the
      canonical constant C is the WEIGHT-PROFILE row-sum C_bdy(M_1) of
      Def A.9.4 (Appendix H, Prop H.4.3); the proved crude chain is
      C_bdy <= C_0 <= 3 nu_P (B.4.6, verified tight on tori), and the
      D_E form rests on Prop A.9.5 whose proof is marked deferred --
      the one unproved upstream link. Recorded flaws, neither voiding
      anything: H.4.4 asserts an equality where only <= holds
      (conclusion survives via H.4.1), and the one-page COMBES_THOMAS
      streamline's factor-2 sketch does not derive its own stated pair
      (Appendix H does). Name collision settled: bare C_bdy = the
      A.9.4 weight-profile constant; the region-based homonyms always
      carry a region argument and are aliases. Kernel bound verified at
      six (m^2, alpha) points, margins 0.187-0.314; on
      translation-invariant tori C_bdy = C_0 exactly, so the refinement
      buys sharpness only off lattice symmetry. Float guard queued: eta
      must be evaluated in the arsinh form (the arcosh form loses 6082
      ulps at m/sqrt(alpha C) = 0.01). Checks registered: the exponent
      identity (T1) and the 3x3 certified kernel bound (T2); queued:
      the (m, alpha) sweep and the H.3.3 mechanism check, which
      localizes exactly the step where the streamline's spurious factor
      lived.

  - id: G22
    tier: 3
    state: open
    title: Coercivity via Cartan alignment
    detail: >
      The notes program's crux conjecture: on the rough set (average
      plaquette energy >= eps), configurations far from Cartan alignment
      have force norm bounded below, volume-uniformly. The original
      6-constraints-vs-3-DOF counting argument is refuted (stationarity
      at a link is 3 equations, and three orthogonal antipodal pairs sum
      to zero with no common Cartan direction -- a registered FINDING
      check), so whatever truth the conjecture has must come from the
      gauge-coupled structure across links. Falsifier, required by this
      register's own discipline: exhibit a configuration with
      B_avg >= eps, alignment bounded away from 1, and per-link force
      below any fixed floor -- by constrained minimization, not random
      sampling (the archive's 64k-sample "hunt" has no falsifying
      power and is set aside in the notes register).

  - id: G23
    tier: 3
    state: open
    title: The OS bridge with uniform constants
    detail: >
      The notes program's spine as a conditional chain: local curvature
      -> LSI -> diffusion gap -> exponential clustering -> OS
      reconstruction -> Hamiltonian mass gap, with two named holes that
      no archive document closes. (1) Uniformity: every implication
      holds at fixed cutoff and volume once a curvature floor rho_0 is
      granted; nothing supplies rho_0 uniform in a and volume. (2) The
      time splice: the chain needs decay in OS Euclidean time but the
      LSI machinery delivers it in Langevin/diffusion time. Revised
      after the 01_OS_RECONSTRUCTION review (2026-08-22): the splice is
      performed silently only in the one extracted chain document
      (digest a67d037c...); the archive at large DIAGNOSES it -- at
      least ten documents name "diffusion time != Euclidean time" as
      the missing analytic step, the Gaussian toy note quantitatively
      refutes the naive bridge (exact relation Delta = sqrt(lambda),
      registered as a FINDING check), and the scale-a family states the
      corrected, falsifiable target (one-step OS dissipation vs the
      BOUNDED scale-a Dirichlet form -- target, not theorem: the
      local-to-global gluing step and the compression-isometry premise
      are unproven, and the isometry needs nu to be the true slice
      marginal, which in the Gaussian model is exactly the sqrt-scaling
