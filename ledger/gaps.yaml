      psi, so every term but the last is a scalar there and B = D = 0 with
      nothing to cancel; R projects to -2 e2, which is 4C. The mechanism is
      therefore the Hodge structure of the kernel, given ONE dynamical input:
      the two-hop sector enters as the square of the second-order operator
      with a single weight u -- the fourth-order form of Prop. 2's "the same
      local fusion coefficient multiplies every surviving shared-edge pair".
