      Historical notes-program spine as a conditional chain: local curvature -> LSI -> diffusion gap -> exponential clustering -> OS reconstruction -> Hamiltonian mass gap, with two named holes that no archive document closes. (1) Uniformity: every implication holds at fixed cutoff and volume once a curvature floor rho_0 is granted; nothing supplies rho_0 uniform in a and volume. (2) The time splice: the chain needs decay in OS Euclidean time but the LSI machinery delivers it in Langevin/diffusion time. Revised after the 01_OS_RECONSTRUCTION review (2026-08-22): the splice is performed silently only in the one extracted chain document (digest a67d037c...); the archive at large DIAGNOSES it -- at least ten documents name "diffusion time != Euclidean time" as the missing analytic step, the Gaussian toy note quantitatively refutes the naive bridge (exact relation Delta = sqrt(lambda), registered as a FINDING check), and the scale-a family states the corrected, falsifiable target (one-step OS dissipation vs the BOUNDED scale-a Dirichlet form -- target, not theorem: the local-to-global gluing step and the compression-isometry premise are unproven, and the isometry needs nu to be the true slice marginal, which in the Gaussian model is exactly the sqrt-scaling distinction). Review verified that the corrected comparison passes the Gaussian test with uniform c ~ 1/2 -- a check the archive never ran, and the route's first positive data point. The sound supporting pieces are recorded by extraction; the proved no-go (RICCATI 04_no_go section 2) marks where the clean Schur mechanism cannot apply to gauge RG; the stronger "forces commutativity" no-go is unproved and set aside.
  - id: G24
    tier: 1
    state: discharged
    status: |
      discharged 2026-08-28, the day it was opened. The premise is not an assumption: it follows from the order-2 Weingarten values. Two steps. The six nonshared links collapse, because each plaquette contributes a product of three independent Haar links and a product of independent Haar matrices is Haar -- so the two-plaquette amplitude is Tr(A U) Tr(B U^(+-1)) with A and B independent Haar, and integrating them leaves a pure degree-(2,2) moment of the shared link. Two such moments settle both families: M_direct = N^2 and M_cross = N, so the like family splits as (N+1)/(2N) and (N-1)/(2N), and the mixed family's singlet component of U_ij conj(U_lk) is delta_il delta_jk/N of squared norm 1, giving 1/N^2. All four are exactly d_R/N^2. Registered as `the shared-link weights are Weingarten, not an isotropy assumption` (T1), which imports nothing from the corpus -- the Weingarten pair is the inverse of the S_2 Gram matrix and the index sums are explicit. A_N, B_N and t_N therefore rest on representation theory alone.
    title: Derive the shared-link isotropy premise, the one unproved input of the second-order chain
    detail: |
      Every all-rank second-order statement in this program -- A_N, B_N, t_N, the flat branch, the whole "color dynamics -> t_N, cellular geometry -> BB*" separation -- rests on one sentence: that after the six free-link Haar integrations the normalized shared-link tensor is isotropic, so the channel projector carries squared norm d_R/N^2. The arithmetic consequence is exact and now checked (the weights sum to one per family, and each channel gap is C_F + C_R/2). The premise itself is asserted. The corpus states the clause that earns it (corpus-import/papers/flat_band/PAPER_FLUX_glueball_flat_band_v1_1.tex); the 2026-08-28 manuscript compresses it to the word "isotropy" and its §9 claims the proof is self-contained. Independent support exists at N = 3 only, through the corpus's two-plaquette exact diagonalization, which pins A_3 = -27/68 and B_3 = -7/18 given B_3 - A_3 = 5/612. What would close it: an orientation-resolved Weingarten evaluation of the second-order two-plaquette element at N = 3 and N = 4, returning A_N and B_N SEPARATELY, compared against the registered closed forms. Agreement at two ranks moves the manuscript's central input from T3 to T1. The ingredients are already here and import nothing from the corpus: invariants.py carries Wg(e), Wg((12)) and the N = 3 fourth moment |U_11|^4 = 1/6, and the published-comparisons suite already establishes that the Weingarten route is corpus-independent.
    depends_on: []
  - id: G25
    tier: 1
    state: partial
    plan:
      - step: fourth-order domino, the U4 falsifier
        state: live
        status: |
          PROGRESS 2026-09-03, parts (1) and (3) below done, (2) sharpened. (1) The engine-free rotor now runs to fifth order by Rayleigh-Schrodinger (swap-odd suite, T1): vac_4 = -39/1280, gap_4 = 1657/28000 (C-even) and 143/8960 (C-odd). The first is the v10a.7 Hodge engine's one-face vacuum gate and the second is the size-1 row of m_Gamma^(4) in the channels suite, both matched to the digit, so two historical fourth-order numbers are now derived. The decisive one is new: the vacuum's share of the excited C-even energy plus the vacuum energy is -63/800 at fourth order, after being 0 at orders 1-3. So the disconnected half of the falsifier is NONZERO: leak_(4,+) - t_(4,+) = 63/800 + conn_A - conn_vac. (3) Exhausted: the domino engine emits one swap-odd observable per order, De - Te, and it is matched at orders 1-3. (2) The connected domino vacuum conn_vac is already in the corpus: the v10a.7 engine gates the two-face vacuum linked O(u^4) weight omega4 = -327/83776, the SAME for coplanar and perpendicular pairs, with zero linked O(u^2) and O(u^3) (corpus-import/programs/hodge_o4_adjudication/ src/ENGINE_O4_hodge_v10a7_marked_linked_scalar.py, float gates at a stated tolerance with rational recognition -- T3 here until re-derived). Taking it as read, U4's all-orders equality holds at fourth order if and only if the connected swap-odd excited diagram is conn_A = omega4 - 63/800 = -173109/2094400. That one number is what remains, and nothing in the corpus computes it: it needs the two-plaquette states |R_1, R_2, R_s> with W acting on one plaquette while the other is charged, i.e. SU(3) recoupling coefficients, or the pinned engine's word calculus extended to letter degree five with fourth-order des Cloizeaux. Original costing follows.
          Compute leak_(4,+) - t_(4,+) on the abstract domino. ADR 0023 derives the identity through third order and predicts where it stops: at order four the inert plaquette can be excited and de-excited within one walk, and the domino vacuum acquires its first connected diagram, so the difference is [connected (excited, fluctuating-neighbour) diagram of the swap-odd state] minus [connected domino vacuum diagram]. Zero is a cancellation the derivation does not predict; nonzero ends the identity. Cost, in three parts. (1) Cheap, engine-free: the single-plaquette rotor of the swap-odd suite extended to fourth order pins gap_4 and vac_4 for both sectors, i.e. every disconnected piece of the difference. Degenerate perturbation theory with a first-order split manifold at fourth order needs the Bloch/des Cloizeaux formula one order up, so it is error-prone rather than expensive. (2) Not cheap: the two connected diagrams need the domino at order four. The pinned ENGINE_FLUX_su3_domino_d3.py keeps every function at letter degree <= 4 by Cayley-Hamilton and implements des Cloizeaux to third order; a fourth-order walk reaches degree five, so both the basis and the perturbation formula must be extended and the Haar-moment layer (ENGINE_FLUX_su3_moments_ext) must supply p = q = 4 Weingarten data. Not a G3 byproduct. (3) A zero-cost check first: any third-order observable of the swap-odd state the engine computed for another gate must equal the rotor's, since the derivation says psi_A is a free excitation beside an inert plaquette in every quantity through third order, not only in energy.
    status: |
      opened and largely discharged 2026-08-28. The C-even sector was registered and inert: LEAK_2, LEAK_2_EVEN and LEAK_3_EVEN were read by no check body, band_assembly() was dead code, and the only C-even geometry the repository checked was two hand-written matrices at Gamma and R. The `charge-even band, exactly` suite (15 checks, all T1) closes the second- and third-order half. Both entries of constants.DECLARED_COINCIDENCES are now checked rather than only declared: -11/306 is ell_N at all ranks, so its three labels are one object; -6335/249696 is verified and stays unexplained, as U4. The load-bearing new object is a closed form: with a_m = 2 + 2 cos k_m and p = sum a_m, the unsigned Bloch Gram has characteristic polynomial mu^3 - 2p mu^2 + p^2 mu - 4 a_1 a_2 a_3 and lambda = mu - 4, exactly, at every k -- the C-even counterpart of the C-odd {-4, q-4, q-4}. The one-plaquette program and the flat-band papers carry no such formula; what they record for this sector is the range, the Gamma expansion, and a dense zone scan. From the cubic: lambda in [-4, 12] with each edge attained at exactly ONE momentum, Gamma and R, which a scan cannot report; the floor attained exactly on the three planes k_j = pi, simple there and triple only at R; the isotropic Gamma expansion lambda = 12 - (4/3)|k|^2 that yields the corpus's curvature 22/459 and 6335/187272; and the 12-regularity of the plaquette graph -- the 12 in the assembly's `12 leak`, gated in the corpus but never counted inside this verification layer. The Bloch cubic is checked complete against the integer characteristic polynomial of the finite L = 3 and L = 4 plaquette adjacencies. One draft claim was retracted before landing: that the corpus argues the upper band edge nowhere. It does, in the band certificate's neighbour gate and the results note's prose; the retraction is recorded in the check body rather than deleted. Also derived: p + q = 12, so both sectors run on one zone function; the C-even Gamma splitting A