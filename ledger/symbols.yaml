# Symbol aliases, curated by hand and checked against the corpus.
#
# This file exists because the names this repository uses are frequently NOT
# the names the corpus uses, and a search that does not know that returns
# nothing and reads as absence. Measured examples:
#
#   this repo   corpus                          corpus hits for the repo name
#   C_shp       C_shape, C_{\mathrm{old}}        0
#   Delta_Gamma \Delta_\Gamma                    0
#   Phi_C       (unnamed; written 4e_2/q_a)      0   <- coined here
#
# `corpus_spellings` are OBSERVED, not invented: tests/test_symbols.py greps the
# corpus for each one and fails if it has gone. A spelling that cannot be found
# is either a typo here or a document that moved, and both are worth knowing.
#
# `coined_here: true` marks a name this repository invented. An agent searching
# the corpus for it will find nothing, and that is not evidence the concept is
# absent.
schema: symbols/v1

symbols:
  - id: ell_n
    canonical: ell_N
    meaning: >
      All-rank C-even second-order hopping. Printed in the corpus and gated in
      a notebook as factor(Wmix + Wlike + 1/CF), unregistered here until
      2026-08-28. The 1/C_F is the vacuum-mediated route p -> |0> -> q, which
      is exactly what C13 records as having been omitted: A_3 + B_3 = -481/612
      is the superseded value and 1/C_F(3) = 3/4 the correction. The route is
      absent from the C-odd sector because <0|V|p,-> = 0 by charge
      conjugation, which is why t_N = B_N - A_N carries no such term.
    code_names: [even_hopping, T_PLUS_2]
    corpus_spellings:
      - 'ell_N'
      - '-2*N*(3*N**2 - 5)'
    values:
      - "-11/306"
    claims: [C13, R2]

  - id: shared_link_weights
    canonical: w_R
    meaning: >
      The resolvent weight of one shared-link fusion channel,
      -(d_R/N^2)/(C_F + C_R/2), summing to A_N over F (x) Fbar and B_N over
      F (x) F. The numerator d_R/N^2 is the manuscripts' "isotropy" sentence:
      asserted there, and derived here from the order-2 Weingarten values --
      the six nonshared links collapse to two independent Haar matrices, and
      two degree-(2,2) moments (N^2 and N) settle both families. G24.
    code_names: [channel_weight, channel_data, shared_link_weights]
    corpus_spellings:
      - 'w_R'
      - 'W_mix'
      - 'Wlike'
    claims: [G24, R2]
    note: >
      The corpus writes the two family SUMS as W_mix and W_like and the
      per-channel weight as w_R. Registered here because the derivation of the
      numerator d_R/N^2 -- the manuscripts' one asserted word -- is new (G24),
      not the name.
  - id: q_band_4
    canonical: q_band^(4)
    meaning: >
      Fourth-order rest scalar in the band-kernel anchoring. NOT a competing
      estimate of m_Gamma^(4) -- a differently anchored coordinate.
    code_names: [Q_BAND_4]
    corpus_spellings:
      - 'q_{\mathrm{band}}^{(4)}'
      - 'q_{\mathrm{old}}^{(4)}'
      - 'q_old'
    values:
      - "-20721577909065127111/7250590288602460800"
      - "-2.857915988114559"
    claims: [C1, R4]
    forbidden:
      - text: m_4
        why: >
          Calling this and m_Gamma^(4) both "m_4" regenerates a contradiction
          that does not exist. The register says so at R4 and ADR 0002 records
          why. Use the anchored names.

  - id: m_gamma_4
    canonical: m_Gamma^(4)
    meaning: >
      Vacuum-subtracted physical Gamma-point fourth-order coefficient. Blind
      match to Hamer's a_4 through m_n = 2**(n-1) a_n.
    code_names: [M_GAMMA_4_NUM]
    corpus_spellings:
      - 'm_\Gamma^{(4)}'
    values: ["-0.7751458630189173"]
    claims: [C1, R4]
    forbidden:
      - text: m_4
        why: same collision as q_band^(4); see ADR 0002.

  - id: c_shp
    canonical: C_shp
    meaning: >
      Off-axis fourth-order shape coefficient. Resolved 2026-09-04 (ADR
      0024): C_historical + 25/1024. Formerly the one genuinely open
      contradiction: two irreconcilable values, neither promoted.
    code_names: [C_SHP_HISTORICAL, C_SHP_NEW_NUM]
    corpus_spellings:
      - 'C_shape'
      - 'C_{\mathrm{old}}'
      - 'C_{\mathrm{new}}'
      - 'C^{(4)}'
    values:
      - "-211835444920651/4405310420659200"
      - "-0.04808638318135875"
      - "-0.020213328886166577"
    claims: [C2, R5, G3]
    note: >
      The repo name C_shp appears nowhere in the corpus. Search for C_shape.

  - id: delta_gamma
    canonical: Delta_Gamma
    meaning: Scalar shift m_Gamma^(4) - q_band^(4). Fixed by Gamma-point data.
    code_names: [DELTA_GAMMA_NUM, DELTA_GAMMA_AS_PRINTED_NUM]
    corpus_spellings:
      - '\Delta_\Gamma'
    values: ["2.0827701250956417", "2.0827701250956414"]
    claims: [C1, R6]
    note: >
      The corpus prints ...414; the correctly rounded value is ...417. One ulp,
      recorded as a FINDING rather than corrected in the document.

  - id: delta_c
    canonical: Delta_C
    meaning: >
      Off-axis shift C_new - C_old. Gamma-point data cannot constrain it,
      because the kernel it multiplies vanishes at Gamma.
    code_names: [DELTA_C_NUM]
    corpus_spellings:
      - 'Delta_C'
      - '\Delta_C'
    values: ["0.027873054295192174"]
    claims: [C2, G3]

  - id: pi_reduced
    canonical: pi~
    coined_here: true
    meaning: >
      The coplanar shared-link fourth-order amplitude with the two-hop shadow
      removed: pi~ = pi + 2u. In the Hodge form of the kernel it multiplies
      S_sq itself, and C_shp = -5/96 - (rho + pi~)/2 exactly, with no u.
    code_names: [PI_REDUCED]
    corpus_spellings: []
    values: ["-205125054864713/12642703205932800"]
    claims: [C2, G3, G14]

  - id: sigma_reduced
    canonical: sigma~
    coined_here: true
    meaning: >
      The on-site fourth-order amplitude with the two-hop shadow removed:
      sigma~ = sigma - 12u. It is the constant term of the Hodge form and
      enters the carrier band through c_0 alone.
    code_names: [SIGMA_REDUCED]
    corpus_spellings: []
    values: ["-1249434547013129251/483372685906830720"]
    claims: [C2]

  - id: u_even_chain
    canonical: u_even
    coined_here: true
    meaning: >
      The C-even fourth-order chain amplitude: the cumulant W(P,Q,R) - W(P,R)
      on the P -> R element in the C-even sector, for Q sharing one link with
      each of the link-disjoint P and R. The same rational on all three chain
      types (coplanar-coplanar, coplanar-perpendicular,
      perpendicular-perpendicular), with no incidence sign because the C-even
      shared-link hop -11/306 carries none. Its C-odd partner is X_QUANTUM,
      the two-hop weight u of the Hodge form, which the same runs reproduce
      exactly. Yielded by the first implementation's check and matched by the
      replication's. Not held by either recorded kernel, which are C-odd.
    code_names: [U_CHAIN_C_EVEN]
    corpus_spellings: []
    values: ["948253471/40327601932800"]
    claims: [G3, G14, C2]

  - id: phi_c
    canonical: Phi_C
    coined_here: true
    meaning: >
      The crosswalk kernel 4 e_2(k) / q_a(k). Phi_C(0) = 0, which is why the
      Gamma-point scalar places no constraint on Delta_C -- the structural
      reason C2 cannot be closed by re-anchoring.
    code_names: [phi_c]
    corpus_spellings:
      - '\frac{4e_2}{q_a}'
      - '4e_2/q'
    values: []
    claims: [C2, G3]
    note: >
      The corpus never names this object. It writes the expression inline. An
      agent grepping for Phi_C finds nothing, and that is not absence.

  - id: h4_side
    canonical: h_4^side
    meaning: >
      Isotropic pentagonal-prism fourth-order side coefficient, A_+ - A_-.
      Separate geometry; does not bear on the cubic kernel.
    code_names: [H4_SIDE]
    corpus_spellings:
      - 'h4_side'
      - 'h_4^{\mathrm{side}}'
    values: ["-2861009/84387303000"]
    claims: [R20, R21, G4]

  - id: tau_4
    canonical: tau_4
    meaning: >
      Pentagonal cap hopping coefficient, h_4^side times 5 by exact D_5
      covariance. The symbol is 2 tau_4 cos k.
    code_names: [TAU_4]
    corpus_spellings:
      - '\tau_4'
      - 'tau_4'
    values: ["-2861009/16877460600"]
    claims: [R21, G4]

  - id: a_shp_3
    canonical: A_shp
    meaning: >
      Sealed fourth-order shape coefficient 5/48. Both disputed kernels agree
      on it, which is what "sealed core" means.
    code_names: [A_SHP_3, A_SHP_3_NUM]
    corpus_spellings:
