      - 'A_{\mathrm{old}}'
    values: ["5/48", "0.104166666666728"]
    claims: [R7, G14]
    note: >
      5/48 lives in 44 code files that the prose index cannot see. It is the
      clearest case for searching by value rather than by name.

  - id: t_n
    canonical: t_N
    meaning: All-rank second-order hopping, B_N - A_N. t_2 = 0, t_3 = 5/612.
    code_names: [T_MINUS_2, hopping]
