  - id: c_2_tet
    canonical: c_{2,prim}^tet
    meaning: >
      Tetrahedral primitive local Haar-resolvent coefficient, the r = 2 row of
      the corpus's primitive completion law c_{r,prim}. Asserted in the corpus
      with no artifact or reference SHA anywhere; re-derived exactly at
      symbolic N by workhouse.cellular (G5). Primitive simple-loop channel
      only — physical survival after compression/Q-projection is U3's
      question, not this coefficient's.
    code_names: [TETRA_COMPLETION_2_SU3, c_prim_printed]
    corpus_spellings:
      - '-8/[N(N^2-1)]'
      - 'tetrahedral completion'
      - 'c_{r,\rm prim}'
    values: ["-1/3"]
    claims: [C15, G5]

  - id: x_quantum
    canonical: x (degree-3 record quantum)
    coined_here: true
    meaning: >
      The single amplitude quantizing every degree-3 channel coefficient of
      the historical 189-record kernel: each block's q e_2 and e_3 amplitude
      is an integer multiple of x, itself a raw record weight, and the tier
      collapse is (+1,+1,-2)x and (-3,+6,-3)x exactly (suite "off-axis
      channel ledger"). Coined by the maintainer's off-axis ledger
      (WORK_SINCE_2026-08); the corpus has no name for it.
    code_names: [X_QUANTUM]
    corpus_spellings: []
    values:
      - "360421351/40327601932800"
    claims: [C2, G14]

  - id: beta_3_bal
    canonical: beta_3^bal
    meaning: >
      The balanced (epsilon-free) continuation of the all-rank shape formula
      at N = 3: P17(9)/(3 R20(9)), equal to the pinned structured B_N
      expression there. Differs from the historical beta_3 by exactly 25/64
      (the recorded C10 shift); a third coordinate beside the two C2 sides,
      never a side itself.
    code_names: [beta_formula]
    corpus_spellings:
      - 'B₃^bal'
      - 'q_N^bal'
    values:
      - "15644916262153/34416487661400"
    claims: [C2, C10]

  - id: c4_adjacent
    canonical: c_4^adj
    coined_here: true
    meaning: >
      The cube-completion channel between two ADJACENT faces of a unit cube,
      -106/(N(N^2-1)^3) at every rank: the primitive simple-loop law's -88
      plus ten multi-loop orderings at -18 (ADR 0024). In the kernel's own
      (0,2) basis it is the -53/768 the rotation record carries; the
      historical Stage-3I ledger holds 8 of its 24 orderings, -31/1536.
      Its opposite-face partner is the sealed core's c_4^square = -5/48.
    code_names: [CUBE_COMPLETION_ADJACENT_4, CUBE_COMPLETION_ADJACENT_HISTORICAL_4, cube_completion_adjacent]
    corpus_spellings: []
    values: ["-53/768", "-31/1536"]
    claims: [C2, G3, G14]

  - id: rho_assembled
    canonical: rho_assembled
    coined_here: true
    meaning: >
      The cluster-assembled rotation amplitude read in the kernel's own
      basis, the x-then-z traversal of the (0,2) face in which all 24
      cross-plane records are rho times the L_down incidence: minus the
      2026-09-02 run's RHO_CLUSTER. It differs from RHO_ORBIT by exactly
      25/512, the adjacent-face cube completion, and gives
      C_shp = C_historical + 25/1024 (ADR 0024).
    code_names: [RHO_ASSEMBLED, C_SHP_ASSEMBLED]
    corpus_spellings: []
    values: ["-588708011765248393/14501180577204921600", "-13035490122347/550663802582400"]
    claims: [C2, G3]
