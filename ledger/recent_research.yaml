  statement: On the actual compact square, the global noncommuting inequality 1-w<=V and the true-ground
    transform prove g^-2 integral(1-w)|f|^2 <= (1+E/gamma)b_g[f] for every centered finite-energy source,
    uniformly at small coupling. The conditional-score Hardy constant is finite on every closed positive-coupling
    interval, with vanishing endpoint tail products. An exact Gaussian source-preserving dilation bump
    has vanishing averaged score control but Hardy constant at least exp(-2)/(2g^2). A specified phase-adapted
    local source-preserving field removes the centered leading phase term; its chart-restricted variance
    bound follows under stated conditional Poincare and amplitude-jet inputs. The additional score estimate
    K_g<=C0+C1 g^-2 E(V|w) would imply the explicit uniform Hardy bound, but that score estimate remains
    open.
