# The sequence register — this corpus's integer sequences, asked of the OEIS.
#
# The OEIS is the one external index joinable to this corpus by VALUE rather
# than by concept, which is the join key everything here already uses. A match
# would tie a coefficient computed in this program to combinatorics computed by
# people who never heard of it — independent in the sense AGENTS.md means.
#
# Discipline (src/workhouse/oeis.py enforces it):
#
#   terms are BUILT, never transcribed. `builder` names a function that
#   recomputes the sequence from the registered constants, so a sequence here
#   cannot drift away from the numbers it came from. A `terms:` field
#   copied by hand would be a fourth place for a transcription slip to hide.
#
#   `generated_by` is declared, and it decides what a hit can mean:
#     closed-form-in-N   a rational function of the rank or the order. The
#                        OEIS holds polynomial families without number, so a
#                        hit identifies a NORMALISATION, not a mechanism, and
#                        its verdict is fixed at not-evidence however striking.
#     census-output      terms that fell out of an enumeration nobody could
#                        have written down in advance. Only these can carry a
#                        hit that means anything.
#
#   `what_a_hit_would_mean` is mandatory, and it is this register's falsifier
#   field: a sequence whose owner cannot say what a match would establish is a
#   fishing expedition, exactly like a unifying candidate with no falsifier.
#
#   the scan is OFFLINE. oeis.org/robots.txt says `Disallow: /search`, so the
#   search API is never called. `workhouse oeis --fetch` takes the maintainers'
#   own published dump (oeis.org/stripped.gz) once; the scan runs against it
#   locally and records the EXACT number of matching sequences among all
#   ~400,000 — which the ten-result search API could not report anyway.
#
#   `scan:` is the reviewed result, and it is what the checks read, so CI never
#   needs the 32 MB dump or the network. `prefix_hits` is the discriminating
#   power made visible: how the match count collapses as terms are added.
#   `expected_by_chance` is the unigram null model built from the dump itself.
#
# No verdict here promotes anything past T3. A match becomes an OEIS:A######
# node with a `matches` edge to the sequence; the sequence's own `bears_on`
# edges are what reach the claims. An OEIS entry is a document like any other,
# and its verdict rides on the node rather than deciding whether it exists --
# a not-evidence match is still a match, and hiding it would be worse.

schema: sequences/v1

snapshot:
  source: https://oeis.org/stripped.gz
  # The dump is regenerated daily, so this digest pins WHICH snapshot the
  # recorded scan was taken against, not a value that is supposed to be stable.
  # A rescan against a newer dump that changes a verdict is a finding, not a
  # failure — that is what an external witness moving looks like.
  sha256: ceb8f5e6b6a4ed03f220036dd811e4aa3b00d1569b2d10eb6f46033a957ac432
  last_modified: 'August 28 04:52 UTC 2026'
  scanned: '2026-08-28'
  sequences_in_snapshot: 398735
  term_slots: 17721438


