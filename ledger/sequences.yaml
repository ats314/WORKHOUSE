sequences:
  - id: T_N_NUM
    title: Numerators of the all-rank C-odd hopping t_N = B_N - A_N, N = 2..14
    builder: t_n_numerators
    generated_by: closed-form-in-N
    bears_on: [R2, C13, T_MINUS_2]
    what_a_hit_would_mean: >
      t_N = 2N(N^2-4)/((N^2-1)(2N^2-1)(4N^2-9)) is a rational function of the
      rank, so the numerators after gcd reduction look irregular without being
      so. A hit would name the reduction pattern and nothing more; the rank law
      itself is already T1. Registered because the reduced numerators are the
      one part of the family that is NOT obviously a polynomial, and a negative
      result costs one pass over the dump.
    scan:
      snapshot: '2026-08-28'
      terms: [0, 5, 32, 5, 128, 105, 320, 11, 640, 429, 160, 715, 1792]
      prefix_hits: {3: 14, 4: 1, 5: 0, 6: 0, 7: 0, 8: 0, 9: 0, 10: 0, 11: 0, 12: 0, 13: 0}
