  - id: C_SHP_NEW_DIGITS
    title: Leading twelve significant digits of the v10a.26 C_shp, as a constant
    builder: c_shp_new_digits
    generated_by: census-output
    bears_on: [C2, G3, C_SHP_NEW_NUM]
    what_a_hit_would_mean: >
      This is the one identification route the digit budget does NOT close.
      Every other route fails because the recorded float carries 12.6 digits
      and a rational at the historical denominator needs 31.4 — but an OEIS
      entry with keyword cons carries hundreds of digits, so a match on the
      twelve the run does know would SUPPLY the rest and identify the
      coefficient outright. Twelve digits and not seventeen because the run's
      own shift-invariance failure puts its noise floor at 4.6e-15; querying
      the noise would guarantee a miss. A hit would be decisive for C2 and
      would have to survive the same falsifier as any candidate: the exact
      value must still agree once more digits exist. A miss establishes
      nothing beyond the OEIS not knowing this constant.
    scan:
