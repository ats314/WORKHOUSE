      D - 4 N^3 (2N(N^2-4)) = 2N^4 + 31N^2 - 9, where D is the common
      denominator (N^2-1)(2N^2-1)(4N^2-9).
    formalizes: [CONST:t_N]
    promotes:
      - "deficit identity 1/4 - N^3 t_N"

