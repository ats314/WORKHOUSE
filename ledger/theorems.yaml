# Lean theorems, mapped by hand to the claims they bear on.
#
# This file exists because nothing machine-links the T0 layer to anything else:
# a Lean theorem carries no claim id, and `index/claims.jsonl` could not say
# which claim `newton_three` refuted a mechanism for. The precedent is
# `ledger/symbols.yaml`: judgement lives in a curated YAML, the join is
# derived, and validation is mechanical (`tests/test_graph.py`) —
#
#   - every `name` must be a theorem in lean/Workhouse/Basic.lean, and every
#     theorem there must have an entry here;
#   - every `formalizes` entry must resolve to a catalogue record;
#   - every `promotes` entry must match exactly one registered invariant
#     check, by its exact name — and it belongs here only if the theorem,
#     alone or jointly with the other theorems naming the same check, proves
#     the check's whole statement, not one ingredient of it (the cleared
#     denominator forms are equivalent per lean/CLAUDE.md);
#   - a `value` must parse as an exact rational and is the value the theorem
#     itself states.
#
# `statement` is curated the way `meaning` is in symbols.yaml: written from
# the theorem's statement and doc comment, reviewed like any other curated
# line, and copied verbatim into the catalogue at generation time. Where no
# defensible link exists the lists stay empty — an honest gap beats an
# invented edge.
schema: theorems/v1
source: lean/Workhouse/Basic.lean

theorems:
  - name: rank_law_numerator
    statement: >
      The rank law with denominators cleared: the channel difference has
      numerator 2N(N^2-4), which is the hopping numerator.
    formalizes: [CONST:t_N, R2]
    promotes:
      - "t_N = B_N - A_N"

  - name: hopping_three
    statement: "t_3 = 5/612, the SU(3) value of the all-rank hopping."
    value: "5/612"
    formalizes: [CONST:t_N, R2]
    promotes:
      - "t_2 = 0 and t_3 = 5/612"

  - name: hopping_two
    statement: >
      t_2 = 0: SU(2) is excluded at the source, and the N^2-4 factor is its
      algebraic shadow.
    value: "0"
    formalizes: [CONST:t_N, R2]
    promotes:
      - "t_2 = 0 and t_3 = 5/612"

  - name: hopping_deficit_numerator
    statement: >
      The N^-3 cancellation leaves a positive deficit, denominators cleared:
      D - 4 N^3 (2N(N^2-4)) = 2N^4 + 31N^2 - 9, where D is the common
      denominator (N^2-1)(2N^2-1)(4N^2-9).
    formalizes: [CONST:t_N]
    promotes:
      - "deficit identity 1/4 - N^3 t_N"

  - name: "d₃_ledger"
    statement: "The third-order ledger identity d_3 = 7/32 + 12 leak_3 - 4 b_3."
    value: "-109151/249696"
    formalizes: [CONST:D_3, CONST:B_3, CONST:LEAK_3]
    promotes:
      - "d_3 = 7/32 + 12*leak_3 - 4*b_3"

  - name: alphaPen_three
    statement: "The sealed fourth-order axial law at SU(3): alpha_3 = 5/12."
    value: "5/12"
    formalizes: [CONST:alpha_pen_N]
    promotes:
      - "alpha_3 = 4*A_shp = 5/12"

  - name: alphaPen_four
    statement: "The sealed axial law at the exceptional rank N = 4: alpha_4 = 32/675."
    value: "32/675"
    formalizes: [CONST:alpha_pen_N]
    promotes:
      - "axial law reproduces alpha_4, alpha_5, alpha_6"

  - name: alphaPen_five
    statement: "The sealed axial law at the exceptional rank N = 5: alpha_5 = 1/108."
    value: "1/108"
    formalizes: [CONST:alpha_pen_N]
    promotes:
      - "axial law reproduces alpha_4, alpha_5, alpha_6"

  - name: alphaPen_six
    statement: "The sealed axial law at the exceptional rank N = 6: alpha_6 = 64/25725."
    value: "64/25725"
    formalizes: [CONST:alpha_pen_N]
    promotes:
      - "axial law reproduces alpha_4, alpha_5, alpha_6"

  - name: alphaPen_three_eq_four_A
    statement: >
      The axial coefficient is four times the sealed shape coefficient:
      alpha_3 = 4 A_shp.
    formalizes: [CONST:A_shp_3, CONST:alpha_pen_N, R7]
    promotes:
      - "alpha_3 = 4*A_shp = 5/12"

  - name: blind_holdout
    statement: >
      The pencil relation lambda_R = 2 lambda_M - lambda_X: R is determined by
      X and M, so it can be withheld from a fit and used as an independent
      check.
    formalizes: [G3]
    promotes: []

  - name: stencil_zero_mode
    statement: >
      The 25-point stencil obeys a zero-mode gate: the weights sum to zero.
    formalizes: []
    promotes: []

  - name: C_from_beta
    statement: >
      Historical-kernel internal consistency: C_shp_old = (beta_pen_3 -
      2 alpha_3)/16. One kernel's own arithmetic — not an adjudication of C2.
    formalizes: ["CONST:C_shp (historical)", CONST:BETA_PEN_3]
    promotes:
      - "C_old = (beta_pen_3 - 2*alpha_3)/16"

  - name: width_eq_alpha_add_beta
    statement: >
      Bandwidth is the sum of the two pencil coefficients: W_4 = alpha_3 +
      beta_pen_3, in the historical kernel.
    formalizes: [CONST:W4_HISTORICAL_NUM, CONST:BETA_PEN_3]
    promotes: []

  - name: beta_from_A_and_C
    statement: >
      The tier-collapse relation beta_pen_3 = 8 A_shp + 16 C_shp_old, valid
      when B_shp = D_shp = 0.
    formalizes: [G14, CONST:A_shp_3, "CONST:C_shp (historical)"]
    promotes: []

  - name: newton_three
    statement: >
      Newton's identity in three variables. A degree-3 numerator carries an
      e_3 component — the step that refuted the degree-bound mechanism
      proposed for the tier collapse. The RETRACTED check uses it as its
      witness; the theorem proves the identity, not the whole check.
    formalizes: [G14, "ADR:0004", "ADR:0005"]
    promotes: []

  - name: extraction_A
    statement: >
      Checkpoint-extraction formula A, inverting the cubic-invariant ansatz
      on the checkpoint deltas: dX/4 recovers A. The delta forms it assumes
      are proved from the ansatz by delta_X..delta_R, so the two groups
      together cover the T1 extraction check whole.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "the four extraction formulas invert the ansatz"

  - name: extraction_B
    statement: >
      Checkpoint-extraction formula B, inverting the cubic-invariant ansatz
      on the checkpoint deltas dX, dM, dP, dR. The inversion half; the
      ansatz-evaluation half is delta_X..delta_R, proved alongside it.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "the four extraction formulas invert the ansatz"

  - name: extraction_C
    statement: >
      Checkpoint-extraction formula C, inverting the cubic-invariant ansatz
      on the checkpoint deltas dX, dM, dP, dR. The inversion half; the
      ansatz-evaluation half is delta_X..delta_R, proved alongside it.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "the four extraction formulas invert the ansatz"

  - name: extraction_D
    statement: >
      Checkpoint-extraction formula D, inverting the cubic-invariant ansatz
      on the checkpoint deltas dX, dM, dP, dR. The inversion half; the
      ansatz-evaluation half is delta_X..delta_R, proved alongside it.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "the four extraction formulas invert the ansatz"

  - name: "dim_Z₂"
    statement: >
      The cycle count on the three-torus: (L^3 - 1) + 3 = L^3 + 2, cube
      boundaries plus the harmonic triplet.
    formalizes: []
    promotes:
      - "dim Z_2 = (L^3 - 1) + 3 = L^3 + 2"

  - name: cPrimTwo_forms
    statement: >
      The primitive completion law's two printed forms agree at the target
      order r = 2: S/(N^2 C_F) = 2S/(N(N^2-1)) for every count S and every
      rank with N and N^2 - 1 nonzero. The r = 3..5 cases and the scaling
      statement stay at T1; the enumeration that produces each S is
      workhouse.cellular's, not this theorem's.
    formalizes: ["SYM:c_2_tet"]
    promotes: []

  - name: tetra_from_count
    statement: >
      The tetrahedral count S_2 = -4 produces the asserted row: cPrimTwo(-4)
      = -8/(N(N^2-1)). The law-application half of G5's closing step; the
      two-history enumeration behind S_2 = -4 remains T1.
    formalizes: [C15, G5, "CONST:c_2^tet (primitive)"]
    promotes: []

  - name: tetraCompletion_three
    statement: "c_2^tet(3) = -1/3, the SU(3) value of the tetrahedral row."
    value: "-1/3"
    formalizes: [C15, "CONST:TETRA_COMPLETION_2_SU3"]
    promotes: []

  - name: prismCompletion_three
    statement: >
      c_3^prism(3) = 1/3, the SU(3) value of the prism square-sector row.
    value: "1/3"
    formalizes: ["CONST:PRISM_COMPLETION_3_SU3"]
    promotes: []

  - name: cubeCompletion_three
    statement: >
      c_4^square(3) = -A_shp = -5/48: the cube row's SU(3) value is minus the
      sealed shape coefficient.
    value: "-5/48"
    formalizes: ["CONST:CUBE_COMPLETION_4", "CONST:A_shp_3"]
    promotes: []

  - name: pentCompletion_three
    statement: >
      c_5^pent(3) = 35/384, the SU(3) value of the pentagonal cap-sector row.
    value: "35/384"
    formalizes: ["CONST:PENT_COMPLETION_5_SU3"]
    promotes: []

  - name: alphaPen_eq_neg_four_cube
    statement: >
      alphaPen(N) = -4 c_4^square(N) at every rank: the bridge between the
      sealed core's axial law and the completion family's cube row.
    formalizes: ["CONST:alpha_pen_N", "CONST:CUBE_COMPLETION_4"]
    promotes: []

  - name: bandVar_zero
    statement: >
      The band variable vanishes at zero momentum: a(0) = 0, with
      a(k) = 4 sin^2(k/2).
    formalizes: [SYM:bloch_scalars]
    promotes: []

  - name: bandVar_pi
    statement: >
      The band variable at the zone boundary: a(pi) = 4. This is the value
      that makes every checkpoint invariant rational.
    formalizes: [SYM:bloch_scalars]
    promotes: []

  - name: bandVar_pi_div_two
    statement: >
      The band variable at half the zone boundary: a(pi/2) = 2. The only
      checkpoint value needing the surd, since sin(pi/4) = sqrt 2 / 2.
    formalizes: [SYM:bloch_scalars]
    promotes: []

  - name: q_at_checkpoints
    statement: >
      q at the four high-symmetry points is 0, 4, 8, 12 at Gamma, X, M, R.
      The corpus figure plots this spectrum and asserts it; this derives it.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "q at the four high-symmetry points is 0, 4, 8, 12"

  - name: delta_X
    statement: >
      The checkpoint delta at X = (pi, 0, 0) is 4A, derived from the
      cubic-invariant ansatz including the trigonometric step. X carries no
      B, C or D, which is why it fixes A alone.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "checkpoint values at X, M, P, R"
      - "the four extraction formulas invert the ansatz"
      - "X is blind to B, C, D — it fixes A alone"

  - name: delta_M
    statement: >
      The checkpoint delta at M = (pi, pi, 0) is 8A + 16B + 8C, derived from
      the ansatz.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "checkpoint values at X, M, P, R"
      - "the four extraction formulas invert the ansatz"

  - name: delta_P
    statement: >
      The checkpoint delta at P = (pi, pi/2, 0) is 6A + 8B + 16C/3, derived
      from the ansatz.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "checkpoint values at X, M, P, R"
      - "the four extraction formulas invert the ansatz"

  - name: delta_R
    statement: >
      The checkpoint delta at R = (pi, pi, pi) is 12A + 48B + 16C + 16D/3,
      derived from the ansatz. R is the only checkpoint that sees D, because
      it is the only one where e_3 does not vanish.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "checkpoint values at X, M, P, R"
      - "the four extraction formulas invert the ansatz"

  - name: even_gram_minors
    statement: >
      The three principal 2x2 minors of the charge-even Gram matrix are a*p,
      b*p and c*p, and sum to p^2 -- which is why the C-even characteristic
      polynomial depends on the three zone variables only through p and abc.
    formalizes: [G25]
    promotes: []

  - name: even_cubic_at_zero
    statement: >
      The C-even cubic at mu = 0 is -4abc, so lambda = -4 is a root exactly
      where some a_j vanishes: the three zone-boundary planes k_j = pi.
    formalizes: [G25, "CONST:BAND_EVEN_TOP", "CONST:M3_EVEN_BANDTOP"]
    promotes: []

  - name: even_cubic_at_sixteen
    statement: >
      The C-even cubic at mu = 16 is 16(16-p)^2 - 4abc, the form that carries
      the upper band edge: p <= 12 and abc <= 64 make it nonnegative.
    formalizes: [G25, "CONST:BAND_EVEN_BOTTOM", "CONST:M3_EVEN_K0"]
    promotes: []

  - name: even_cubic_derivative_factors
    statement: >
      The C-even cubic's derivative factors as (3mu - p)(mu - p), so the cubic
      increases above mu = p and no root exceeds 16, i.e. lambda <= 12.
    formalizes: [G25]
    promotes: []
