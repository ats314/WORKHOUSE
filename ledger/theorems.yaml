  - name: anisotropy_centered_moment_identity
    statement: |
      On x+y+z=1, the weighted centered second moment with weights x,y,z and mean x^2+y^2+z^2 equals the pair-sum anisotropy variance. The full Laurent-kernel identification is a separate exact check.
    formalizes:
