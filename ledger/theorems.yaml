    promotes: []
  - name: wilson_square_finite_radial_synthesis_bound
    statement: |
      For any finite index set, real levels at least one and nonnegative weights, sum(K_level*weight) is at most K*sum(weight). This proves finite spectral-weight assembly; Gaussian decomposition and closure in the infinite form domain remain analytic steps.
    formalizes:
      - RESULT:W6_SQUARE_SHARP_INVERSE_ENERGY
    promotes: []
  - name: wilson_grid_block_energy_identity
    statement: |
      The four-edge cycle energy (a-b)^2+(a-c)^2+(b-d)^2+(c-d)^2 equals twice the squared norm off the constant direction plus (a-b-c+d)^2/2, for arbitrary real a,b,c,d.
