  - name: wilson_square_radial_ratio_difference
    statement: |
      For every real n>=1, defining K_n=gamma^2/[4*(4+sqrt(2)*(2n-1))], K-K_n equals gamma^2*sqrt(2)*(n-1)/ [2*(4+sqrt(2))*(4+sqrt(2)*(2n-1))].
    formalizes:
