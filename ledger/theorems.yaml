        ker D and ker U are disjoint.
  - name: hodge_vector_decomposition
    statement: >-
      For linear endomorphisms D,U of a module over a field K with D+U=qI, D composed with U=0 and
      q nonzero, every v equals q inverse times Uv plus q inverse times Dv; these summands belong
      to ker D and ker U respectively.
    formalizes: []
    promotes: []
    proof_sources:
