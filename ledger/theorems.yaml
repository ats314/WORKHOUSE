      For q>0 the loss of 5q/4-1/(8q^2)-3q^4/8 from 3/4 is exactly (q-1)^2(3q^4+6q^3+9q^2+2q+1)/(8q^2). Here q=omega/omega_star; this optimizes the normalized trial bound, not the true quartic gap.
    formalizes:
      - G23
      - STUDY:YM:weighted-curvature
    promotes:
      - quartic Gaussian certificate is optimized at frequency cubed 6 lambda hbar over mass squared
  - name: quartic_gaussian_frequency_optimal
    statement: |
      For every positive normalized Gaussian frequency q, the residual-floor bound 5q/4-1/(8q^2)-3q^4/8 is at most 3/4, globally.
    formalizes:
      - G23
      - STUDY:YM:weighted-curvature
    promotes:
      - quartic Gaussian certificate is optimized at frequency cubed 6 lambda hbar over mass squared
  - name: quartic_gaussian_frequency_optimal_iff
    statement: |
      Among positive q, the Gaussian residual-floor bound equals its global maximum 3/4 if and only if q=1. Thus the optimized trial frequency is unique.
    formalizes:
      - G23
      - STUDY:YM:weighted-curvature
    promotes:
      - quartic Gaussian certificate is optimized at frequency cubed 6 lambda hbar over mass squared
  - name: wilson_spatial_weighted_step
    statement: |
      For a>=0, alpha>0 and f>0, a reciprocal-gap inequality rnext<=r/alpha+1/f implies a*alpha*rnext<=a*r+a*alpha/f. This is a scalar interface; no Wilson fast floor is assumed as an axiom.
    formalizes:
      - G19
      - CITE:WILSON_SPATIAL
    promotes: []
  - name: wilson_spatial_budget_telescope
    statement: |
      Every real sequence satisfying a(j+1)r(j+1)<=a(j)r(j)+b(j) satisfies a(n)r(n)<=a(0)r(0)+sum(j<n)b(j), for every natural n. The analytic form and physical scale-matching premises are separate.
    formalizes:
      - G19
      - CITE:WILSON_SPATIAL
    promotes: []
  - name: groundStateDirichlet_const
    statement: |
      The finite groundStateDirichlet form vanishes on every constant test function. This is a finite algebraic identity, without a gap assertion.
    formalizes:
      - G23
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: ground_state_frustration_elimination
    statement: |
      For any eigenvector psi of a finite symmetric real matrix H at energy E, finiteMatrixForm H psi minus E times its squared norm equals zero. No uncoupled baseline occurs in the statement, so it does not set the distinct scalar E0-sum e_* to zero or discharge WR26 assembly.
    formalizes:
      - G23
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: geom_sum_mul_sub
    statement: |
      For every real rho and natural n, (1-rho) times the finite sum of rho^j for j<n equals 1-rho^n. No operator decay premise is proved.
    formalizes:
      - G19
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: combes_thomas_geometric_bound
    statement: |
      For 0<=rho<1 the finite sum of rho^j for j<n is at most 1/(1-rho), independently of n. This is geometric summation, not a resolvent theorem.
    formalizes:
      - G19
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: combes_thomas_pairing_volume_independent
    statement: |
      Assuming |R(j)|<=C rho^j on j<n, with C>=0 and 0<=rho<1, sum(j<n)|R(j)|<=C/(1-rho). The parameter g is unused. This scalar conditional absolute-sum lemma does not construct a Wilson resolvent, prove its exponential envelope, or identify the W6 bilinear pairing.
    formalizes:
      - G19
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: kotecky_preiss_cluster_sum_bound
    statement: |
      For 0<=rho<1, sum(j<n)rho^(j+1)<=rho/(1-rho). This is a finite geometric bound; no Wilson polymer representation is constructed.
    formalizes:
      - G17
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: kotecky_preiss_polymer_activity_bound
    statement: |
      Substituting rho=D*w into the geometric bound is valid when D,w>=0 and D*w<1. Actual cluster counting and weights, and the additional strict Kotecky-Preiss budget, remain separate hypotheses.
    formalizes:
      - G17
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: polymer_free_energy_cauchy_bound
    statement: |
      If |f1-f_inf|<=e1 and |f2-f_inf|<=e2, then |f1-f2|<=e1+e2. The common limiting value and error bounds are assumed, not constructed.
    formalizes:
      - G17
      - CITE:YM_GPU_AUDIT
    promotes: []
  - name: anisotropy_variance_identity
    statement: |
      For real x+y+z=1, x^3+y^3+z^3-(x^2+y^2+z^2)^2 equals sum(i<j) xi*xj*(xi-xj)^2. No positivity assumption is needed.
    formalizes:
