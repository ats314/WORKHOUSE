      - "the four extraction formulas invert the ansatz"

  - name: delta_R
    statement: >
      The checkpoint delta at R = (pi, pi, pi) is 12A + 48B + 16C + 16D/3,
      derived from the ansatz. R is the only checkpoint that sees D, because
      it is the only one where e_3 does not vanish.
    formalizes: [SYM:bloch_scalars]
    promotes:
