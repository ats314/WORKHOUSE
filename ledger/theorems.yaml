    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:below-5-c-f-2-the-trivial-flux-electric--4078fd", "CHK:the-electric-shell-and-what-isolates-it:the-torus-graph-is-simple-and-the-only-s-3ab142"]
    promotes: []

  - name: su3_numerators_below_eighteen
    statement: >
      The nonzero SU(3) one-link numerators p^2 + q^2 + pq + 3p + 3q below 18 are
      exactly 4, 9, 10, 16, by enumeration.
    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:the-su-3-additive-electric-spectrum-leav-74795a"]
    promotes: []

  - name: su3_numerator_large
    statement: "Any SU(3) label with p >= 5 has one-link numerator above 18."
    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:the-su-3-additive-electric-spectrum-leav-74795a"]
    promotes: []

  - name: su3_semigroup_gap
    statement: >
      The additive semigroup of {4, 9, 10, 16} does not reach 15 with at most four
      links, and reaches 14 and 17: the shell 16 is flanked by 14 and 17.
    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:the-su-3-additive-electric-spectrum-leav-74795a"]
    promotes: []

  - name: riesz_separations
    statement: "The Riesz-island separations (1 - 15 lambda)/3 and (1 - 33 lambda)/6."
    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:the-su-3-additive-electric-spectrum-leav-74795a"]
    promotes: []

  - name: riesz_contour_clearances
    statement: >
      The contour |z - 8/3| = (1 - lambda)/12 clears the shell, the upper neighbour
      and the lower neighbour by (1-33 lambda)/12, (1-33 lambda)/12 and (3-27 lambda)/12.
    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:the-su-3-additive-electric-spectrum-leav-74795a"]
    promotes: []

  - name: riesz_min_clearance
    statement: "For lambda >= 0 the lower clearance dominates, so the minimum is (1 - 33 lambda)/12."
    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:the-su-3-additive-electric-spectrum-leav-74795a"]
    promotes: []

  - name: kinematic_constants
    statement: "The local interaction bound 27|u| and the rescaled SU(3) local gap (3/4) C_F = 1."
    formalizes: ["CHK:the-electric-shell-and-what-isolates-it:the-su-3-additive-electric-spectrum-leav-74795a"]
    promotes: []

  - name: bloch_factorisation
    statement: "The incidence factorisation B B^dagger = q I - w w^dagger over C, entry by entry."
    formalizes: [U1]
    promotes:
      - "B B^dagger = q I - d conj(d)^T for the curl incidence"

  - name: carrier_in_kernel
    statement: "B^dagger w = 0: the Bloch form of d_2 d_3 = 0."
    formalizes: [U1]
    promotes: []

  - name: carrier_norm
    statement: "The carrier's squared norm is q."
    formalizes: [U1]
    promotes: []

  - name: evenCubicR_factor
    statement: "The charge-even cubic over the reals is mu (mu - p)^2 - 4abc."
    formalizes: [G25]
    promotes: []

  - name: even_cubic_neg_below_zero
    statement: "Below mu = 0 the charge-even cubic is strictly negative, so lambda >= -4."
    formalizes: [G25]
    promotes: []

  - name: even_cubic_pos_above_sixteen
    statement: >
      Above mu = 16 the charge-even cubic is strictly positive when each a_i is in
      [0, 4], so lambda <= 12: every root lies in [0, 16].
    formalizes: [G25]
    promotes: []

  - name: two_cube_spectra
    statement: >
      The B = 6 two-cube levels -129/34, -34/9, -15/4 and the B = 4 levels -5/3, -11/6
      from the connected diagonal and the cross-cell pairs.
    formalizes: [R2]
    promotes: []

  - name: cutoff_split
    statement: "w_Lam - w_1 = -1/12, w_Sym - w_Adj = 14/153, and the two sum to t_3."
    formalizes: [R2, CONST:t_N]
    promotes: []

  - name: one_cube_shell
    statement: >
      The B = 6 cube scalar misses the bridge's by the same-face sextet route 1/4, and
      its shell is {39/68, 371/612, 127/204}.
    formalizes: [R2]
    promotes: []

  - name: nu_from_A_and_u
    statement: "The agreed normal amplitude is -(5/48 + 4u): the cube completion plus the two-hop shadow."
    formalizes: [CONST:NU_ORBIT, CONST:X_QUANTUM, CONST:A_shp_3, G14]
    promotes:
      - "A = 5/48 forces the normal amplitude: nu = -(5/48 + 4u)"

  - name: C_shp_from_orbits_historical
    statement: "C_shp^historical = -5/96 - u - (rho + pi)/2 on the historical orbit amplitudes."
    formalizes: [C2, CONST:C_SHP_HISTORICAL, CONST:X_QUANTUM, CONST:RHO_ORBIT, CONST:PI_ORBIT]
    promotes: []

  - name: C_shp_from_orbits_cluster
    statement: "The cluster-assembled third side of C2 is the same formula on the cluster rho."
    formalizes: [C2, CONST:C_SHP_CLUSTER, CONST:RHO_CLUSTER]
    promotes: []

  - name: tier_collapse_orbits
    statement: "In orbit amplitudes D = -6u + 3(2u) and B = (1 + 1 - 2) x vanish identically."
    formalizes: [G14]
    promotes: []

  - name: eps_sector_refutes_U5
    statement: "The measured epsilon sector of rho + pi~, 2(-55/13872) = -55/6936, is not U5's -25/512."
    formalizes: [U5, CONST:EPS_SECTOR_SHARED_LINK_AMPLITUDE]
    promotes: []
