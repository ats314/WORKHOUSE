  - name: delta_X
    statement: >
      The checkpoint delta at X = (pi, 0, 0) is 4A, derived from the
      cubic-invariant ansatz including the trigonometric step. X carries no
      B, C or D, which is why it fixes A alone.
    formalizes: [SYM:bloch_scalars]
    promotes:
      - "checkpoint values at X, M, P, R"
      - "the four extraction formulas invert the ansatz"
      - "X is blind to B, C, D — it fixes A alone"

  - name: delta_M
