    formalizes: [CONST:t_N, R2]
    promotes:
      - "the four channel weights follow from dimension and Casimir"

  - name: resolventWeight_adjoint
    statement: >
      The adjoint channel in closed form:
      w_Adj = -((N^2-1)/N^2)/(C_F + N/2) = -2(N^2-1)/(N(2N^2-1)).
    formalizes: [CONST:t_N, R2]
    promotes:
      - "the four channel weights follow from dimension and Casimir"

  - name: resolventWeight_antisym
