# Originating corpus documents, curated by hand and pinned by digest.
#
# This file exists because the graph stopped at the repository's edge: a claim
# could point at checks, constants, theorems, and ADRs, but not at the corpus
# document its value actually comes from. With 928 heavily copied files, that
# distinction is the load-bearing one — **repetition is not independence**, and
# an `originates` edge asserts the judgement that THIS document is a distinct
# originating statement or computation, not one of the forty carriers of a
# pasted number. A carrier does not belong here.
#
# Every entry is verified mechanically (tests/test_provenance.py):
#   - `path` exists and `sha256` equals the corpus pin in
#     corpus-import/SHA256SUMS, so a corpus change breaks this file loudly;
#   - every `quote` is a fixed string found in the file, within a window of
#     `near_line`, the same observed-not-invented discipline as
#     symbols.yaml's corpus_spellings;
#   - every `target` resolves in the claim catalogue.
#
# The graph (graph.py) emits one curated `originates` edge per (document,
# target) pair; `workhouse why <id>` then shows which corpus document a claim
# rests on, and `workhouse search` reaches the document records.
#
# These entries are still T3: an originating *statement* is not a derivation.
# What is machine-checked is the provenance — that the document says this,
# here, in a pinned file — never the truth of what it says.
schema: provenance/v1

