  - id: RESULT:FESHBACH_RESOLVENT_COMPARISON
    statement: |
      Let A_0 and A_g be symmetric invertible forms on a Feshbach complement, R_0 = A_0^-1, R_g = A_g^-1, and w a source. Then (A_g - A_0)[R_0 w, R_g w] = <(R_0 - R_g) w, w> identically. If moreover both forms are positive and |V[u,u]| <= kappa A_0[u,u] for V = (A_g - A_0)/g with |g| kappa < 1, then |<(R_0 - R_g) w, w>| <= |g| kappa/(1 - |g| kappa)^2 <R_0 w, w>. Both the mixed pairing and the constant are therefore free of any quantity evaluated on the interacting problem.
    status: proven
    evidence: analytic
    hypotheses:
      - A_0 symmetric and both forms invertible on the complement; nothing else is used for the identity.
      - For the constant only - A_0, A_g positive on the complement, a relative (KLMN-type) form bound
        |V[u,u]| <= kappa A_0[u,u], and |g| kappa < 1.
    scope: 'The displayed identity and conditional bound have the analytic algebra/variational derivation
      in the pinned source. The native checks are four finite deterministic matrix fixtures, not machine
      certification of arbitrary forms or of a general infinite-dimensional resolvent theorem. The identity
      and oriented sandwich are T1; the relative-constant, sufficient-margin and volume-caricature controls
      are T2. For an operator or closed-form use, the inverse images and mixed pairings must exist on
      the stated domains; no such domain, uniform interacting Wilson kappa, infinite-volume or continuum
      input is supplied here. A uniform local decomposition gives volume-independent kappa only if its
      termwise domination and compatible positive reference decomposition have actually been proved. Locality
      or small-field Taylor expansion alone is not that proof. The one-dimensional numerical kinetic example
      illustrates the distinction from an absolute inverse bound without proving it for gauge theory.
      Failure of |g|kappa<1 voids this sufficient bound, not necessarily positivity: A0=V=I, g=2 gives
      Ag=3I>0. Trace-class and spectral-shift routes require their own hypotheses and remain unestablished.
      G17, G22, G23 and continuum G19 remain open.'
    source: CITE:FESHBACH_RESOLVENT_COMPARISON
    source_section: The mixed form is removable; The constant, when a relative form bound exists
    depends_on: []
    bears_on:
      - G17
      - G22
      - G23
    supported_by:
      - target: CHK:the-feshbach-resolvent-comparison:the-interacting-inverse-image-cancels--a-ab8923
        scope: 'T1: exact identity on four deterministic finite matrix pairs at n=3..6. These fixtures
          do not certify the arbitrary-form analytic theorem or its operator domains.'
      - target: CHK:the-feshbach-resolvent-comparison:the-variational-sandwich-puts-the-free-o-87725b
        scope: 'T1: the oriented sandwich g V[u_g,u_g] <= difference <= g V[u_0,u_0] on the same finite
          positive cases, with both signs of g. No endpoint sorting.'
      - target: CHK:the-feshbach-resolvent-comparison:a-relative-form-bound-gives-the-explicit-5b58ad
        scope: 'T2: the conditional explicit constant on the same finite cases, with kappa computed by
          floating spectral arithmetic. This is not an exact arbitrary-form check.'
      - target: CHK:the-feshbach-resolvent-comparison:finding-the-reduction-buys-a-relative-fo-13f679
        scope: 'T2: a finite family exhibits deterioration of the sufficient margin and its margin^-2
          budget. A failed margin does not itself imply loss of positivity; the separate A0=V=I, g=2 regression
          keeps this boundary explicit.'
      - target: CHK:the-feshbach-resolvent-comparison:the-relative-bound-is-volume-stable-wher-b1c856
        scope: 'T2: floating eigenvalue/power-iteration observations on a one-dimensional local kinetic
          caricature. No uniform kappa or interaction estimate for SU(N).'
    historical_scope_before_2026_09_09: |
      Exact linear algebra on arbitrary symmetric forms. It removes one obstacle from one estimate shape: an absolute volume-uniform bound on an interacting resolvent is replaced by a volume-uniform relative form bound. It does NOT supply the latter, proves nothing about Yang-Mills or any lattice gauge interaction, establishes no infinite-volume or continuum statement, and does not discharge G17, G22 or G23. What the exchange buys is a change of character, not merely of wording: a relative bound is a max over local terms where an operator bound is a sum, so it does not accumulate with the volume. The registered witness shows kappa flat across a factor of sixteen in system size while the Neumann quantity grows linearly -- T2, floating power iteration on a one-dimensional caricature, so suggestive of the direction and not evidence for it. Two consequences follow and are open rather than claimed: a small-field region admits a volume-uniform kappa by locality alone, so only the rough set resists; and the identity itself needs no positivity, so where the variational route voids at |g| kappa >= 1 the collapsed object is still a RESOLVENT DIFFERENCE, for which trace-class and spectral-shift methods remain available.
  - id: RESULT:TIER_COLLAPSE_ACTUAL_H4_SUPPORT
    statement: The recorded 189-term fourth-order cubic kernel has actual support {I,U,S,S^2,R}, with
