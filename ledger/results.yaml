      divisible D=union_(tau>0)S_tau D; the latter supplies that continuity by the cutoff-uniform smoothing
      bound K10.
    - For a spanning family of D, approximate centered probes converge in norm and obey one growing physical-time
      estimate with liminf -log(b_n)/T_n>=M>0 common to that family.
    - The finite-energy nontriviality conclusion additionally requires one actual positive limiting separated-time
      correlation.
