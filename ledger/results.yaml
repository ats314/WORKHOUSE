  - id: RESULT:MOVING_TIME_SPECTRAL_GAP
    statement: If C_n(t_n)<=b_n at physical times t_n tending to infinity and exp(E t_n)b_n tends to zero
      for every E<M, then every vague limit of target spectral measures with ||f_n-v_n|| tending to zero
      vanishes on [0,M). The finite estimate is sqrt(nu_f_n([0,E]))<=||f_n-v_n||+exp(E t/2)sqrt(C_n(t)).
      With the actual reconstructed spectral identification and a total centered family this yields H on
      the vacuum complement >=M. Shrinking exponential probes use K_n/alpha_n^2, with no time-amplified
      Taylor error.
    hypotheses:
    - H_n are nonnegative self-adjoint operators in the physical clock; target f_n and approximate probe
      v_n belong to the same cutoff Hilbert space and ||f_n-v_n|| tends to zero.
    - The target positive spectral measures converge vaguely to the stated limiting measures on [0,infinity).
    - For the full-space conclusion, the limiting measures are actual spectral measures of one reconstructed
      H and the intended centered source family has dense span in the vacuum complement; one positive rate
      is common to the family.
    - For exponential probes, real bounded observables have an L2 spectral identification and |alpha_n|B_n^2
      exp(|alpha_n|B_n) tends to zero; alpha_n is nonzero.
    scope: Analytic support and totality theorem across varying cutoff spaces. One observation time per
      cutoff suffices; no quantitative moving-time convergence or rate for probe norm approximation is consumed.
      Does not establish Wilson estimates, a nontrivial continuum object, cutoff gaps, or uniqueness of
      the limiting object.
    source: CITE:MOVING_TIME_GAP_RESULTS
