      history cores) construct the quotient physical semigroup H>=0. Norm-approximate sources and one growing-time
      rate M yield C_f(t)<=||f_c||^2 exp(-Mt) at every limiting fixed time; the complete centered defining
      space gives H on Omega-perp>=M. If one separated-time C>0 and V=||f_c||^2, spectral weight in [M,tau^-1
      log(2V/C)] is at least C/(2-C/V)>=C/2.
