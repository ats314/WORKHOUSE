  - id: RESULT:WILSON_ACTUAL_BLOCK_FAST_COMPLEMENT
    statement: For the actual physical adjacent-two-square SU(N) Wilson Hamiltonian, let P_u be its
      global exact conditional fiber-ground projection and Q_u=I-P_u. The bottom of the closed restricted
      form Q_u(H-E_vac)Q_u is (sqrt(3)+sqrt(5))sqrt(u)+o_N(sqrt(u)), above the true full-block vacuum.
      At each sufficiently large fixed u the actual cross form yields a bounded Riesz lift U_u and
      a closed nonnegative Schur form with exact triangular domain. The normalized retained operator
      and its entire low-window graph-source frame therefore satisfy the established physical Schur
      theorem.
    status: proven
    evidence: analytic
    hypotheses:
    - One actual adjacent two-square graph with all seven electric links and both magnetic terms retained,
      physical simultaneous conjugation invariance, fixed SU(N), N>=2, and u tending to infinity.
    - The projection is the exact positive ground of the intrinsic full Haar fiber operator at each
      coarse U; compression is defined by restriction of the H1 quadratic form, not an assumed operator-domain
      product.
    - The full physical first-shell theorem supplies the complete rank-two space below the mixed shell.
      The actual ground-bundle derivative and projected-form estimates control the constrained upper
      trial.
    - The Schur realization is at each fixed sufficiently large u; global smoothness and coercivity
      yield finite lift bounds which are not claimed uniform in u or block count.
    scope: An actual nonlinear one-block fast-compression floor after true full-vacuum subtraction,
      not the internal spectral gap of the compressed operator and not an independent class-rotor gap.
      The first complement channel is a mixed physical singlet. The retained projection need not contain
      the full vacuum or reduce H. The induced normalized coarse form exists, but comparison with a
      prescribed bare Wilson theory, uniform interacting-volume lifts and fast bounds, literal/OS sources
      and the continuum trajectory remain open.
    source: CITE:WILSON_ACTUAL_BLOCK_FAST_COMPLEMENT
