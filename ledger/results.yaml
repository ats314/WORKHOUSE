  - id: RESULT:SHARP_CUTOFF_SOURCE_GAP_BUDGET
    statement: For raw bound K_n(t)<=A a_n^-p exp(-m t)+B a_n^r and |alpha_n|>=c_alpha a_n^s, the optimized
      moving-time gap is M_*=m(r-2s)/(p+r) at t_n=((p+r)/m)log(1/a_n), provided r>2s. A horizon c_max uses
      c_opt=min(c_max,(p+r)/m) and M_opt=min(m-(p+2s)/c_opt,(r-2s)/c_opt). Positive guarantees require c_max>(p+2s)/m.
      One-atom measures prove sharpness, including the shortened-horizon case.
    hypotheses:
    - H_n are nonnegative self-adjoint operators in the physical clock; target f_n and approximate probe
      v_n belong to the same cutoff Hilbert space and ||f_n-v_n|| tends to zero.
