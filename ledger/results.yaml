      is injective on ker d0*.
    - A compact connected group with simple Lie algebra, a fixed bi-invariant metric, and a faithful
      finite-dimensional unitary representation with trace constant b_rho.
    - All vertex Gauss constraints are imposed, u tends to infinity, and the group, complex, weights
      and representation remain fixed.
