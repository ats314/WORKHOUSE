  - id: RESULT:SOURCE_CURRENT_VARIATIONAL_ENERGY
    statement: For real Hilbert spaces E and L, a bounded linear map Y from E to L, a vector j in L, real
      g, and positive kappa, any energy function satisfying a(v) >= kappa times the squared norm of Yv obeys
      2g times the inner product of j and Yv minus a(v) <= g squared times the squared norm of j divided
      by kappa. The map Y may have a kernel and no inverse operator is required.
    hypotheses:
    - E and L are real Hilbert spaces and Y:E->L is bounded linear.
    - j belongs to L, g is real, kappa is strictly positive, and a(v) >= kappa ||Yv||^2 for every tested
      v.
    - The residual is the specified functional rho(v)=g<j,Yv>; its vanishing on ker(Y) follows from this
      factorization.
    - For an unbounded form-domain application, all pairings and the lower energy inequality must be justified
      on the common tested domain.
    scope: The abstract bounded-map variational inequality is fully encoded by factored_variational_energy_without_inverse.
      Its application to actual unbounded Wilson form-domain derivative maps and an actual model residual
      requires the separately supplied current factorization, domains, and lower energy. This statement
      does not require or construct an inverse and does not close W6.
