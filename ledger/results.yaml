  - id: RESULT:COMMON_SPACE_CONTRACTIVE_DRIFT
    statement: Let x_(k+1)=F_k(x_k) in one closed Banach-space domain, with common contraction factor 0<=theta<1
      and summable successive map drift d_k. Then Delta_k=||x_k-x_(k-1)|| satisfies Delta_(k+1)<=theta Delta_k+d_k
      and sum_(k>=1) Delta_k<=(Delta_1+sum_(k>=1)d_k)/(1-theta); hence x_k converges. If the actual normalized
      observable maps Phi_k have a common Lipschitz constant and summable successive drift e_k, then Phi_k(x_k)
      has absolutely summable increments and converges. A sufficient map-drift mechanism is uniform Lipschitz
      dependence on a bounded-variation coupling t_k, with summable errors in F_k-F(t_k,.); an actual monotone
      inverse-coupling recurrence yields the stated O(t_k^2) difference bound.
    hypotheses:
    - D is a closed subset of a Banach space, x_0 belongs to D, and every F_k maps D into D with the same
      Lipschitz factor theta<1.
    - For k>=1, sup_D ||F_k-F_(k-1)||<=d_k with d_k>=0 and sum d_k finite. Native scale coordinates, reference
      actions, vacuum subtractions, source norms and clocks are transported into this one specified domain
      before the bound is invoked.
    - The represented expectation is exactly m_k(O)=Phi_k(x_k). The maps Phi_k:D->C have uniform Lipschitz
      constant L_O and sup_D |Phi_k-Phi_(k-1)|<=e_k with sum e_k finite.
    - For the sufficient parameter mechanism, F(t,.) is uniformly Lipschitz in t and sup_D ||F_k-F(t_k,.)||<=r_k
      with sum r_k finite; the sequence t_k has finite total variation. The optional recurrence 1/t_(k+1)-1/t_k=b+eta_k,
      b>0, |eta_k|<=b/2 and t_k>0 implies 0<=t_k-t_(k+1)<=(3b/2)t_k^2.
    scope: Abstract analytic convergence criterion and its explicit coupling-drift mechanism, extracted
      from the supplied September 9 repair proof. A size estimate ||K_(k+1)||<=theta||K_k||+C/k alone does
      not establish map or observable drift. No actual interacting Wilson common-space RG map, cross-cutoff
      law, continuum field, or source/clock comparison is constructed by this result.
    source_section: Sections 2-3, equations R1-R9; Section 4 states the actual Wilson application boundary.
    depends_on: []
