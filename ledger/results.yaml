  - id: RESULT:REVERSE_MARTINGALE_BLOCKING
    statement: For one specified probability law mu, a decreasing sequence of completed sigma-algebras G_n,
      and Z in L2(mu), the blocked observables M_n=E[Z|G_n] converge in L2 to E[Z|intersection_n G_n]. Their
      squared increments telescope, with sum_n E|M_n-M_(n+1)|^2<=||Z||_2^2 and ||M_n-M_N||_2^2=||M_n||_2^2-||M_N||_2^2
      for N>n.
    hypotheses:
    - There is one already specified probability space (Omega,mu), with completed sigma-algebras G_0 containing
      G_1 containing subsequent G_n.
    - Z belongs to L2(mu), and each blocked observable is the actual conditional expectation E[Z|G_n] under
      that same law.
    scope: Exact nested coarsening of one established law supplies a reverse martingale. This does not compare
      independently specified microscopic cutoff measures or construct a continuum refinement law. Applied
      to an established fixed-spacing SC17 history law, it concerns coarsening that law.
    source_section: Section 4, equations B7-B8.
    depends_on: []
    bears_on:
    - G19
    - G23
    supported_by: []
    status: proven
    evidence: analytic
    source: CITE:G19_PROJECTIVE_MARTINGALE_REPAIR
  - id: RESULT:PREDICTABLE_SOURCE_DRIFT
    statement: On one filtered probability space, let M_n be adapted L2 observables, r_n=E[M_(n+1)-M_n|F_n],
      and xi_(n+1)=M_(n+1)-M_n-r_n. If sum ||r_n||_2 and sum E|xi_(n+1)|^2 are finite, then M_n converges
      in L2 and its expectations converge. The tail satisfies ||M_N-M_n||_2<=sum_(j=n)^(N-1)||r_j||_2+(sum_(j=n)^(N-1)E
      Var(M_(j+1)|F_j))^(1/2). An actual conditional Poincare inequality bounds each variance by its conditional
      fast Dirichlet energy divided by the conditional gap.
    hypotheses:
    - M_n is adapted to an increasing filtration F_n on one specified common probability space and M_n belongs
      to L2 for every n.
    - The predictable increments r_n have summable L2 norms, and the centered martingale differences xi_(n+1)
      have summable second moments.
    - For the conditional-gap sufficient estimate, an actual refinement kernel R_n, its actual conditional
      fast Dirichlet form E_(fast,n,x), and a positive conditional gap gamma_n satisfy Var_(R_n(x,.))(f)<=gamma_n^-1
      E_(fast,n,x)(f,f); integrating the resulting energy bound must give a summable variance budget.
    - When applied to cutoff observables, M_n=O_n(x_n) and r_n=R_n O_(n+1)(x_n)-O_n(x_n) use the actual
      normalized sources and actual common cross-cutoff law.
    scope: Analytic criterion separates predictable source drift from centered conditional fluctuations.
      Square summability of centered variances does not remove a generic O(g_n^2) predictable drift. Actual
      Wilson cross-cutoff coupling, source matching and uniform conditional energy budgets are application
      hypotheses rather than conclusions.
    source_section: Section 5, equations B9-B14; Section 6 gives the exact remaining application.
    depends_on: []
    bears_on:
    - G19
    - G23
    supported_by: []
    status: proven
    evidence: analytic
    source: CITE:G19_PROJECTIVE_MARTINGALE_REPAIR
