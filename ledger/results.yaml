  - id: RESULT:WILSON_TWO_STRIP_PHYSICAL_SPLITTING
    statement: >
      On the actual two-identical-strip graph with four faces, fourteen
      edges and eleven vertices, the first physical excitation at large u
      is an exactly degenerate radial doublet. Its gap is
      2sqrt(3)sqrt(u)+delta_R+O_N(u^-1/4), where
      delta_R=sqrt(15)(5-2N^2)/(80N)-3(2N^2-3)/(32N).
      The next mixed singlet has delta_M=delta_R+(54N^2-15)/(160N)
      in place of delta_R, with the same error order.
    status: proven
    evidence: analytic
    hypotheses:
      - Fixed SU(N), N>=2, and the specified finite cubic graph of two identical adjacent-square strips sharing only a base vertex.
      - The Hamiltonian is the sum of the two actual shared-edge strip Hamiltonians, restricted to their common diagonal gauge-invariant space.
