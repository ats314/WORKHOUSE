  - id: RESULT:FORM_SCHUR_SCALE_COMPARISON
    statement: 'A nonnegative closed Hamiltonian form with exact factorization h[p,q]=k0[p]+norm(F^(1/2)(q+Up))^2,
      F>=f I and bounded U, has normalized static Schur operator L=M^-1/2 K0 M^-1/2 with M=I+U*U.
      Its variational energies obey f mu_j/(f+mu_j)<=lambda_j<=mu_j. With finite vacuum and full
      coarse gap mu, the complete fine gap is at least (mu^-1+f^-1)^-1. The graph isometry projects
      onto the entire spectral window [0,E], E<f, with frame lower bound 1-(E/f)^2. Repeated actual
      coarse comparisons preserve a positive gap when the inverse fast energies are summable in
      common physical units.

      '
    status: proven
    evidence: analytic
    hypotheses:
    - A nonnegative self-adjoint Hamiltonian and the exact closed-form factorization on D(h)={(p,q):p
      in D(k0),q+Up in D(F^(1/2))}, with k0 closed, F>=f>0 and U bounded into Q.
    - For finite retained P contained in the Hamiltonian form domain, the factorization and U
      are derived from the actual restricted cross form; no operator-domain assumption on P is
      made.
    - The infinite-retained full-gap conclusion requires a finite-dimensional vacuum and a genuine
      full gap of L; discreteness of higher levels requires its own finite spectral-rank premise.
    - Iteration requires actual coarse gap(L_j)>=Delta_j, a common physical clock, and a finite
      sum of f_j^-1; errors or changing energy prefactors must be included in that comparison.
    scope: 'Generic exact closed-form theorem, including unbounded Hamiltonians and an infinite
      retained space. These inequalities concern actual Hamiltonian energies, without square roots.
      They permit large cross coupling but retain its full induced metric. The graph isometry
      need not reduce H or equal an OS-history range. Its whole-window frame is not yet a literal
      Wilson source frame. Uniform nonlinear Wilson fast bounds, bounded dressing, the actual
      coarse identification, source comparison and continuum limits remain unproved applications.

      '
