  - id: RESULT:HODGE_FESHBACH_SPLITTING
    statement: 'On each cubic charge-odd plaquette Bloch fibre with q>0, the Feshbach complement of the
      cube-boundary carrier is the other Hodge summand. The exact identities are L_down+L_up=q I, L_down
      L_up=0, L_up=psi psi^dagger and psi^dagger psi=q, so Q=I-psi psi^dagger/q is the orthogonal projector
      onto ker L_up. Both Laplacians act scalarly on the carrier: L_down psi=0 and L_up psi=q psi. The
      Hodge algebra therefore generates no off-carrier coupling, and the excitation phi=Q R psi satisfies
      L_up phi=0. The denominator-cleared identities hold on the whole zone.'
    status: proven
    evidence: analytic
    hypotheses:
      - The cubic three-dimensional plaquette complex with its signed incidence d_1, d_2, d_3 and the
        cube-boundary carrier psi = (dbar_3, -dbar_2, dbar_1).
      - Three-dimensional Bloch fibre and the recorded cubic incidence operators. The normalized projector
        and one-dimensional carrier decomposition require q>0; at Gamma q=0 and psi=0, only the denominator-cleared
        Laurent identities are asserted.
    scope: |-
      A statement about the incidence algebra of one lattice, not about any dynamics or any coupling. It fixes which operators can leave the retained sector; it says nothing about their amplitudes and does not adjudicate C2.
       The 2026-09-09 integration review corrects the former whole-zone projector wording. At Gamma these identities do not define a normalized carrier projector. The source is preserved verbatim; the review is docs/research/september_feshbach_integration.md.
    source: CITE:HODGE_FESHBACH_CHANNEL
    source_section: The splitting; The word calculus
    depends_on: []
