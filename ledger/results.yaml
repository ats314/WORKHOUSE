  - id: RESULT:ODD_ORDER_CENTRE_PARITY
    statement: For even N every odd-order matrix element of the des Cloizeaux effective operator of the
      strong-coupling band vanishes identically, on every cluster and in both C-parity sectors, at every
      order. For odd N an odd order m vanishes unless m >= N - 2, and at m = N - 2 the only surviving
      element is the one-plaquette vertex H_(N-2)(F-bar, F) = -(N/(N+1))^(N-3)/((N-3)!)^2, which is -1 at
      N = 3 and -25/144 at N = 5; hops and leakages vanish at that order.
    hypotheses:
    - Kogut-Susskind strong-coupling Hamiltonian on Z^3 with H0 = (1/2) sum E^2 and V = -u W, W the sum of
      plaquette characters in both orientations, u = beta_N/(2N); degenerate perturbation theory on the
      one-plaquette sector at fixed order on finite clusters.
    - The SU(N) Haar integral of a word vanishes unless every link's net flux is 0 mod N; on one plaquette
      the four links are private, so the states are characters with energy 2 C_2(R).
    scope: Statements about the coefficients of the strong-coupling series at fixed order, not about
      convergence; on a periodic lattice the link-set lemma needs even extents. The even orders and the
