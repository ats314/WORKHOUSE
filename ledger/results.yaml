    statement: Suppose the actual normalized connected two-observable covariance has an absolutely convergent
      marked expansion, and its entropy-inclusive weighted sum obeys sum_(X meets both supports) exp(m diam_phys(X))
      |K_k(X;O1,O2)|<=C(O1,O2) uniformly in cutoff k, for m>0. If the physical support separation is R,
      then |Cov_k(O1,O2)|<=C(O1,O2) exp(-mR) uniformly in k.
    hypotheses:
    - The covariance of the specified normalized observables equals the stated connected marked expansion
      at every cutoff.
    - The common physical distance, source normalization, and positive number m are fixed across cutoffs;
      every term meeting both supports has physical diameter at least their separation R.
    - The entropy-inclusive weighted absolute sum is bounded by C(O1,O2) independently of cutoff, including
      marked-source insertion and all support/root normalization factors.
    scope: Sufficient analytic exponential-clustering implication from an actual uniformly weighted two-marked
      norm. The unmarked polymer norm or a chosen decay-weight schedule does not establish its premise.
      Physical-time correlation convergence and reconstruction hypotheses remain separate before deriving
      any spectral lower bound; the result does not identify an exact physical mass or construct the actual
      Wilson marked estimate.
