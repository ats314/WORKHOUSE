    - G19
    - G23
    supported_by: []
    status: proven
    evidence: analytic
    source: CITE:G19_CAUCHY_DRIFT_REPAIR
  - id: RESULT:PROJECTIVE_SOURCE_MARTINGALE
    statement: For a countable projectively consistent family of actual probability laws on standard Borel
      spaces with specified refinement-to-coarse maps, there is a common sequence law supported on the blocking
      identities. If the actual normalized observables satisfy conditional source compatibility and a uniform
      L2 bound, M_n=O_n(x_n) is an L2-bounded martingale and converges in L2. For N>n, E|M_N-M_n|^2=E|M_N|^2-E|M_n|^2,
      and its expectations agree at all cutoffs.
    hypotheses:
    - Each X_n is standard Borel; pi_n:X_(n+1)->X_n is measurable; mu_n is a specified probability law satisfying
      (pi_n)_#mu_(n+1)=mu_n for every n. Multi-step blocking maps are the indicated compositions.
    - R_n is the regular conditional law of mu_(n+1) given pi_n, and the actual normalized observable O_n
      satisfies O_n(x_n)=integral O_(n+1)(x_(n+1)) R_n(x_n,dx_(n+1)) almost surely.
    - The observables obey sup_n integral |O_n|^2 dmu_n<infinity. The filtration is the completion of sigma(x_n)
      under the constructed common law.
    scope: The inverse-limit probability law and L2 source convergence follow from the stated actual cutoff
      identities. Exact integration separately inside each finite cutoff does not supply projective consistency
      between different cutoff theories. The limit space is not identified with distributional continuum
      gauge fields, and no Euclidean/OS or spectral mass-gap conclusion is asserted.
    source_section: Section 3, equations B4-B6 and the finite-cutoff triangular-family counterexample.
