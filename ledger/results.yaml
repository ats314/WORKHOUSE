      the physical gap is 2 sqrt(2 b_rho) sigma_min sqrt(u)+O(1). Here sigma_min is the least
      singular value of the weighted original-link curl on the transverse quotient. If its multiplicity
      is m, the complete first physical excited cluster has m(m+1)/2 levels. The order-one remainder
      follows from projected odd Taylor cancellation and finite Hermite correctors.

      '
