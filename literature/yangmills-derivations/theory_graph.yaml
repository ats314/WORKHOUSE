- id: STUDY:YM:derive-finite-confinement-energy
  statement: Retained kinetic control and a growing radial tail give compact resolvent for the finite SU(2) matrix model,
    with E0>=3m[g^2(m-1)/32]^(1/3).
  status: proven
  detail: YM_FLAT_DIRECTIONS sections 4-5 give the form-domain tail estimate, local Rellich compactness argument, three-dimensional
    Hardy completion and exact radial minimizer. Lean proves the normalized radial inequality. The resulting number bounds
    unshifted ground energy; a quantitative E1-E0 estimate requires a separate comparison. Coupling dilation scales each
    finite-model energy difference as g^(2/3).
