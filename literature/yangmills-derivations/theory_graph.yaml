- id: STUDY:YM:derive-quartic-certificate
  statement: A Gaussian trial for the pure quartic oscillator yields the residual certificate gap>=3*hbar*Omega/4 at
    Omega^3=6*lambda*hbar/m^2.
  status: proven
  detail: This is a finite-dimensional analytic consequence of GST-6 with the standard quartic Friedrichs operator and
    Gaussian weighted gap. Exact checks derive the residual square, Gaussian moments and frequency optimization. Lean
    proves the global residual floor and the arithmetic and optimization lemmas; the full oscillator spectral theorem
    and min-max application are not formalized.
