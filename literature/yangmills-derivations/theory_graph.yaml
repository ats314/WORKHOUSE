- id: STUDY:YM:derive-residual-mean-gap
  statement: A weighted comparison gap gamma and a trial residual with lower floor r_min and finite mean give gap(H)>=gamma-(meanR-r_min)
    under min-max hypotheses.
  status: conditional
  detail: GST-6 proves E1>=gamma+r_min by min-max and E0<=meanR by the normalized trial vector. The residual need not
    be bounded above. Lean proves the exact scalar gap budget; it does not formalize min-max, the weighted curvature
    floor or the operator domains. The finite transform supplies an independent concrete algebraic realization.
  sources:
