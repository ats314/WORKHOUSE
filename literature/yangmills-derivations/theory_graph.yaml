- id: STUDY:YM:derive-weighted-form-transfer
  statement: A weighted Poincare bound transfers to the centered finite physical matrix form through the constructed
    inverse map f_i=x_i/psi_i.
  status: conditional
  detail: The Lean theorem uses symmetry, a nonzero exact eigenvector, and a Poincare inequality for its actual weighted
    Dirichlet form. It proves the norm, mean-zero and energy transport rather than assuming an isometry. Nonpositive
    off-diagonal entries separately guarantee nonnegative edge conductances. No Poincare floor for the physical Yang-Mills
    operator is asserted.
  sources:
  - paper: MMM_2019_CURVATURE
    locator: PDF pp. 10-12, equations (II.9), (II.13), (II.22)-(II.23)
  links:
  - type: supported_by
    target: LEAN:finite_ground_state_gap_transfer
    detail: Constructs division by psi and proves the centered physical form inequality.
  - type: supported_by
    target: LEAN:finite_ground_state_dirichlet_nonneg
    detail: Checks the finite conductance positivity under explicit off-diagonal signs.
  - type: depends_on
    target: STUDY:YM:derive-ground-state-residual
    detail: The constant-residual case identifies the physical energy above its ground level.
  - type: bears_on
    target: G23
    detail: Gives a finite formal template for the operator and form bridge.
