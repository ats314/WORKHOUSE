- id: STUDY:YM:derive-valley-hessian
  statement: Along a commuting SU(2) valley the classical force vanishes while the transverse quadratic form is a Gram
    projector with growing nonzero normal eigenvalues.
  status: proven
  detail: For A_i=a_i e3, the transverse potential is rho^2 sum|u_i|^2-|sum a_i u_i|^2, rho^2=sum a_i^2. The finite-sum
    Lean identity proves the underlying Lagrange identity for every finite index set. Exact three-matrix checks verify
    the transverse Hessian. DQ, Hess V and grad V are distinct; the commuting valley is outside G22 rough nonaligned
    configurations.
  sources:
  - paper: SIMON_1983_DISCRETE
    locator: printed pp. 216-217, derivative criterion in Theorem 3 and matrix application Corollary 4
  links:
