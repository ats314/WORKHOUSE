- id: STUDY:YM:derive-volume-residual-budget
  statement: For n independent optimized quartic trials the global residual budget is hbar*Omega*(1-n/4), while tensorizing
    the one-site certificates preserves 3*hbar*Omega/4.
  status: proven
  detail: GST-9 checks residual additivity and the exact n-copy budget. The comparison generator gap remains the minimum
    one-site gap, whereas meanR-infR adds over sites. At four copies the global certificate reaches zero even though
    the product Hamiltonian remains gapped. Analytic tensor-product spectral theory, separately stated in the derivation,
    supplies the volume-uniform one-site comparison.
  sources:
  - paper: MMM_2019_CURVATURE
    locator: PDF pp. 12-13, anisotropic oscillator (II.24)-(II.27)
  - paper: JW_2006
    locator: p. 12, section 6.5, volume-uniform gap requirement
  links:
  - type: supported_by
    target: CITE:YM_GROUND_STATE
    detail: GST-9 derives and checks the product-model calibration.
  - type: depends_on
    target: STUDY:YM:derive-quartic-certificate
    detail: The one-site residual floor and mean fix the additive error.
  - type: bears_on
    target: G17
    detail: A local or tensorized error bound must be controlled before adding interactions over growing volumes.
  - type: bears_on
    target: G23
    detail: Prevents a finite residual certificate from being mistaken for uniform global curvature control.
