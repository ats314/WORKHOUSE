      The full analytic scope is stated in the derivation and check detail.'
- id: STUDY:YM:derive-ground-state-residual
  statement: A positive trial state gives an exact weighted ground-state transform with residual R=(H psi)/psi; the residual
    is constant only for an exact eigenstate.
  status: proven
  detail: YM_GROUND_STATE GST-1 and GST-4 reconstruct the differential and finite matrix identities. The all-finite-index-set
    Lean theorem proves the matrix identity with an explicit row equation. A generic symmetric three-by-three matrix
    and arbitrary smooth two-dimensional differential expressions are checked independently. Infinite-dimensional domain
    extension is separate.
