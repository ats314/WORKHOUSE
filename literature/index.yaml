# Published literature, and what each paper actually bears on.
#
# This is an evidence map, not a bibliography. An entry earns its place by
# naming a specific claim in this repository -- a contradiction, a gap, a
# register item, a unifying candidate, or a constant -- and saying what
# relationship the paper has to it. `workhouse lit --for C7` answers "what
# published work bears on this claim?"; validate() rejects an entry whose
# target does not resolve.
#
# A published paper is NOT authority here either. It is T3 until something
# checks it, exactly like a corpus document. The difference is that an
# external result was produced without knowledge of this program, so where it
# agrees, the agreement is evidence rather than bookkeeping.
schema: literature/v1

# relation vocabulary, closed:
#   supplies-value      the paper publishes a number this repository compares against
#   supplies-method     the paper's technique is the one a claim's derivation uses
#   corroborates        independent agreement with a claim here
#   contradicts         independent disagreement with a claim here
#   supplies-comparison a modern result the program's output should be placed against
#   confusable          NOT a source; recorded so it stops being mistaken for one
#
# edge status vocabulary, closed:
#   verified                 the value has been checked against the primary source
#   transcription-unverified a number is quoted from the paper but the primary
#                            table has not been pinned and hashed
#   not-yet-obtained         the paper has not been read
#   refuted                  the comparison was made and it failed

papers:
  - id: KS_1975
    title: Hamiltonian formulation of Wilson's lattice gauge theories
    authors: [J. B. Kogut, L. Susskind]
    venue: Phys. Rev. D 11, 395-408
    year: 1975
    doi: 10.1103/PhysRevD.11.395
    arxiv: null
    licence: publisher-copyright
    fulltext: null
    note: >
      Some secondary sources give the page range as 359-408. The ADS bibcode
      1975PhRvD..11..395K gives 395, and that is what is recorded here.
    bears_on:
      - target: R2
        relation: supplies-method
        status: not-yet-obtained
        detail: >
          The Hamiltonian whose charge-odd one-plaquette flux sector this whole
          program studies. The electric term H_0 = (1/2) sum_e E_e^2 and the
          coupling normalization that fixes u = beta_N/(2N) originate here, so
          the coordinate convention in R2 is ultimately a statement about this
          paper's conventions.

  - id: HAMER_1989
    title: Hamiltonian strong coupling expansions for glueball masses in SU(3)
    authors: [C. J. Hamer]
    venue: Phys. Lett. B 224, 339-342
    year: 1989
    doi: 10.1016/0370-2693(89)91242-2
    arxiv: null
    licence: publisher-copyright
    fulltext: null
    bears_on:
      - target: HAMER_A4_NUM
        relation: supplies-value
        status: transcription-unverified
        detail: >
          a_4 = -0.0968932328773 is transcribed from this paper's table. Through
          the bridge m_n = 2**(n-1) a_n it gives 8 a_4 = -0.7751458630184,
          agreeing with m_Gamma^(4) to about 5.2e-13 -- the strongest external
          validation the program has. The corpus is explicit (v4.3 section 2.2)
          that the primary table has not been pinned and hashed, so the decimal
          is a local transcription and the agreement rests on it.
      - target: C1
        relation: corroborates
        status: transcription-unverified
        detail: >
          The oracle that produced m_Gamma^(4) ran with the historical target
          disabled and recovered m_1, m_2, m_3 first, so agreement with this
          paper is substantive rather than internal bookkeeping. That argument
          is only as good as the transcription above.
    open_questions:
      # Verbatim from the corpus's own audit, FLATBAND_PAPER_EXPANSION_AUDIT
      # 2026-07-25 section 2.5. Obtaining the four-page paper answers all five.
      - Hamiltonian normalization -- electric Casimir and magnetic-term conventions
      - expansion parameter -- conversion between Hamer's variable and y
      - energy definition -- one-particle energy versus vacuum-subtracted mass
      - 1^{+-} coefficients -- equality or disagreement through the shared order
      - momentum resolution -- whether Hamer computed only k=0 masses or a full band

