        detail: |
          G18 identifies a protected carrier with the glueball in the T_1^{+-} channel, and this paper is where that channel's operator content was published. Table 3.1 puts the single spatial plaquette at multiplicity one in T_1^{+-}, beside A_1^{++} and E^{++}, and section 3.2's C-parity rule (real part C = +1, imaginary part C = -1) is the mechanism that separates them. The dimension sums 6, 12, 24, 8 and the nine-excited-state count are reproduced exactly here from the printed multiplicities, so the transcription is checked rather than trusted. What it does NOT supply: any statement about dressing, overlap size, or the transfer-matrix identification -- SCHIERHOLZ_1988 measures the overlap, this paper only says which representation the operator sits in.
      - target: G19
        relation: supplies-comparison
        status: verified
        detail: |
          The earliest instance in this web of exactly the obstruction G19 is about, from the Euclidean side. The 0^{++} scaling window closes at 5.6 < beta < 5.7 while the string-tension scaling window of its refs [35, 23] extends, in the paper's own words, "to a much higher value" of beta, and no excited state -- the 1^{+-} carrier channel included -- shows any scaling window at all on the 4^3 x 8 lattice. The paper's own conclusion is that the scaling region for excited states "may then be totally out of present computer and SC possibilities". That is not the last word and must not be read as one: MP_1999, CHEN_2006 and AT_2020_SU3 did reach a continuum-extrapolated SU(3) 1^{+-} in the decades after, on anisotropic lattices with far larger variational bases. What this entry supplies is the other end of the baseline, and FLPS_2026 shows the difficulty is not merely historical -- its 2026 SU(6) update is still pre-continuum with no T1+- plateau despite nine T1+- operators in its basis. It is a comparison and a history, not a bound: nothing here constrains the source transport G19 needs, and no number crosses into a Hamiltonian claim.
