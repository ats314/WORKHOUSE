      string tensions (k-strings) and topology for N = 2, 3, 4, 5, 6, 8,
      10, 12 with SU(infinity) extrapolations; AT_2020_SU3 is its SU(3)
      column (cited as its ref [11]). Also read from the stored copy:
      Lambda_MSbar = 263(4)[9] MeV for SU(3) [eq. above its section 4.2
      conclusion], chi_t^(1/4)/sqrt(sigma) -> 0.3681(28) at N = infinity,
      and NO Hamiltonian strong-coupling reference in its 74-entry
      bibliography. Euclidean Monte Carlo throughout: comparison targets
      only, nothing numerical enters any Hamiltonian claim.
    # INSPIRE reference list of recid 1866413, retrieved 2026-08-21
    # (MP_1999, MT_1989, and AT_2020_SU3 = its [11] all confirmed).
    cites: [MP_1999, MT_1989, AT_2020_SU3]
