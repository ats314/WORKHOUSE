          C-even sector agrees too, not just the carrier's.
      - target: M3_EVEN_K0
        relation: corroborates
        status: verified
        detail: >
          4 a_3(M_S) = -0.1039004229144 against the corpus certificate value
          -54049/520200 = -0.103900422914264: gap 1.4e-13. Third order,
          C-even, from a table printed in 1989.
    answered_questions:
      # The five open_questions of the corpus's own audit (FLATBAND_PAPER_
      # EXPANSION_AUDIT 2026-07-25 section 2.5), answered from the pinned copy.
      - q: Hamiltonian normalization -- electric Casimir and magnetic-term conventions
        a: >
          W = (2/g^2) a H = Sum_l E_l^2 - x Sum_p (Z_p + Z_p^dag), eq. (1).
          The single-plaquette rest energy is a_0 = 16/3 (recurring-decimal
          dot in the table), i.e. fundamental Casimir 4/3 per link -- the same
          electric convention as the program's H_0 = (1/2) Sum E^2.
      - q: expansion parameter -- conversion between Hamer's variable and y
        a: >
          x = 2/g^4, so x = 2u in the canonical coordinate u = beta/6 = 1/g^4.
          No 4**r ambiguity arises; the bridge below carries the whole
          conversion.
      - q: energy definition -- one-particle energy versus vacuum-subtracted mass
        a: >
          M is the mass gap of W (excitation above the vacuum of W), and the
          physical mass is m a = (g^2/2) M, eq. (2). Combined with x = 2u this
          gives exactly the corpus bridge m_n = 2**(n-1) a_n, which the
          published-comparisons suite now proves as algebra.
      - q: 1^{+-} coefficients -- equality or disagreement through the shared order
        a: >
          Equality, at the paper's printed precision, at every shared order.
          n = 0: 16/3 / 2 = 8/3 exactly; n = 1: +1 exactly; n = 2: 2 a_2 vs
          11/306, gap 9.9e-14; n = 3: 4 a_3 vs D_3, gap 1.1e-12; n = 4 is the
          a_4 agreement above. The C-even sector agrees through n = 3 as well.
      - q: momentum resolution -- whether Hamer computed only k=0 masses or a full band
        a: >
          k = 0 only: the states, eqs. (3)-(5), are translationally invariant
          single-plaquette combinations, and only mass gaps are computed. So
          this paper structurally cannot constrain the off-axis coefficient
          C_shp -- consistent with Phi_C(0) = 0 and the scope G3 must settle.

