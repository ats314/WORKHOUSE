      Experiment in full QCD with dynamical quarks, in a channel this repository does not check. The measured object is a physical hadron produced in J/psi radiative decay and reconstructed from mesons; every number in it is a branching fraction, a resonance parameter or a confidence limit of that theory, not of the pure-gauge SU(3) Hamiltonian lattice the corpus computes in. Its own reference [15] (MORNINGSTAR_2025) records the matching caution from the lattice side: with N_f = 2 + 1 dynamical quarks, no scalar state below about 2 GeV can be considered predominantly a glueball. Corpus section 12 forbids the crossing; nothing here may supply a value.
    note: |
      The maintainer-supplied primary arXiv v1 PDF (10 pages, 22 July 2026), read in full on 2026-09-10; bibliographic metadata, DOI and licence taken from the file's own embedded arXiv fields. The arXiv nonexclusive-distrib grant runs to arXiv and not to this repository, so the copy is pinned by digest and never stored.
      The measurement: with (10087 +- 44) x 10^6 J/psi events, the decay X(2370) -> K*(892)^0 Kbar^0 + c.c. is searched for in J/psi -> gamma K0_S K0_S pi0 and not found. B[J/psi -> gamma X(2370)] x B[X(2370) -> K*(892)^0 Kbar^0 + c.c. -> K0_S K0_S pi0] = (0.1 +- 1.2(stat) +- 1.1(syst)) x 10^-6, hence < 2.7 x 10^-6 at 90 percent C.L.; the ratio to the inclusive K0_S K0_S pi0 mode is R = 0.003 +- 0.040(stat) +- 0.026(syst), hence R < 0.081 at 90 percent C.L. Because a 0^{-+} flavor singlet cannot decay to K*(892) Kbar by generalized G-parity, the suppression is read as a flavor-singlet signature, and the paper claims the X(2370) as the first flavor-singlet light hadron observed above 1 GeV/c^2.
      Supporting numbers as printed: the X(2370) mass 2376.3 +- 8.7(stat) +3.2/-4.3(syst) MeV/c^2 and width 83 +- 17(stat) +44/-6(syst) MeV from the 2011 discovery; J^{PC} = 0^{-+} determined at more than 9.8 sigma; the fit here fixes mass and width to the combined 2359 MeV/c^2 and 170 MeV. It quotes the lattice 0^{-+} ground-state glueball mass as 2.3 to 3.0 GeV/c^2 from its refs [1-6], and the lattice-predicted radiative production rate to the pure 0^{-+} glueball as (2.31 +- 0.90) x 10^-4 from its ref [5].
