          surfaces, in print in 1985, in the large-N Euclidean regime. Same
          numerator family and same closed-surface role, different limit and
          different dynamics. A derivation of the finite-N completion
          coefficients from these cumulant weights would make the family a
          rediscovery and STRENGTHEN the anchor table; none is known.

