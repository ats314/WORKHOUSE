      Bibliographic reading, from its own 39-entry reference list: the lattice anchors are Bali et al. 1993 [1], MP_1999 [2], CHEN_2006 [3], Gregory et al. 2012 [4], Gui et al. 2019 [5], Vadacchino 2023 [6], MORNINGSTAR_2025 [15] and Dudek et al. 2011 [39]. There is no Hamiltonian strong-coupling work of any kind in it -- not KS_1975, not KSS_1976, not HAMER_1989 -- so the split documented in docs/referee/modern_anchor_sweep_2026-08-21.md holds on the experimental side too, and now at both ends of the same web: absent in BB_1983 at the 1983 trunk, complete by 2026.
