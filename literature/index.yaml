  - what: Berg and Billoire, Glueball spectroscopy in 4d SU(3) lattice gauge theory (II), Nucl. Phys. B226 (1983)
    would_settle: |
      Part I is now pinned and read (BB_1983). It classifies spacelike Wilson loops up to length 8 but reports Monte Carlo results only from loops up to length 6 on a 4^3 x 8 lattice, and defers the length-8 measurements on a 5^3 x 8 lattice to Part II. Part I's Table 3.1 gives the T_1^{+-} content of the length-4 and length-6 prototypes only; the length-8 content sits in the table on its p. 121, which this scan does not render, so Part II is the printed record of both what the enlarged basis contains in this channel and what it measured -- the earliest data point on the question G18's smeared carrier and FLPS_2026's nine-operator T1+- basis are both about. It would also fix whether the 1^{+-} non-scaling of Part I survives a larger basis and a larger lattice, which Part I leaves explicitly open.
  - what: A review of Schrieffer-Wolff / Feshbach projection error control
    would_settle: |
      U3 conjectures that both vanishings in this corpus are properties of the Q projection rather than of either geometry. A general statement about Q P Q on a degenerate sector is what would promote it, and G14 is the cubic half.
