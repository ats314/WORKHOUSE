# Published literature, and what each paper actually bears on.
#
# This is an evidence map, not a bibliography. An entry earns its place by
# naming a specific claim in this repository -- a contradiction, a gap, a
# register item, a unifying candidate, or a constant -- and saying what
# relationship the paper has to it. `workhouse lit --for C7` answers "what
# published work bears on this claim?"; validate() rejects an entry whose
# target does not resolve.
#
# A published paper is NOT authority here either. It is T3 until something
# checks it, exactly like a corpus document. The difference is that an
# external result was produced without knowledge of this program, so where it
# agrees, the agreement is evidence rather than bookkeeping.
#
# v2 adds the citation web. Three fields, same discipline as everything else
# here -- judgement curated, the join derived, validation mechanical:
#
#   inspire_recid       the paper's INSPIRE-HEP record number, so reference
#                       lists and citation counts are re-fetchable
#   inspire_citations   {count, as_of} -- INSPIRE's global citation count on
#                       the day it was read. A GLOBAL weight: how much the
#                       field leans on the paper. Recorded, never computed.
#   cites               curated list of ids (indexed papers or stubs) this
#                       paper cites, populated from PRIMARY sources -- the
#                       INSPIRE reference list of the recid above, or the
#                       pinned PDF's own bibliography -- never from memory.
#                       A citation earns an entry when either endpoint bears
#                       on an indexed claim or it connects two papers already
#                       in the web; the rest of a reference list stays out.
#
# The LOCAL weight -- how many papers in this web cite a given entry -- is
# computed at generation time from the cites lists (literature.in_degree),
# never stored: a stored count is stale the session after it is written.
# `workhouse lit` ranks by it; a heavily-cited-in-web paper that is still
# not-yet-obtained is, automatically, the next acquisition target.
#
# A citation edge is bibliography, not endorsement: it records that one paper
# cites another, and it can never promote a claim.
schema: literature/v2
