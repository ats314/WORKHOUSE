  - id: BB_1983
    title: Glueball spectroscopy in 4d SU(3) lattice gauge theory (I)
    authors:
      - B. Berg
      - A. Billoire
    venue: Nucl. Phys. B221, 109-140
    year: 1983
    doi: 10.1016/0550-3213(83)90620-X
    arxiv: null
    inspire_recid: 182491
    inspire_citations:
      count: 207
      as_of: 2026-08-21
    licence: publisher-copyright
    fulltext: null
    source_sha256: d30b57d10cc352c0ff20511c65c130397d9f7b94ab0428a17fa096fc54dcf8c8
    note: |
      Promoted from a stub on 2026-09-10, when the maintainer supplied the full 32-page scan of the published article and it was read in full. North-Holland copyright, so the copy is pinned by digest and never stored. Part I of two: the printed title carries the "(I)", and section 1 states that Part II will give the MCV results on a 5^3 x 8 lattice using Wilson loops up to length 8. Euclidean quenched Monte Carlo throughout -- comparison only, nothing numerical enters any Hamiltonian claim.
      What the pinned pages actually carry, in three parts.
      (1) The operator classification the T_1^{+-} channel label comes from. Section 3 constructs every irreducible representation of the 48-element cubic group O_h on spacelike Wilson-loop operators up to length 8, and Table 3.1 (p. 120) prints the irreducible content of the four prototypes up to length 6. The single spatial plaquette, d = 6, decomposes as A_1^{++} + E^{++} + T_1^{+-} -- three C-even states and three C-odd ones -- and that C-odd triplet is the class the corpus's bare T_1^{+-} carrier belongs to. Section 3.2 states the rule that produces the split: real parts of Wilson-loop operators carry C = +1, imaginary parts carry C = -1. The transcription was checked here by summing the printed multiplicities against the printed dimension d, exactly, for all four prototypes: #1 plaquette 1 + 2 + 3 = 6; #2 double plaquette 1 + 1 + 4 + 3 + 3 = 12; #3 bent plaquette 12 (P = +) + 12 (P = -) = 24; #4 twisted plaquette 1 + 3 + 1 + 3 = 8. A second, independent check of the same transcription: applying the paper's own subduction assignment (eq. 3.6 -- A_1 -> 0, T_1 -> 1, E and T_2 -> 2, A_2 -> 3) to Table 3.1 yields ten distinct J^{PC} labels, nine of them excited, which is the count section 5 states and the set Table 8 tabulates.
      (2) The mass gap. m(0^{++}) = (280 +- 50) Lambda_L (eq. 4.6), about 750 MeV through Lambda_L = (6 +- 1) x 10^-3 sqrt(K) and sqrt(K) approximately 440 MeV (eqs. 4.7-4.8); the tangent method on the strong-coupling series gives 310 Lambda_L (eq. 4.9). A 4^3 x 8 lattice, Pietarinen heat bath, about 80 hours of CDC 7600.
      (3) The negative result, which is the part that matters here. The 0^{++} scaling window ends sharply at 5.6 < beta < 5.7, and there is no scaling window for any of the nine excited states: "we have no signal for the existence of any of these states in the physical spectrum" (section 5). Table 8 gives the 1^{+-} at distance t = 1, minimized over its contributing operators, as 4.87(44), 4.19(24), 4.33(16) and 4.56(41) at beta = 5.2, 5.4, 5.6 and 5.7 -- roughly flat in beta, which is the paper's own reading of it. A methodological finding recorded alongside: systematic-sweep upgrading produced significantly negative values for the positive-definite 0^{--} correlation (Table 9), and random-link upgrading, which satisfies detailed balance, removed the effect immediately.
      Its bibliography is why the promotion matters for the citation web. This 1983 Euclidean Monte Carlo paper DOES cite the Hamiltonian strong-coupling line -- KSS_1976 is its [17], with Munster [18], Seo [19] and Smit [21] on the Euclidean series -- so the bibliographic split that docs/referee/modern_anchor_sweep_2026-08-21.md documents in CHEN_2006, AT_2020_SU3 and MORNINGSTAR_2025 is not present at the trunk of the lattice line. It opens later. Section 4.3 also prints what KSS_1976's diagonal Pade extrapolation gave, which nothing else in this web records: m(1^{+-}) approximately 1.6 m(0^{++}) (eq. 4.10a) and m(2^{++}) approximately 1.0 m(0^{++}) (eq. 4.10b).
      Recorded scan limits, so nobody re-derives them as content: printed pages 121, 129 and 135 yield no usable text layer in this scan, so nothing is quoted from them -- including the final mass-gap collection that p. 130 refers to as table 6. Table 8's leading "OP" column, which names the contributing operators per row, is likewise not reliably recovered; only the labelled "minimized" rows are quoted above.
