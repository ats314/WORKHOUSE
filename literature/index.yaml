  - id: OBZ_1985
    title: Strong coupling expansion of large-N QCD and surfaces
    authors: [K. H. O'Brien, J.-B. Zuber]
    venue: Nucl. Phys. B253, 621-634
    year: 1985
    doi: 10.1016/0550-3213(85)90549-8
