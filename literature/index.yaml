  - id: MP_1999
    title: The glueball spectrum from an anisotropic lattice study
    authors: [Colin J. Morningstar, Mike Peardon]
    venue: Phys. Rev. D 60, 034509
    year: 1999
    doi: 10.1103/PhysRevD.60.034509
    arxiv: hep-lat/9901004
    licence: arxiv-assumed-1991-2003
    fulltext: null
    bears_on:
      - target: G18
        relation: supplies-comparison
        status: not-yet-obtained
        detail: >
          The standard continuum-extrapolated SU(3) glueball spectrum,
          including the 1^{+-}. G18 is the spectral bridge: the claim that the
          protected carrier is the glueball. Any bridge that lands has to land
          on numbers like these, and the corpus's own Monte Carlo shows the
          bare operator carries under 4 percent of the physical state.

  - id: CS_2006
    title: >
      Integration with respect to the Haar measure on unitary, orthogonal and
      symplectic group
    authors: [Benoit Collins, Piotr Sniady]
    venue: Comm. Math. Phys. 264, 773-795
    year: 2006
    doi: 10.1007/s00220-006-1554-3
    arxiv: math-ph/0402073
    licence: arxiv-assumed-1991-2003
    fulltext: null
    bears_on:
      - target: C7
        relation: supplies-method
        status: verified
        detail: >
          The Weingarten calculus that falsified the stranded-flux zero
          backend. C7's decisive witness quotes Wg(e) = 1/8,
          Wg((12)) = -1/24 and integral |U_11|^4 = 1/6 for SU(3); all three are
          now re-derived symbolically in N from the n=2 Gram matrix
          G[s,t] = N**cycles(s t^-1), giving 1/(N^2-1), -1/(N(N^2-1)) and
          2/(N(N+1)). See the "published comparisons" invariant suite. This is
          the one edge in this file that has been promoted from prose to T1.

  - id: SCHIERHOLZ_1988
    title: Glueball masses in SU(3) lattice gauge theory
    authors: [G. Schierholz]
    venue: Nucl. Phys. B (Proc. Suppl.) 4, 11-20
    year: 1988
    doi: 10.1016/0920-5632(88)90079-9
    arxiv: null
    licence: publisher-copyright
    fulltext: null
    # The PDF is not stored -- publisher copyright, same gate as every other
    # entry. Pinned by hash instead, so the copy that was read is identifiable
    # without being redistributed.
    source_sha256: f5a385dfdd98d8b1a0c59fde9cd5e48e7b257252847bbb7a52f4d85dc00d6cb6
    bears_on:
      - target: G18
        relation: corroborates
        status: verified
        detail: >
          Section 2 is an independent, published statement of exactly the
          obstruction G18 names, from 1988 and with no knowledge of this
          program. A local colour-singlet operator of dimension 4 -- the
          plaquette, which is the class the corpus's bare T_1^{+-} operator
          belongs to -- has projection onto the lowest glueball state falling
          like the FIFTH POWER of the lattice spacing, and Schierholz measures
          it at "of the order of a couple of percent" at beta = 5.9. The
          corpus's own Monte Carlo independently finds the bare operator
          carrying under 4 percent (2 sigma). Two measurements, 38 years apart,
          of the same few-percent overlap.
      - target: G19
        relation: supplies-method
        status: verified
        detail: >
          The remedy is the sharpening. Schierholz does not treat the small
          overlap as a constant to be lived with: it scales as a^5, so it gets
          WORSE toward the continuum, and the fix is to build operators of lower
          dimension, necessarily nonlocal -- here d = 2 operators from the
          inverse spatial covariant Dirac operator (d_i + m)^{-1}. G18 as the
          ledger states it treats the overlap as a fixed small number. It is a
          power law, which is why the smeared basis is structural rather than a
          convenience, and why G19 cannot be reached by better statistics alone.

  - id: KRS_2023
    title: Loop-string-hadron formulation of an SU(3) gauge theory with dynamical quarks
    authors: [Saurabh V. Kadam, Indrakshi Raychowdhury, Jesse R. Stryker]
    venue: Phys. Rev. D 107, 094513
    year: 2023
    doi: 10.1103/PhysRevD.107.094513
    arxiv: 2212.04490v2
    licence: cc-by-nc-nd
    # The first indexed paper whose licence permits redistribution at all, and
    # even then only verbatim: NoDerivatives means the stored file must be the
    # unmodified original, which validate() checks against source_sha256.
    fulltext: fulltext/2212.04490v2.pdf
    source_sha256: aa8e8e08147e8e5899e2c09926524d89ceaadeb481936e14dcfd563122756724
    scope_firewall: >
      1+1 dimensions, with dynamical staggered quarks. This program is 3+1
      dimensional and pure gauge, and its chain complex C_3 -> C_2 -> C_1 does
      not exist below three spatial dimensions. NOTHING numerical transfers.
      Corpus section 12 forbids exactly this kind of crossing, and the entry is
      written to be read as comparison, never as input.
    bears_on:
      - target: U1
        relation: supplies-comparison
        status: verified
        detail: >
          An independent, modern solution to the same underlying problem U1 is
          about: constructing the gauge-invariant Hilbert space of the SU(3)
          Kogut-Susskind Hamiltonian and keeping the dynamics inside it. Its
          conclusion states that benefit in those words. The route is completely
          different -- irreducible Schwinger bosons and prepotentials, giving
          site-local SU(3) singlets (two bosonic fluxes, three quark modes) --
          where U1 claims the structure follows from the chain complex. Two
          constructions of the same object by unrelated means is what would make
          U1 a mechanism rather than an observation, and what a promotion of U1
          would have to engage with.
      - target: R2
        relation: supplies-method
        status: verified
        detail: >
          Section III.A states the SU(3) Kogut-Susskind operator conventions
          this program assumes and rarely writes down: chromoelectric fields E_a
          with adjoint index a = 1..8, link operators U as unitary 3x3 matrices,
          T^a = lambda^a/2 with the Gell-Mann matrices, structure constants
          f_abc, and left/right fields related by parallel transport
          E_a(R,r) T^a = -U^dagger(r) E_b(L,r) T^b U(r). It does NOT state the
          coupling normalization: u = beta_N/(2N) appears nowhere in it, and
          this edge would be an overstatement if it claimed otherwise. What it
          supplies is a citable modern statement of the operator framework R2's
          coordinate is defined relative to.
    note: >
      Worth knowing for a novelty check: LSH reaches d <= 3 for SU(2) but the
      SU(3) formulation here is d = 1, and the paper says the gauge-fixed
      comparison Hamiltonian "does not generalize to either periodic boundary
      conditions or to d > 1". This program works with SU(3) in d = 3 on a
      periodic torus. That is a real difference in reach, and it cuts both ways:
      it is not evidence this program is correct, only that the two are not
      solving the identical problem.

# Papers the program needs and does not have. Each says what it would settle,
# so this is a work list rather than a wish list. Moving one into `papers`
# requires verified metadata -- an unverified citation is the same failure mode
# as an unverified coefficient.
wanted:
  - what: Kogut, Pearson, Shigemitsu -- SU(3) string tension and roughening (c. 1981)
    would_settle: >
      Named by the corpus's own recovery engine as KPS_1981_string, one of the
      three primary sources it tries to locate. Independent string-tension
      series for the sigma comparison in G7.
  - what: A modern continuum SU(N) glueball spectrum at several N
    would_settle: >
      Whether the all-rank family alpha_N, beta_N has any continuum shadow.
      Currently nothing in the corpus reaches the scaling window (G19), so this
      would bound how far the finite-order results can be pushed.
  - what: A review of Schrieffer-Wolff / Feshbach projection error control
    would_settle: >
      U3 conjectures that both vanishings in this corpus are properties of the
      Q projection rather than of either geometry. A general statement about
      Q P Q on a degenerate sector is what would promote it, and G14 is the
      cubic half.
