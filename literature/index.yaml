    bears_on:
      - target: G3
        relation: supplies-method
        status: verified
        detail: >
          A published construction of exactly the object class G3's
          marked-cluster engine must build: an effective operator on the
          lowest-order degenerate eigenspace whose eigenvalues equal the
          full transfer matrix's to all orders, with the projector supplied
          exactly by the moment-cumulant (linked-cluster) transformation.
          Euclidean rather than Hamiltonian, so its numbers are
          inadmissible; what it supplies is the method precedent and a
          worked example of the subtraction bookkeeping, from 1985, with no
          knowledge of this program.
      - target: C2
        relation: supplies-comparison
        status: verified
        detail: >
          The paper diagonalizes its effective matrix into the dispersion
          E(p) = m + f p^2 + g ((p^2)^2 - 3 sum p_i^4) + h (p^2)^2 and
          publishes the cubic-harmonic (shape) series g_4..g_8 for SU(3) —
