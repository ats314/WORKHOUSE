    note: |
      An independent condensed-matter construction of exactly flat bands from H = t B^T B on the FACES of an arbitrary graph, with the extensive null space proved topologically protected by a discrete Atiyah-Singer index theorem, dim ker(B^T B) - dim ker(B B^T) = |F| - |V|. The form is this repository's face operator and the cubic lattice is its first worked example, which is why it is indexed. The mechanism is NOT the same, and the registered check says so precisely: Hazra's B is the UNORIENTED face-vertex incidence -- his own footnote states it -- giving |F| - |V| = 2L^3 flat bands on the cubic lattice by rank-nullity alone, where this repository's B is the SIGNED face-edge boundary with |F| = |E| = 3L^3, index exactly 0, and L^3 + 2 zero modes that are the cycle space of the three-torus. Source tarball obtained (sha256 77c001247025f669610d6a432833e2618077d9e8c136956e7629683b48a54b99); not stored, since the submission says "License information to appear upon publication".
