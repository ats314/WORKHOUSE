    answered_questions:
      - q: Hamiltonian normalization -- electric Casimir and magnetic-term conventions
        a: |
          W = (2/g^2) a H = Sum_l E_l^2 - x Sum_p (Z_p + Z_p^dag), eq. (1). The single-plaquette rest energy is a_0 = 16/3 (recurring-decimal dot in the table), i.e. fundamental Casimir 4/3 per link -- the same electric convention as the program's H_0 = (1/2) Sum E^2.
      - q: expansion parameter -- conversion between Hamer's variable and y
        a: |
          x = 2/g^4, so x = 2u in the canonical coordinate u = beta/6 = 1/g^4. No 4**r ambiguity arises; the bridge below carries the whole conversion.
      - q: energy definition -- one-particle energy versus vacuum-subtracted mass
        a: |
          M is the mass gap of W (excitation above the vacuum of W), and the physical mass is m a = (g^2/2) M, eq. (2). Combined with x = 2u this gives exactly the corpus bridge m_n = 2**(n-1) a_n, which the published-comparisons suite now proves as algebra.
      - q: 1^{+-} coefficients -- equality or disagreement through the shared order
        a: |
