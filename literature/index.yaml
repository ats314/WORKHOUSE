    # so pinned, not stored.
    source_sha256: 972fdb855e5bc9555203d8c241a88414620f5e3238136ee2b44818b76d49a592
    note: >
      Found by the completion-family novelty search (see
      docs/referee/novelty_search_2026-08-21.md) as the closest published
      relative of the cellular completion coefficients: eq. (2.5) attaches
      SIGNED CENTRAL BINOMIALS (2k)!/(k!)^2 as one-link cumulant weights to
      the cyclic contractions that sew closed plaquette surfaces (cube worked
      examples) in the large-N Euclidean free-energy expansion, and the
      companion OBZ_1984 derives them from an inverse square root of the
      one-link integral. What it is NOT: no finite-N (N^2-1)^(r-1) power
      denominators, no prism-cap sector, no Rayleigh-Schrodinger resolvents
      -- Euclidean free energy at N -> infinity, not Hamiltonian degenerate
      perturbation theory. The bridge that makes it adjudication-relevant:
      S_n = (-1)^(n-1) C(2n-2, n-1) = (-1)^(n-1) n Cat(n-1), so the family's
      signed counts are exactly n times the Kazakov/O'Brien-Zuber
      Catalan-class weights. The published-comparisons suite checks that
      identity; whether the family is DERIVABLE from these cumulant weights
      is the open adjudication a novelty claim must argue.
    # Own reference list of the pinned copy, brackets [1], [10], [11], [13].
    cites: [WILSON_1974, DZ_1983, KAZAKOV_1983, OBZ_1984]
    bears_on:
