      h (p^2)^2 whose g series occupies the same role as the disputed
      off-axis shape coefficient. Registered: MUNSTER_TM_MS/F/G/H8. Its
      Table 1 also produced a FINDING (see the published suite): the mass
      row disagrees with the 1982 erratum at exactly eighth order.
