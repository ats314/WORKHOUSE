          Hamiltonian band, computed for the same degenerate plaquette
          triplet. Nothing numerical transfers across the regime boundary
          and neither side of C2 is touched; the comparison is structural:
          an independent published precedent that the shape channel is
          computable order by order from a degenerate-sector effective
          operator, which is what G3 must do on the Hamiltonian side.

