          overlap as a constant to be lived with: it scales as a^5, so it gets
          WORSE toward the continuum, and the fix is to build operators of lower
          dimension, necessarily nonlocal -- here d = 2 operators from the
          inverse spatial covariant Dirac operator (d_i + m)^{-1}. G18 as the
          ledger states it treats the overlap as a fixed small number. It is a
          power law, which is why the smeared basis is structural rather than a
          convenience, and why G19 cannot be reached by better statistics alone.

