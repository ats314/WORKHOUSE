- id: STUDY:YM:wilson-free-marked-resolvent
  statement: Damped free Wilson resolvents admit a uniform bound at every kinetic energy, including unbounded representations.
  status: proven
  detail: WT-5 derives tau/(exp(tau E)-1)<=1/E and, on a contour of clearance Delta and |z|<=Z, the relative bound
    (pi/2)exp(tau0 Z/2)(1+Z/Delta), provided tau0 abs(Im z)<=pi. Spectral calculus extends it to exact-support rooted
    coefficient sums. The dressed interacting insertion next to the resolvent remains to be controlled.
  sources:
