- id: STUDY:YM:wilson-carrier-transport
  statement: Uniform complete-shell matching transports the G18 relative carrier gap and its source amplitude to
    Wilson.
  status: proven
  detail: Under the stated calibrated-window and Hamiltonian G18 inputs, WILSON_SHELL sections 6-7 sum
    fixed-order matching using the proved common majorant. Equal constant and linear energy coefficients give
    uniform convergence after division by u^2, hence one sufficiently fine temporal threshold for a common
    small-coupling interval and every nonzero momentum. The internal gap exceeds (t3/4)u^2 q(k). The complete
    literal-source frame survives; a specified observable retains any established positive overlap that exceeds
    the projection and synthesis errors. No spatial continuum or summed O(epsilon^2) rate is claimed.
  sources:
  - paper: YAROTSKY_2004_QP
    locator: PDF pp. 9-10, Riesz projection and totality framework
  - paper: JW_2006
    locator: p. 6, physical spectral-gap requirement and separation from formal approximations
