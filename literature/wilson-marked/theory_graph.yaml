- id: STUDY:YM:wilson-complete-shell
  statement: The actual normalized Wilson transfer has a complete physical shell and onto literal-source frame,
    with a common holomorphic weighted majorant on the stated small-coupling domain.
  status: proven
  detail: WILSON_SHELL incorporates the hash-pinned September 5 actual chart, activity and physical-band proofs.
    Its two-sided anchored bilinear estimate controls the complex full Hilbert-space operator. Finite-order
    marked locality and uniform Cauchy estimates yield the common weighted Taylor majorant. The original WT-6
    rooted coefficient-operator norm is not asserted; this sufficient alternative completes the shell route.
    The calibrated kinetic-window hypotheses remain explicit. Full statements are analytic, not Lean-certified.
