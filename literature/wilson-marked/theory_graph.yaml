- id: STUDY:YM:wilson-block-majorant
  statement: The exact activated Wilson block has norm at most product_p(exp(ell abs(u) norm(V_p))-1), uniformly
    in the microscopic step.
  status: proven
  detail: WT-1 and WT-2 prove this from the actual symmetric product by norm-convergent magnetic word expansion
    and inclusion-exclusion. ell=ceil(t0/tau)*tau stays in [t0,t0+tau0]. No upper onsite-energy bound or substitution
    of an auxiliary Hamiltonian is used. This analytic operator theorem is not formalized by its finite checks.
  sources:
  - paper: YAROTSKY_2004_GS
    locator: PDF pp. 7-9, active-block organization; the Wilson product estimate is derived in WT-2
