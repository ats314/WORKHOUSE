- id: STUDY:YM:wilson-vacuum-majorant
  statement: The Wilson vacuum polymer series converges on an explicit coupling disc uniform in temporal step and
    spatial volume.
  status: proven
  detail: WT-4 proves degree d<=38, at most 2^(10s) assignments per support, support size s<=8a+2b, and root sum
    r/[d^2(1-r)]. For r<=1/2 the incompatibility budget is 39/1444<1. The inspected abstract convergence theorem
    then supplies a vacuum logarithm and connected local marked series with an exponential support margin. The actual
    finite-volume vacuum and a local thermodynamic vacuum state are identified; the complete excited shell is not.
  sources:
  - paper: UELTSCHI_2004_CLUSTER
    locator: PDF p. 2, Theorem 1, equations (3)-(5)
  - paper: YAROTSKY_2004_GS
    locator: PDF pp. 8-10, active and excited regions; Wilson constants are derived in WT-4
  links:
