# Discovery concept lexicon: one concept, its spellings across source families.
#
# Why this file exists: the discovery engine finds a cross-family source only
# when the query uses that family's words. September derivations write
# "conditional score", "outside quantum pressure", "selected inverse"; the
# imported notes and corpus-import write "Brascamp-Lieb", "effective
# potential", "Schur complement". An agent that searches in one vocabulary
# reads the silence of the other families as absence.
#
# Every variant is OBSERVED, never invented: `source` is a checkout path with
# the line(s) where that family uses the spelling, and
# `workhouse discover lexicon validate` fails when the file, the lines, or the
# words are gone. A variant without a citation is a guess, and a search that
# expands through guesses reads its own guesses as corpus evidence.
#
# Entries carry terminology only. Status, evidence and tier belong to ledger
# records; a lexicon entry with those keys is rejected.
#
# Families (roots): derivations (docs/derivations, docs/research, research),
# historical (theory), notes (notes/imported), literature (literature),
# corpus-import (corpus-import), paper (paper).
#
# Maintain with `workhouse discover lexicon add --entry entry.yaml`; keep
# `entries:` as the last top-level key so appends are textual.
schema: workhouse-discovery-lexicon/v1
version: 1
updated_on: 2026-09-11
description: >
  Concept-to-terminology map across the checkout's source families, each
  variant cited to a line where that family uses it. Seeded on 2026-09-11 by
  reading docs/derivations, notes/imported, corpus-import, literature, paper
  and theory; symbol aliases stay in ledger/symbols.yaml.
