reasoning: 'Investigator (outside-pressure-schur): The tex Hessian evolution d_t h = Delta h - 2(grad
  S.grad)h - 2h^2 (Prop. 2.2) is SC17 R1 (lines 541-546) at eps=1, V=0 under h=-J, S=-u: (d_t+K_t)J =
  2 eps J^2 - V'''' with K_t=-eps(Delta+2 grad u.grad); signs and constants agree exactly. SC17 adds the
  potential source -V'''', the constant reference precision Omega (E=J+Omega) and the projected cross
  terms R2/R3. The tex''s scalar Riccati inequality drops diffusion and advection heuristically with an
  unspecified anomaly source sigma; SC17 R8 keeps K_t and bounds sup_t ||E_t||_(s,infty) by Duhamel in
  a weighted Banach algebra rather than by a maximum principle. Next check: Verify by one line of algebra
  (or a symbolic script) that substituting h=-J, S=-u, eps=1, V=0 into SC17 R1 reproduces the tex Prop.
  2.2 term by term, and that EX-014 sec 8''s exact heat-flow solution H_t^{-1}=H_0^{-1}+2 nu t is the
  V=0, Omega=0 solution of R1 (convexity decays like 1/(2t)); this fixes that the tex''s ''positive source''
  must be the signed defect -[V''''-2 eps Omega^2] of R1, not an anomaly term.'
