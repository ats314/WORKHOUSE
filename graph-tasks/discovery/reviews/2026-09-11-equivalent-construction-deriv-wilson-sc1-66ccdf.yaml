reasoning: 'Investigator (outside-pressure-schur): NOT the quantum analogue. Exact identity: with u=log
  Omega, J=Hess u, W_B=V_out-eps(Delta_b u+|grad_b u|^2) (=BA10) and W_B'''' = -2 eps J_xb J_xb^T + K_b
  J_xx, K_b=-eps(Delta_b+2 grad_b u.grad_b) entrywise; pointwise in (x,b), no fibre expectation, no covariance,
  no C^{-1}. Gaussian case: W_0''''=-2 eps BB*, V_0''''+W_0''''=2 eps A^2 (= R12a/GC6). R12a states the
  CONDITIONAL Gaussian precision is the diagonal block A; EX-014''s sharpness check states the MARGINAL
  Gaussian precision is the Schur complement A-BC^{-1}B^T: different objects, opposite conditioning direction.
  D_b = 2 eps X^2 - 2 eps(AX+XA) - K_x X is the stationary Riccati source; the pressure excess (W_B-W_0)''''
  = -2 eps(YY*-BY*-YB*) + K_b X reproduces the R2 cross terms plus K_b X (R5 with U_b is R2 with K=K_x+K_b):
  quadratic in the mixed log-Hessian defect, not a covariance. EX-014 sec 7 needs a literal conditional-expectation
  step; Next check: Replace the toy potential in cases/outside-pressure-schur/check_pressure_hessian.py
  by a two-angle one-plaquette SU(2) potential in the exponential chart (S^3 metric factor of SC17 lines
  570-573 as first-order correction), eps=1, lambda=1/72 and 0.03; compute (V_B-V_0)'''', -2 eps(YY*-BY*-YB*)
  and K_b X separately in sup norm over |b|<=pi; decide whether ||K_b X|| is bounded by the R7 output
  r (a priori it is not: it needs second b-derivatives of X that ||E||_(s,infty) does not control) and
  whether the total is below the sec 6 budget delta<=eps lambda^(3/2)/24=1.35e-5 at lambda=1/72, which
  was o'
