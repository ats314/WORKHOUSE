  - id: mce_caplifted_freeze_and_run_2026-08-28
    dir: runs/mce_caplifted_freeze_and_run_2026-08-28
    title: >-
      Cap-lifted MCE sealed run: freeze passes, cluster 1 of 609 exceeds
