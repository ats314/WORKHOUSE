# The run register: one entry per pinned run record in runs/.
#
# Judgement lives here (what each run bears on); the join is derived
# (claims.py emits a RUN: node per entry, graph.py emits the evidences
# edges); the validation is mechanical (tests/test_graph.py rejects an
# entry whose directory or SHA256SUMS is missing, and a runs/ directory
# with no entry). The failure this register prevents: a run record that
# checks cite only as a file-path string, invisible to `workhouse why` —
# the same hole the notes archives had before they got nodes.
#
# No entry promotes anything. A run record is evidence that a computation
# was executed and what it printed — tier is the checks' business.
schema: runs/v1

runs:
  - id: wilson_weighted_activities_2026-09-05
    dir: runs/wilson_weighted_activities_2026-09-05
    title: >-
      A cardinality-controlled Wilson chart, weighted activities and the uniform finite shell
    bears_on: [G18, G19]
    detail: >-
      The analytic creator-velocity inverse constructs a new actual-vacuum
      unitary chart with connected assigned-support coefficients. A doubled
      holomorphic system, the actual Perron scalar normalizer and an ordered
      contour/tree bound prove the full operator activity sum with weight
      2^|X| is at most 1/2500 for |u|<=u_star/1252800000. The resulting
      perturbation norm is at most 1/998, giving the complete finite-volume
      physical odd shell on one common volume- and mesh-independent interval.
      Local sources have a cardinality and spatial margin. This replaces the
      earlier chart for this sufficient estimate; it does not identify their
      excited actions. Finite rational controls check independent support and
      matrix tangent maps, real-linear inversion, complex phase, component
      factorization, noncommuting contour coefficients and rooted tree
      factorials. Exact scalar controls check the conservative constants.
      These checks do not machine-certify the full analytic theorems.
      Thermodynamic complete Riesz-range and projected literal-source-frame
      identification remain open. Both proof notes, independent reviews,
      executed source snapshots and replay outputs are pinned.

  - id: wilson_activity_extraction_2026-09-05
    dir: runs/wilson_activity_extraction_2026-09-05
    title: >-
      Exact connected activities from the actual dressed transfer and independent tensor controls
    bears_on: [G18, G19]
    detail: >-
      A finite support-algebra logarithm extracts the unique self-adjoint
      locally vacuum-annihilating activities with zero singleton activity.
      Partition inversion reconstructs every induced dressed transfer.
      The common-filter parent flow factors on disjoint induced components,
      so the actual Wilson activities vanish on disconnected supports.
      Independent rational tensor controls retain overlapping noncommuting
      operators; a partition calculation is compared with disjoint-family
      reconstruction and an independent root-block recurrence. A positive
      vacuum-fixing family without factorization retains a disconnected
      cumulant diag(0,0,0,1/12). The generic theorem and its Wilson application
      are analytic. This run did not prove an activity norm or source bound.
      The later weighted-activity result supplies them in a different creator-
      velocity chart; no such bound for these common-filter activities is
      inferred. The proof, executed sources and outputs remain pinned.

  - id: wilson_creator_parent_2026-09-05
    dir: runs/wilson_creator_parent_2026-09-05
    title: >-
      A uniform creator parent gap and quasi-local transport of the actual Wilson vacuum
    bears_on: [G18, G19]
    detail: >-
      The analytic continuation restores the actual symmetric creators by
      magnetic half-flow, with rooted norm at most 1/8. Commuting idempotents,
      orthogonal support blocks and exact square identities give a generic
      parent gap 1-K1-M1^2, hence 247/256 at the Wilson radius. Connected
      Taylor witnesses and explicit derivative bounds verify the arbitrary
      on-site dimension spectral-flow hypotheses; intrinsic torus comparisons
      control periodic boundaries. The selected full quantum local state is
      pure and locally normal and has an automorphic GNS realization. This
      auxiliary parent does not identify Wilson excitation energies. Six
      rational tensor models and 81 PSD congruence certificates have independent
      reconstruction. Negative controls detect the omitted quadratic term and
      disprove a uniform global similarity bound. Three new Lean lemmas check
      only the star-ring identities and real scalar specialization. The proof,
      independent derivations, executed sources and strict build are pinned.
      Its then-open dressed-transfer/source activity target is subsequently
      supplied by the weighted-activity run in a different unitary chart.

  - id: mce_freeze_and_first_run_2026-08-22
    dir: runs/mce_freeze_and_first_run_2026-08-22
    title: >-
      MCE frozen-protocol attempt: freeze passes, run fail-closes on
      cluster 1 of 609
    bears_on: [G3, C2]
    detail: >-
      First execution of the settlement harness's freeze and run stages
      anywhere. Freeze PASS (self-test 47/47, both preflight pins); run
      fail-closed on the shipped closure cap (max_states=100) during the
      R2 stage of the first, smallest cluster. Established that the frozen
      protocol as received cannot start on any hardware, and measured the
      first oversize orbit at 216 states.

  - id: blind_pentagonal_o4_2026-08-28
    dir: runs/blind_pentagonal_o4_2026-08-28
    title: >-
      Target-blind pentagonal fourth-order run: both amplitudes of
      h_4^side cold-reproduced
    bears_on: [C2]
    detail: >-
      backend_full_link_balanced_control.py run unmodified, 24/24 internal
