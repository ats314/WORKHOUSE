  - id: g3_haar_hotloop_bench_2026-08-30
    dir: runs/g3_haar_hotloop_bench_2026-08-30
    title: 'The G3 performance wall, measured: a compiled hot loop is worth 3.9x, not the register''s
      10-100x, and the second wall is Fraction'
    bears_on:
      - C2
      - G3
    detail: 'G3''s live step names its own blocker -- "an upstream engine revision replacing the pure-Python
      union-find/canon hot loop with a compiled core; the measured 50%+ self-time there implies 10-100x".
      The first half reproduces exactly: one exact Haar inner product at balanced degree 3 takes 13.3
      s through the pinned engine, and merge_classes is 81% of cumulative time. The multiplier does not.
      A CPython extension doing that function -- verified bit-identical on 60,000 random partitions and
      on every real inner product -- gives 3.9x, and Amdahl caps it at 5.3x, so the register''s estimate
      was mis-attributed rather than merely optimistic. After the swap the profile moves: fractions.Fraction
      becomes 56% and merge_classes falls to 5.6%. flint.fmpq, already a dependency, is 7.7x on that arithmetic
      and exact, taking the case to 1.66 s -- 7.8x in total, every value bit-identical. Set against the
      register''s own datum (a 2-face half-history at 1h51m still inside its FIRST Haar Gram) that is
      roughly 14 minutes per Gram, which leaves the 30-cluster assembly plausibly days rather than hours.
      Nothing is committed into corpus-import/: the core is an independent reimplementation of one function
      and the benchmarks patch the module in memory only. The directory also carries the range-1 shape-dictionary
      verification behind the cheaper off-axis route.'
  - id: g3_offaxis_channels_2026-08-30
    dir: runs/g3_offaxis_channels_2026-08-30
    title: 'The off-axis route''s steps 2 and 3: in-plane is order eight, the perpendicular sector is
      a new fourth-order coefficient, and neither settles the rotation sign'
    bears_on:
      - C2
      - G3
      - G14
    detail: 'The off-axis route lists the in-plane transfer before the orbital rotation. The order is
      wrong. c_prim completes a CLOSED cell with r = faces - 2, so a fourth-order completion needs six
      unit squares -- the unit cube, which has no coplanar edge-sharing face pair at all; the smallest
      closed cell that carries one is the 1x2x1 box at r = 8. The in-plane transfer is therefore order
      eight in this channel and its fourth-order record must come from the folded/linked or adjoint terms
      cellular''s scope note excludes. The rotation sector IS reachable: the cube''s 24 ordered perpendicular
      pairs give S_4 = -11 over 14 histories, c_4,perp = -88/(N(N^2-1)^3) = -11/192 at N = 3, ratio exactly
      11/20 to the normal channel at every rank -- a coefficient the corpus does not record. It does not
      settle the +-f/2 sign: built in the Bloch basis from the repository''s own cube boundary the channel
      reaches displacement +-2 on every axis, so it is range-2 and its carrier projection is outside the
      four-shape span, which is the one dictionary row where all four coefficients are nonzero. The same
      construction corrects the earlier self-test: with the real boundary signs the normal channel gives
      A = -alpha_N/4, so only |A| and the ratio C/A = -1/2 are convention-free, and the corpus fixes the
      sign by taking |c_4|. Nothing adjudicated; C2 open.'
