      outputs are preserved. YM_GPU_AUDIT reproduces 156 Phase 1-4 numerical quantities independently.
      Phase 1 inserts a scalar mass 1.5; its selected site-source pairing is .0050877538977, while the
      sampled .052982 ratio is not a complete-source norm. Phase 2 factors into two h(5epsilon/4,v) rotors,
      reproducing the 2.483202 gap without a shared-link interaction. The exact ground transform is valid
      but does not prove a volume-uniform physical gap. Phase 3 compares two radial matrices and constructs
      no Wilson transfer. Phase 4 uses inserted scale inputs; .005403 is its twentieth iterate, while
      its conditional infinite scalar limit is positively bounded by GA8. Its 2401-state cluster is four
      independent h(3epsilon/2,v) rotors. Phase 5 correctly enumerates 1013 admissible cube spin states
      but its equal magnetic weights fail the actual shared-edge amplitude ratio sqrt(3); largest trial
      overlap also need not select the first excitation. Phase 5 spectra are not independently replayed.
      Phase 6 measures a Gaussian-weighted spatial Fourier power fraction on independently initialized
      near-identity links, not a Hamiltonian spectral overlap in the quantum vacuum. Its volume maxima
      are .5830, .7415, .8234 and .8188, contradicting its hardcoded >=85 percent conclusion. With inserted
      m=1.2/a the Fourier filter is independent of a; the reported .9010 results from additional smearing
      at fixed L and beta. GA12 bounds its L=8 statistic by .8072 even before any dynamics. Phase 7 evaluates
      a scalar geometric sum with inserted D=38 and activity beta/4; actual Wilson polymer weights are
      not constructed. Its free-energy coefficients are inserted as D^(n-1)/n!, making the eight-term
      formula identical for L>8 by construction. Its correlation simulator generates a massive Gaussian
      scalar field with inserted mass 1.25, squares it, and fits only positive empirical correlations.
      At L=8 insufficient fit points trigger the hardcoded mass fallback 1.25. These calculations do not
      prove Wilson G17. Phase 8 evaluates the VA18 row budget from an inserted amplitude .50 and an inserted
      rate 2.1939; its single-link 1.0598751 and block .0528531 are scalar lattice sums, not conditional
      projections. Its Part 1 statistic is zero identically by Haar invariance (GA15), so the reported
      .1051 is the sampling error of that zero; the single-link defect disappears at C_0=.4718 or M=2.2335
      (GA16); the block geometry is asserted rather than derived and the margin is sensitive to it (GA17);
      and the assembled 2.351957 exceeds the 2.1939 it assumes (GA18). Its M=.8 scenario computes a negative
      constant and gap -4.3908670 under a hardcoded PASS, though VA17 proves every permissible C_AT is
      at least 1/4. Both assigned rates are Phase 3''s delta_phys rounded, 2.1938797 at beta=4 and 1.5515161
      at beta=1: a one-variable radial class-function gap relabelled as the glueball mass and as the angle
      decay rate, while the run''s own Phase 5 spectrum gives M(0++) in 2.6563646 to 4.2022981. VA18''s
      own shell form gives 3.5072161 at the same assigned constants, 3.31 times the reported single-link
      sum (GA19). Phase 9 builds M=V V^T from typed matrix elements, so OS2 holds by construction with
      three exact zero eigenvalues (GA20); its clustering evaluates an inserted two-exponential formula
      and returns the inserted mass unchanged; its non-triviality statistic is the excess kurtosis of
      Tr U, equal to -1 at beta=0 with no interaction at all (GA21). Thirty-six further deterministic
      quantities are replayed independently. Actual carrier/source totality, W6 and continuum assembly
      remain open.'
