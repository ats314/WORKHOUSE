      to the pure-Python union-find under the exact Haar contraction.

  - id: g3_kernel_record_dump_2026-08-28
    dir: runs/g3_kernel_record_dump_2026-08-28
    title: >-
      The v10a.26 kernel records written down, and the two kernels compared
      record by record
    bears_on: [G3, C2]
    detail: >-
      The cold kernel's 189 per-record values, reproduced on CPU in 12.3
      minutes from the pinned v10a.26 script (kernel leg only) with every
      gate passing and C bit-identical to the registered C_SHP_NEW_NUM.
      The comparison against the pinned historical certificate: identical
      189-record support; one scale factor s = 4.1327437 explains 144
      records to 2e-12 (the whole rotation-type bulk); the divergence is
      three amplitudes — the cross-plane value (opposite sign between
      kernels), the nn same-plane NORMAL/IN-PLANE values, and the on-site
      scalar anchor (whose swap moves C by exactly zero) — and the
      class-by-class Delta_C attribution sums exactly to the measured
      difference. Neither side promoted.

  - id: cbb_finite_n_bridge_2026-08-28
    dir: runs/cbb_finite_n_bridge_2026-08-28
    title: >-
      The finite-N SU(3) truncation bridge certificate, re-run: 18/18, and
      the received certificate reproduced byte for byte
    bears_on: [R2]
    detail: >-
      verify_cbb_tn_bridge.py run unmodified. Standard library only, exact
      Fraction arithmetic, no WORKHOUSE import: it rebuilds the four SU(3)
      channel weights from dimensions and Casimirs and both cubical boundary
      matrices from oriented cell boundaries. 18/18 gates, and the JSON it
      writes is identical to the certificate that arrived with the documents.
      Establishes the arithmetic, not the physics premise -- that the
      published Ciavarella-Burbano-Bauer matrix element is the right input
      and that four channels exhaust the second-order shared-link routes is
      argued in prose and stays T3. The derivation chain itself is already
      T1-checked here from the corpus's own appendix; what this run adds is
      an independent implementation of it, plus the T1-cutoff diagnostic and
      the finite-volume fingerprints the registry did not carry.

  - id: balaji_open_cube_b4_t1_2026-08-28
    dir: runs/balaji_open_cube_b4_t1_2026-08-28
    title: >-
      The T1 = B = 4 open cube diagonalised: the reversed charge-odd shell
      confirmed in a full Hamiltonian, from the authors' own plaquette data
    bears_on: [R2]
    detail: >-
      The full-Hamiltonian one-cube test the finite-N bridge named as its
      remaining decisive test, done for the T1 branch. The local coefficients
      are the authors' public ymcirc d=3, B=4 oriented table (blob 1808849c,
      sha256 4cad9538), embedded on six faces and cut to a 243-state physical
      block by Gauss' law. Re-diagonalised in this session rather than taken
      from the shipped script: charge conjugation commutes with both terms,
      the charge-odd sector is 121 of 243, and tracking the six single-face
      states by overlap (minimum 1.0000 at u = 0.005) gives
      (E - E_max)/u^2 -> {-1/2 x2, -1/3 x3, 0 x1} with an O(u^3) residual.
      That is the REVERSED T1 ordering, opposite to the channel-complete
      {0, (5/153)^3, (5/102)^2}. The certificate's second-order gap matrix
      equals (37/12)I - (1/12)G to 4.3e-11, so t_3^T1 = -1/12 appears as the
      off-diagonal element and the eigenvalues are exactly the T1 absolute
      coefficients the separate CBB bridge certificate predicted. Establishes
      the T1 branch only; the channel-complete +5/612 needs a B = 6 cube that
      nobody has run. Not an independent-group replication -- shared author
      and code lineage, and the open-cube assembly is the reconstructor's.

  - id: b6_open_cube_channel_complete_2026-08-28
    dir: runs/b6_open_cube_channel_complete_2026-08-28
    title: >-
      The B = 6 open cube: the sign flips back to +5/612, and the scalar
      disagreement is exactly the same-face sextet route
    bears_on: [R2]
    detail: >-
      The second and last branch of the test the finite-N bridge named as
      remaining. Restoring the 6 and 8 shared-link channels reverses the B = 4
      truncated sign: t goes -1/12 -> +5/612, and the charge-odd shell ordering
      inverts, the signed cube boundary becoming lowest. Audited here for
      arithmetic rather than re-run -- the generator needs pyclebsch and an
      adapter that did not travel: the gap matrix is (39/68)I + (5/612)G to
      8.4e-15, the relative shell is {0, (5/153)^3, (5/102)^2}, and the
      channel census 1/12 - 1/6 - 2/9 + 16/51 sums to 5/612 exactly. The
      scalar disagreed with the bridge's predicted 11/34 by exactly 1/4, and
      39/68 - 1/4 = 11/34: the bridge's section 5.1 names a local same-face
      sextet route of -1/4 and this certificate independently reports that
      route first entering at cutoff 7, so B = 6 is channel-complete for the
      hopping and not for the on-site scalar. Second order only, and the
      global B = 6 basis was deliberately not enumerated.

  - id: two_cube_codd_o2_2026-08-29
    dir: runs/two_cube_codd_o2_2026-08-29
    title: >-
      Two-cube charge-odd second-order closure: -1/12 (B=4) and +5/612
      (B=6) recovered target-blind on a genuine face-sharing space
    bears_on: [R2, G3]
    detail: >-
      First multi-cube operator result in the corpus. The connected
      adjacent-hopping coefficient is derived on an actual open
      face-sharing (3,2,2) two-cube SU(3) Hilbert space (1,590,462
      states at B=6) with literal operator-level Moebius subtraction of
      the left-cube, right-cube and shared-face contributions, target
      blind. B=4 gives -(1/12)G_conn + D; B=6 gives +(5/612)G_conn + D
      -- the registry's own t_3 -- with the six shared-link channels
      separately contracted: legacy -51/612, restored 6+bar6+8 +56/612.
      The channel list is provably closed at B=6 at this order (endpoint
      Casimir budgets 6 and 17/3). Audited here for arithmetic rather
      than re-run: the NPZ artifacts, ledgers, builders and pyclebsch
      archive did not travel, but the delivered subset is byte-consistent
      with its own detached manifest chain. Second order only; the
      delivery itself states no fourth-order claim changes, so C2 stays
      open -- what this retires is the one-cube-only objection, and it
      demonstrates the target-blind operator-level machinery G3 needs.

  - id: g3_chain_amplitude_2026-09-02
    dir: runs/g3_chain_amplitude_2026-09-02
    title: >-
      The chain amplitude u computed independently: X_QUANTUM exactly on two
      chain geometries, so the cold kernel's 4.13 u is wrong
    bears_on: [C2, G3, G14]
    detail: >-
      The route ADR 0019 opened, run. An assembly that takes only Wilson
      words, exact Haar inner products and the H0 action from the pinned
      engine and does the rest itself -- invariant blocks, a Gram-free
      polynomial resolvent, the projector off the model space, Hermitian
      fourth-order theory with PVP = 0, charge-pruned integrals -- first
      reproduces the register at second order (t_3 = 5/612 with the S_sq
      sign pattern, the C-even hop -11/306, the leakage -11/306 after the
      vacuum bubble), then returns the cluster cumulant of the P -> R
      element on Q-touched histories: u = 360421351/40327601932800 on the
      coplanar chain and minus that on the bent chain, X_QUANTUM exactly
      with the sign S_PQ S_QR. Universality, G14's last dynamical input,
      holds. The v10a.26 dump's u is 4.1327437 times this and is wrong
      there; C2 is not decided, because u is band-invisible on the
      carrier, but the cold pipeline's sign-flipped rho and pi~ lose
      their independent standing. The first attempt built Gram matrices
      and ran blind for 33 minutes; the recorded version runs in seconds
      with a live log. The C-even chain amplitude is new to the register.

  - id: g3_haar_hotloop_bench_2026-08-30
    dir: runs/g3_haar_hotloop_bench_2026-08-30
    title: >-
      The G3 performance wall, measured: a compiled hot loop is worth
      3.9x, not the register's 10-100x, and the second wall is Fraction
    bears_on: [C2, G3]
    detail: >-
      G3's live step names its own blocker -- "an upstream engine
      revision replacing the pure-Python union-find/canon hot loop with
      a compiled core; the measured 50%+ self-time there implies
      10-100x". The first half reproduces exactly: one exact Haar inner
      product at balanced degree 3 takes 13.3 s through the pinned
      engine, and merge_classes is 81% of cumulative time. The
      multiplier does not. A CPython extension doing that function
      -- verified bit-identical on 60,000 random partitions and on every
      real inner product -- gives 3.9x, and Amdahl caps it at 5.3x, so
      the register's estimate was mis-attributed rather than merely
      optimistic. After the swap the profile moves: fractions.Fraction
      becomes 56% and merge_classes falls to 5.6%. flint.fmpq, already
      a dependency, is 7.7x on that arithmetic and exact, taking the
      case to 1.66 s -- 7.8x in total, every value bit-identical. Set
      against the register's own datum (a 2-face half-history at 1h51m
      still inside its FIRST Haar Gram) that is roughly 14 minutes per
      Gram, which leaves the 30-cluster assembly plausibly days rather
      than hours. Nothing is committed into corpus-import/: the core is
      an independent reimplementation of one function and the
      benchmarks patch the module in memory only. The directory also
      carries the range-1 shape-dictionary verification behind the
      cheaper off-axis route.

  - id: g3_offaxis_channels_2026-08-30
    dir: runs/g3_offaxis_channels_2026-08-30
    title: >-
      The off-axis route's steps 2 and 3: in-plane is order eight, the
      perpendicular sector is a new fourth-order coefficient, and neither
      settles the rotation sign
    bears_on: [C2, G3, G14]
    detail: >-
      The off-axis route lists the in-plane transfer before the orbital
      rotation. The order is wrong. c_prim completes a CLOSED cell with
      r = faces - 2, so a fourth-order completion needs six unit squares
      -- the unit cube, which has no coplanar edge-sharing face pair at
      all; the smallest closed cell that carries one is the 1x2x1 box at
      r = 8. The in-plane transfer is therefore order eight in this
      channel and its fourth-order record must come from the
      folded/linked or adjoint terms cellular's scope note excludes. The
      rotation sector IS reachable: the cube's 24 ordered perpendicular
      pairs give S_4 = -11 over 14 histories, c_4,perp =
      -88/(N(N^2-1)^3) = -11/192 at N = 3, ratio exactly 11/20 to the
      normal channel at every rank -- a coefficient the corpus does not
      record. It does not settle the +-f/2 sign: built in the Bloch basis
      from the repository's own cube boundary the channel reaches
      displacement +-2 on every axis, so it is range-2 and its carrier
      projection is outside the four-shape span, which is the one
      dictionary row where all four coefficients are nonzero. The same
      construction corrects the earlier self-test: with the real boundary
      signs the normal channel gives A = -alpha_N/4, so only |A| and the
      ratio C/A = -1/2 are convention-free, and the corpus fixes the sign
      by taking |c_4|. Nothing adjudicated; C2 open.

  - id: g3_chain_amplitude_replication_2026-09-02
    dir: runs/g3_chain_amplitude_replication_2026-09-02
    title: >-
      The two-hop weight u replicated by a second implementation: X_QUANTUM
      exactly on three chain types, with the engine's PVP assembly
    bears_on: [G3, G14, C2]
    detail: >-
      A second computation of the G3 chain route, written the same day
      without reading runs/g3_chain_amplitude_2026-09-02 and agreeing with
      it on every number. It differs where it matters: the resolvent is a
      Krylov minimal polynomial of H0 relative to each vector (no block is
      diagonalised); the fourth-order assembly is the engine's own,
      D - A C1 - C1^T A - (K2 N + N K2)/2 + A A J with A = PVP the SU(3)
      baryonic vertex <P|V|Pbar> = 1, where the first run assumed PVP = 0
      (the two agree on the cumulant only because the A-terms cancel
      between link-disjoint endpoints); and it computes three chain types,
      adding the coplanar-perpendicular chain on which the two hops carry
      opposite signs, with the incidence sign computed from link
      traversals. The second-order register is reproduced first. Result:
      the C-odd cumulant is s * 360421351/40327601932800 with s = +1, -1,
      -1 the (S_sq^2)_PR incidence product, |u| = X_QUANTUM as a rational on
      all three; the C-even cumulant 948253471/40327601932800 on all three.
      116 s on CPU; 9,431 Haar integrals, none above the (2,2) family. Also
      measures the obstacle to the next route: a (3,0)^3-family integral
      of the shared-link pair's baryonic history took 264 s. Decides
      nothing about C2 and promotes neither side.

  - id: g3_shared_link_pair_2026-09-02
    dir: runs/g3_shared_link_pair_2026-09-02
    title: >-
      The shared-link amplitudes assembled from clusters: pi and nu are the
      historical records exactly, rho is neither kernel's
    bears_on: [C2, G3, G14, U5]
    detail: >-
      The G3 route "independent cross-amplitude computation", run. The
      lattice fourth-order element between two plaquettes as a finite sum of
      connected cluster cumulants -- the pair cluster with the engine's full
      assembly and its baryonic histories, the three-plaquette dressings for
      every plaquette sharing a link with the pair, and the cube-completion
      channel through the other four faces of a cube both faces belong to --
      with the cluster machinery of the replication run and the Haar
      integrals of workhouse.haar_epsilon, reading neither kernel. A far
      plaquette gives exactly zero (linked). The in-plane element is the
      historical pi to the digit; the normal element is the agreed
      -5/48 - 4u to the digit, the -5/48 being the cube-completion channel
      computed from primitives; the rotation element is
      588708011765248393/14501180577204921600 = +0.0405972, against the
      historical +0.0082309 and the cold -0.0879716. Every component is
      validated on an agreed record or by a second implementation (the
      corner cluster, identical in workhouse.chain_cluster), and none as a
      whole, which is why rho is recorded as C2's third side and nothing is promoted.
      The epsilon-blind assembly leaves the dressings unchanged and moves
      each pair cluster by exactly -55/13872, refuting U5's -25/512. About
      three hours of CPU per pair; the pure-six integrals that priced the
      route out of reach cost 0.02 s each here.

  - id: g3_corner_third_implementation_2026-09-04
    dir: runs/g3_corner_third_implementation_2026-09-04
    title: >-
      The corner cluster from a third implementation, every dressing of the
      three pairs, the cube completion in both bases, and the historical
      Stage-3I ledger read by cluster
    bears_on: [C2, G3, G14, C10, U5]
    detail: >-
      The last untried route on G3, run both ways. workhouse.loopcalc, a
      Wilson-loop calculus sharing no primitive with the pinned engine,
      reproduces the second-order constants, u on three chain types and all
      58 three-cluster cumulants of the coplanar, stacked and perpendicular
      pairs in the kernel's (0,2) basis, the corner to the digit; the cube
      completion between adjacent faces is -53/768 with the full H0
      dynamics and -106/(N(N^2-1)^3) in the multi-loop closed form.
      workhouse.stage3i decodes the pinned historical word ledger,
      reassembles the 189 records exactly and reads the rotation record by
      cluster: identical to the assembly on every cluster but the
      adjacent-face cube completion, where the historical pipeline holds 8
      of 24 orderings (-31/1536). In the kernel's basis the assembled
      rho is -RHO_CLUSTER, 25/512 below the historical, and C_shp is
      C_historical + 25/1024. Promotes nothing; ADR 0024 records the decision.

  - id: rank_sweep_cumulants_2026-09-04
    dir: runs/rank_sweep_cumulants_2026-09-04
    title: >-
      The fourth-order cluster cumulants at every rank N = 3..40 from the
      third engine, in the kernel's basis
    bears_on: [G14, C2, R2]
    detail: >-
      workhouse.loopcalc with rank-generic single-link spectra (the block
      characteristic polynomial in place of the SU(3) Casimir table), run at
      N = 3..40: the second-order hops in both sectors and both raw leakages,
      the two-hop weight u in both sectors, and the single-contact, fan and
      corner dressings of the perpendicular pair. The second order equals the
      corpus's all-rank t_N and ell_N at every rank and the raw leakage is
      ell_N - 1/C_F in both sectors at every rank. The fourth-order values at
      N >= 4 exist nowhere in the corpus; the all-rank suite reconstructs
      rational functions of N from them and verifies each on held-out ranks.

  - id: u_by_channel_2026-09-04
    dir: runs/u_by_channel_2026-09-04
    title: >-
      The two-hop weight u by irrep-labelled channel on three chain types,
      N = 3..30, with the closed form of every channel
    bears_on: [G14, C2, R2]
    detail: >-
      workhouse.chain_channels: every contribution to the two-hop cumulant
      tagged by the irreps of the links its intermediate states double, on
      the coplanar, bent and in-plane L chains at every rank 3..30. 74
      channels (58 direct, 16 fold) at every rank on every chain; each
      coplanar channel reconstructed exactly as a rational function of N
      (channel_closed_forms.json), a product of the resolvent factors its
      irreps bring, the 74 summing to u(N) identically; the bent chain
      equal to the coplanar in every channel with the factor -1, the L
      chain with one sign, at every rank. ADR 0026.

  - id: beta_n_from_assembly_2026-09-04
    dir: runs/beta_n_from_assembly_2026-09-04
    title: >-
      The fourth-order shape coefficient from the cluster assembly at
      every rank N = 4..70, equal to the corpus's all-rank beta_N exactly
    bears_on: [C2, C10, G14, R2]
    detail: >-
      workhouse.loopcalc.pair_element (the plain Hermitian fourth order on
      the two-face cluster, computed at N = 5..70) with the dressings,
      corner, two-hop weight and adjacent-face cube completion, in the
      kernel's (0,2) basis: pi(N), rho(N), C(N) and beta(N) = 8A + 16C at
      every rank 4..70, equal as rationals to P17(N^2)/(N R20(N^2)) at every
      one; the stacked pair exactly zero and the two shared-link pairs exact
      negatives at every rank where computed -- the pair cluster drops out of
      beta_N (one abstract graph up to conjugating a face). Closed forms in
      N for every quantity; beta's is P17/(N R20) as a rational function.
      The corpus's output-certified all-rank formula, never re-derived, is
      assembled by an engine that reads none of it. ADR 0027.

  - id: beta_n_symbolic_rank_2026-09-04
    dir: runs/beta_n_symbolic_rank_2026-09-04
    title: >-
      The fourth-order cumulants of the beta_N assembly computed over Q(N):
      every closed form derived, the degree bound proved, the identity with
      the corpus's P17/(N R20) as rational functions
    bears_on: [G14, C10, R2]
    detail: >-
      workhouse.symbolic_rank runs the third engine with N an indeterminate
      (scalars in Q(N), the Weingarten function as the symbolic Gram inverse,
      link spectra from the SU(N) Casimirs, every eigencomponent verified):
      the second-order hops, the two-hop weight, the single-contact and fan
      dressings of both pairs, the corner dressing and both cube completions
      come out as one rational function of N each, in both sectors, equal to
      ADR 0025's and ADR 0027's reconstructions and to the per-rank records at
      every rank 3..70. The audit behind the specialisation argument is
      pinned (families balanced with n <= 3, fluxes, resolvent denominators:
      the one integer root >= 4 is N = 4, the state P^3 with every link in
      Lambda^3 F degenerate with the plaquette). The coplanar dressings are
      the exact negatives of the perpendicular ones, so beta_N = -16u + 32d
      - 16 corner + 848/(N(N^2-1)^3), and this equals P17(N^2)/(N R20(N^2))
      identically. ADR 0029.

  - id: channels_symbolic_rank_2026-09-04
    dir: runs/channels_symbolic_rank_2026-09-04
    title: >-
      The two-hop weight and every dressing of the beta_N assembly by
      resolvent channel, over Q(N): the G14 channel decomposition of the
      corner and fan
    bears_on: [G14, C2]
    detail: >-
      workhouse.symbolic_rank.channels on the coplanar, bent and L chains,
      the single-contact and fan dressings of both pairs and the corner:
      every history tagged by the per-link irreps of its intermediate states,
      every channel one rational function of N in each sector. The 74
      channels of ADR 0026 are recovered as identities in Q(N); u is
      universal channel by channel as an identity (bent = -coplanar, L =
      coplanar up to sign); the coplanar and perpendicular dressings compared
      channel by channel; the corner's channels and the resolvent factors
      each brings. ADR 0029.

  - id: path_reduction_2026-09-04
    dir: runs/path_reduction_2026-09-04
    title: >-
      Private-link paths as single links, and universality of the two-hop
      weight and the dressings history by history and integrand by
      integrand, over Q(N)
    bears_on: [G14]
    detail: >-
      loopcalc.reduced_words collapses every maximal run of private links of a
      face to one effective Haar link whose single-link H0 is scaled by the
      run's length (the path-reduction lemma, Peter-Weyl on a product); the
      eight three-face cumulants of the beta_N assembly are the same channel
      by channel on the reduced clusters, five to ten times faster. On the
      reduced clusters the direct term is tagged by the time-ordered insertion
      sequence: the straight and L chains agree in all 124 (sequence, channel)
      terms of u, and within each term the final integrands form the same
      multiset of values; the single-contact dressing agrees in all 128 terms
      once time is reversed, the end roles swapped and one end face
      conjugated. ADR 0030.

  - id: vertex_residuals_2026-09-04
    dir: runs/vertex_residuals_2026-09-04
    title: >-
      Where the universality identity lives: the straight and L chains leave
      the same word in the two shared links once every private path is
      integrated, and not before
    bears_on: [G14]
    detail: >-
      For each of the 124 (sequence, channel) terms of the two-hop weight's
      direct term, on the reduced clusters over Q(N), the final integrands are
      Haar-integrated over chosen links (n = 1 cuts), unitarity is applied,
      and the residual words over the roles l1, l2, wP, wQ are compared
      between the geometries. Integrating the middle face's private links
      alone: residual vectors equal in 14 of 124 terms (totals in all).
      Integrating the end paths as well: equal in all 124, the same set of
      residual words in the two shared links. The lemma behind channel-wise
      universality is an identity of the fully contracted two-link word.
      ADR 0031.

  - id: universality_lemma_2026-09-04
    dir: runs/universality_lemma_2026-09-04
    title: >-
      The universality lemma of the two-hop weight, proved by exhaustion on
      the fourth-order family of words, with the history correspondence and
      the control
    bears_on: [G14, C2]
    detail: >-
      phi deletes the second private letter of the straight middle face,
      keeps the first as the L chain's weight-two link and reverses the second
      shared link. Part A: phi maps every history's straight integrand onto
      its L integrand with the same coefficient (124 terms, 536 integrands).
