  - name: finite_ground_state_residual_identity
    statement: >
      For every finite real symmetric matrix and trial profile satisfying
      sum_j H_ij psi_j = R_i psi_i, q_H(psi f) is exactly one half the sum
      of -H_ij psi_i psi_j (f_i-f_j)^2 plus sum_i R_i (psi_i f_i)^2.
      The residual may be nonconstant; no spectral or continuum theorem is assumed.
    formalizes: [G23, "STUDY:YM:operator-identification"]
    promotes: []

  - name: finite_ground_state_ratio_identity
    statement: >
      The finite ground-state residual identity with R_i defined as
      (H psi)_i/psi_i for any nonvanishing trial vector. The row equation
      is proved by division, for every finite index type, rather than assumed.
    formalizes: [G23, "STUDY:YM:operator-identification"]
    promotes:
      - "finite symmetric matrix ground-state residual identity"

  - name: finite_ground_state_eigenform_identity
    statement: >
      An exact eigenvector H psi = E psi identifies the centered finite
      Hamiltonian form q_H(psi f)-E sum_i(psi_i f_i)^2 with its weighted
      Dirichlet form. Symmetry and the eigen-equation are explicit hypotheses.
    formalizes: [G23, "STUDY:YM:operator-identification"]
    promotes: []

  - name: finite_ground_state_dirichlet_nonneg
    statement: >
      The finite ground-state Dirichlet form is nonnegative when psi_i
      are nonnegative and off-diagonal H_ij are nonpositive. Diagonal
      entries have no sign restriction because the difference vanishes there.
    formalizes: [G23, "STUDY:YM:operator-identification"]
    promotes:
      - "finite symmetric matrix ground-state residual identity"

  - name: finite_ground_state_gap_transfer
    statement: >
      A weighted Poincare inequality transfers to q_H(x)-E sum_i x_i^2
      for every physical x orthogonal to a nonvanishing exact eigenvector psi.
      The proof constructs f_i=x_i/psi_i and transports both the norm and
      orthogonality. The weighted Poincare bound itself is an explicit premise.
    formalizes: [G23, "STUDY:YM:operator-identification", "STUDY:YM:weighted-curvature"]
    promotes: []

  - name: residual_oscillation_gap_budget
    statement: >
      From e1 >= gamma+rlo and e0 <= rhi, the energy difference is at least
      gamma-(rhi-rlo). The upper ground-energy comparison can come from a
      residual supremum or a trial-state expectation; min-max is not formalized here.
    formalizes: [G23]
    promotes: []

  - name: residual_oscillation_positive_gap
    statement: >
      Under the same two energy comparisons, rhi-rlo < gamma implies
      e1-e0 > 0. In the mean-residual application rhi is the trial expectation,
      and no bound on the residual supremum is needed.
    formalizes: [G23]
    promotes:
      - "trial residual gap budget uses its mean above its floor"

  - name: finite_transverse_valley_identity
    statement: >
      For arbitrary finite real families a and u, (sum a_i^2)(sum u_i^2)
      minus (sum a_i u_i)^2 equals one half sum_ij(a_i u_j-a_j u_i)^2.
      This proves the finite pair-sum algebra of a commuting-valley transverse
      potential; it does not assert a Hessian spectrum or analytic compactness.
    formalizes: [G22, "STUDY:YM:matrix-commutator-model"]
    promotes: []

  - name: transverse_slice_form_aggregation
    statement: >
      If n>0, sumK=n(T+2V), and sumK >= 2ncR, then T+V >= T/2+cR.
      This is the algebraic transfer of oscillator slice bounds to a retained
      kinetic term. The analytic slice inequalities remain explicit premises.
    formalizes: [G22, "STUDY:YM:matrix-commutator-model"]
    promotes:
      - "YM flat directions: balanced slice aggregation retains half the kinetic energy"

  - name: transverse_slice_form_identity
    statement: >
      For n>0, T+V-(T/2+cR) equals [n(T+2V)-2ncR]/(2n) exactly.
      Every nonnegative slice margin therefore survives with coefficient 1/(2n).
    formalizes: [G22, "STUDY:YM:matrix-commutator-model"]
    promotes:
      - "YM flat directions: balanced slice aggregation retains half the kinetic energy"

  - name: hardy_linear_remainder
    statement: >
      For z>0, 1/(2z^2)+z-3/2 equals (z-1)^2(2z+1)/(2z^2).
      This is the exact radial optimization remainder after the Hardy scale
      has been fixed, not a proof of the analytic Hardy inequality.
    formalizes: [G22, "STUDY:YM:matrix-commutator-model"]
    promotes: []

  - name: hardy_linear_lower_bound
    statement: >
      For every z>0, 1/(2z^2)+z >= 3/2 by the nonnegative exact remainder.
      Its use in a matrix model bounds ground energy before vacuum subtraction,
      not the difference of the first two spectral levels.
    formalizes: [G22, "STUDY:YM:matrix-commutator-model"]
    promotes: []

  - name: residual_mean_slack_identity
    statement: >
      The difference between e1-e0 and gamma-(meanR-rmin) is exactly
      [e1-(gamma+rmin)]+[meanR-e0]. The residual expectation can be finite
      while the residual is unbounded above.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes:
      - "trial residual gap budget uses its mean above its floor"

  - name: residual_mean_gap_budget
    statement: >
      e1 >= gamma+rmin and the variational comparison e0 <= meanR imply
      e1-e0 >= gamma-(meanR-rmin). This proves the arithmetic consequence;
      closed quadratic-form domains, min-max and the comparison gap are external premises.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes:
      - "trial residual gap budget uses its mean above its floor"

  - name: quartic_trial_residual_completion
    statement: >
      At m^2 omega^3=6 lambda hbar with lambda nonzero, the quartic Gaussian
      trial residual hbar omega/2-m omega^2 x^2/2+lambda x^4 equals
      hbar omega/8+lambda[x^2-m omega^2/(4lambda)]^2 for every real x.
      This is the exact residual square completion, without Gaussian integration.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes: []

  - name: quartic_trial_residual_floor
    statement: >
      Under the optimized frequency relation and lambda>0, the quartic trial
      residual is globally bounded below by hbar omega/8, despite having no
      finite upper bound. The theorem is a pointwise polynomial inequality.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes: []

  - name: quartic_gaussian_gap_budget
    statement: >
      The comparison gap hbar omega minus the difference between residual
      mean 3hbar omega/8 and floor hbar omega/8 is exactly 3hbar omega/4.
      The analytic Gaussian moments and eigenvalue comparisons are not part
      of this arithmetic theorem, so the complete quartic check is not promoted.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes: []

  - name: quartic_gaussian_frequency_remainder
    statement: >
      For q>0 the loss of 5q/4-1/(8q^2)-3q^4/8 from 3/4 is exactly
      (q-1)^2(3q^4+6q^3+9q^2+2q+1)/(8q^2). Here q=omega/omega_star;
      this optimizes the normalized trial bound, not the true quartic gap.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes:
      - "quartic Gaussian certificate is optimized at frequency cubed 6 lambda hbar over mass squared"

  - name: quartic_gaussian_frequency_optimal
    statement: >
      For every positive normalized Gaussian frequency q, the residual-floor
      bound 5q/4-1/(8q^2)-3q^4/8 is at most 3/4, globally.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes:
      - "quartic Gaussian certificate is optimized at frequency cubed 6 lambda hbar over mass squared"

  - name: quartic_gaussian_frequency_optimal_iff
    statement: >
      Among positive q, the Gaussian residual-floor bound equals its global
      maximum 3/4 if and only if q=1. Thus the optimized trial frequency is unique.
    formalizes: [G23, "STUDY:YM:weighted-curvature"]
    promotes:
      - "quartic Gaussian certificate is optimized at frequency cubed 6 lambda hbar over mass squared"

  - name: wilson_spatial_weighted_step
    statement: >
      For a>=0, alpha>0 and f>0, a reciprocal-gap inequality
      rnext<=r/alpha+1/f implies a*alpha*rnext<=a*r+a*alpha/f.
      This is a scalar interface; no Wilson fast floor is assumed as an axiom.
    formalizes: [G19, 'CITE:WILSON_SPATIAL']
    promotes: []

  - name: wilson_spatial_budget_telescope
    statement: >
      Every real sequence satisfying a(j+1)r(j+1)<=a(j)r(j)+b(j)
      satisfies a(n)r(n)<=a(0)r(0)+sum(j<n)b(j), for every natural n.
      The analytic form and physical scale-matching premises are separate.
    formalizes: [G19, 'CITE:WILSON_SPATIAL']
    promotes: []

  - name: groundStateDirichlet_const
    statement: >
      The finite groundStateDirichlet form vanishes on every constant test
      function. This is a finite algebraic identity, without a gap assertion.
    formalizes: [G23, 'CITE:YM_GPU_AUDIT']
    promotes: []

  - name: ground_state_frustration_elimination
    statement: >
      For any eigenvector psi of a finite symmetric real matrix H at energy E,
      finiteMatrixForm H psi minus E times its squared norm equals zero.
      No uncoupled baseline occurs in the statement, so it does not set the
      distinct scalar E0-sum e_* to zero or discharge WR26 assembly.
    formalizes: [G23, 'CITE:YM_GPU_AUDIT']
    promotes: []

  - name: geom_sum_mul_sub
    statement: >
      For every real rho and natural n, (1-rho) times the finite sum of
      rho^j for j<n equals 1-rho^n. No operator decay premise is proved.
    formalizes: [G19, 'CITE:YM_GPU_AUDIT']
    promotes: []

  - name: combes_thomas_geometric_bound
    statement: >
      For 0<=rho<1 the finite sum of rho^j for j<n is at most 1/(1-rho),
      independently of n. This is geometric summation, not a resolvent theorem.
    formalizes: [G19, 'CITE:YM_GPU_AUDIT']
    promotes: []

  - name: combes_thomas_pairing_volume_independent
    statement: >
      Assuming |R(j)|<=C rho^j on j<n, with C>=0 and 0<=rho<1,
      sum(j<n)|R(j)|<=C/(1-rho). The parameter g is unused. This scalar
      conditional absolute-sum lemma does not construct a Wilson resolvent,
      prove its exponential envelope, or identify the W6 bilinear pairing.
    formalizes: [G19, 'CITE:YM_GPU_AUDIT']
    promotes: []

  - name: kotecky_preiss_cluster_sum_bound
    statement: >
      For 0<=rho<1, sum(j<n)rho^(j+1)<=rho/(1-rho). This is a
      finite geometric bound; no Wilson polymer representation is constructed.
    formalizes: [G17, 'CITE:YM_GPU_AUDIT']
    promotes: []

  - name: kotecky_preiss_polymer_activity_bound
    statement: >
      Substituting rho=D*w into the geometric bound is valid when D,w>=0
      and D*w<1. Actual cluster counting and weights, and the additional
      strict Kotecky-Preiss budget, remain separate hypotheses.
    formalizes: [G17, 'CITE:YM_GPU_AUDIT']
    promotes: []

  - name: polymer_free_energy_cauchy_bound
    statement: >
      If |f1-f_inf|<=e1 and |f2-f_inf|<=e2, then |f1-f2|<=e1+e2.
      The common limiting value and error bounds are assumed, not constructed.
    formalizes: [G17, 'CITE:YM_GPU_AUDIT']
    promotes: []
