# Lean theorems, mapped by hand to the claims they bear on.
#
# This file exists because nothing machine-links the T0 layer to anything else:
# a Lean theorem carries no claim id, and `index/claims.jsonl` could not say
# which claim `newton_three` refuted a mechanism for. The precedent is
# `ledger/symbols.yaml`: judgement lives in a curated YAML, the join is
# derived, and validation is mechanical (`tests/test_graph.py`) —
#
#   - every `name` must be a theorem in lean/Workhouse/Basic.lean, and every
#     theorem there must have an entry here;
#   - every `formalizes` entry must resolve to a catalogue record;
#   - every `promotes` entry must match exactly one registered invariant
#     check, by its exact name — and it belongs here only if the theorem,
#     alone or jointly with the other theorems naming the same check, proves
#     the check's whole statement, not one ingredient of it (the cleared
#     denominator forms are equivalent per lean/CLAUDE.md);
#   - a `value` must parse as an exact rational and is the value the theorem
#     itself states.
#
# `statement` is curated the way `meaning` is in symbols.yaml: written from
# the theorem's statement and doc comment, reviewed like any other curated
# line, and copied verbatim into the catalogue at generation time. Where no
# defensible link exists the lists stay empty — an honest gap beats an
# invented edge.
schema: theorems/v1
source: lean/Workhouse/Basic.lean

theorems:
  - name: wilson_taylor_polynomial_envelope
    statement: >
      For every natural n, n^3 <= 4*2^n. This absorbs polynomial row growth
      into a Taylor radius; kernel locality and analytic coefficient bounds
      are established separately in the Wilson shell derivation.
    formalizes: ['CITE:WILSON_SHELL']
    promotes: []

  - name: wilson_complex_gram_budget
    statement: >
      (1/9)(9/8)^2+2/8+(1/8)^2=13/32 exactly. These rational terms
      budget the complex source Gram defect once the norm bounds hold.
    formalizes: ['CITE:WILSON_SHELL']
    promotes: []

  - name: wilson_uniform_carrier_coefficient
    statement: >
      For real t, gamma and xi, 8 gamma xi <= t implies
      t/4 <= t/2-2 gamma xi. No spectral or matching premise is axiomatized.
    formalizes: ['CITE:WILSON_SHELL', G18, G19]
    promotes: []

  - name: wilson_symmetric_block_identity
    statement: >
      In any monoid, (A K A)^(n+1)=A(K A A)^n K A for every natural n.
      This retains both symmetric transfer endpoints under exact blocking.
    formalizes: [G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_disconnected_vacuum_cancel
    statement: >
      A nonzero independent scalar vacuum factor cancels from a normalized
      marked expectation. Tensor factorization of the amplitudes is separate.
    formalizes: [G17, G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_geometric_telescope
    statement: >
      For every real q and natural n, (1-q) sum_(j<n) q^j = 1-q^n.
      This is the finite time-sum identity, without an assumed infinite limit.
    formalizes: [G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_damped_time_denominator
    statement: >
      For every positive real tau and energy, tau/(exp(tau energy)-1)
      is at most 1/energy. This is uniform over arbitrarily large energy;
      spectral calculus and the interacting operator bound are separate.
    formalizes: [G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_time_kernel_split
    statement: >
      For real tau and x not equal to one, tau x/(x-1)=tau+tau/(x-1).
      Substituting x=exp(tau energy) gives the positive time-kernel split.
    formalizes: [G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_polymer_kp_budget
    statement: >
      For d>=2 and r<=1/2, (d+1)r/[d^2(1-r)]<=1. This is the
      abstract incompatibility-budget arithmetic; the polymer construction,
      activity estimates and rooted counting are analytic inputs.
    formalizes: [G17, G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_relative_gap_budget
    statement: >
      c q-2 gamma eta q=(c-2 gamma eta)q. The two eigenvalue shifts
      spend twice the centered kernel error after matching is established.
    formalizes: [G18, G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_relative_gap_positive
    statement: >
      If q>0 and 2 gamma eta<c, then c q-2 gamma eta q is strictly positive.
      No shell existence or Wilson matching hypothesis is axiomatized.
    formalizes: [G18, G19, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_source_weight_defect
    statement: >
      amplitude^2-(amplitude-error)^2=error(2 amplitude-error).
      A source-amplitude comparison must precede its use as a weight bound.
    formalizes: [G18, 'CITE:WILSON_MARKED']
    promotes: []

  - name: wilson_source_weight_positive
    statement: >
      If error<amplitude, then (amplitude-error)^2>0. This is the scalar
      positivity implication, not a construction of the source frame.
    formalizes: [G18, 'CITE:WILSON_MARKED']
    promotes: []

  - name: rank_law_numerator
    statement: >
