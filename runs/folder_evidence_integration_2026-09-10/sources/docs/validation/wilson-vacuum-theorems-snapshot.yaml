  - name: singleContactEven_eq
    statement: >
      The C-even single-contact dressing of a shared-link pair is minus the
      C-even hopping squared over the plaquette rest energy, at every rank:
      singleContactEven(N) = -ell_N^2 / (2 C_F).
    formalizes: [G14, "CONST:SINGLE_CONTACT_DRESSING_EVEN_N"]
    promotes: []

